  {id:"990.064",nome:"Tuki",editora:"Galápagos",cat:"Habilidade Motora",idade:"5+",jog:"1-4",anos:"Y1-Y3",comp:"12 pedras coloridas (3 de cada cor: roxa, azul, cinza, amarela), 12 blocos de neve (3 formatos), 50 cartas nível normal, 50 cartas nível avançado, 1 dado.",obs:"",regras:"Preparação: separe as pedras coloridas (roxa, azul, cinza, amarela) e os 3 formatos de blocos de neve para cada jogador. Escolha o nível (normal ou avançado) e embaralhe as 50 cartas correspondentes em uma pilha. Coloque as cartas de desafio visíveis a todos.\n\nObjetivo: ser o mais rápido a montar exatamente a estrutura mostrada na carta de desafio, ganhando o maior número de cartas.\n\nComo jogar: todos jogam SIMULTANEAMENTE — sem turnos! Revele 1 carta de desafio: ela mostra a estrutura de cima (visão aérea) e de lado (visão lateral). Todos os jogadores montam com suas peças tentando replicar exatamente a estrutura mostrada. Quando terminar, grite 'TUKI!' e mostre sua estrutura para verificação por todos. Correto = ganhe a carta como 1 ponto; errado = continue tentando (outros ainda podem ganhar). Após a carta ser vencida, revele a próxima imediatamente.\n\nFim e vitória: após todas as cartas da pilha, quem tiver mais cartas vence o campeonato de construção ártica!"},
  {id:"990.065",nome:"Caiu, Perdeu",editora:"Pais e Filhos",cat:"Habilidade Motora",idade:"4+",jog:"2+",anos:"Y1-Y3",comp:"Torre de madeira com base, 54 peças coloridas de diferentes formas.",obs:"",regras:"Preparação: encaixe as 54 peças coloridas de diferentes formas sobre a base de madeira, empilhando-as até criar uma torre alta. Cada jogador escolhe uma posição em volta da torre.\n\nObjetivo: retirar peças sem derrubar a torre, evitando acumular pontos negativos.\n\nComo jogar: na sua vez, retire 1 peça de qualquer posição da torre (exceto da base e do topo). Regra: use apenas os dedos do meio, anelar e mínimo — NÃO use os dedos indicadores! Coloque a peça retirada no topo da torre. Qualquer peça que caia DURANTE a retirada vai para você como ponto negativo. Se a peça escolhida também cair, é dela + de todas as outras que caíram juntas. Se a torre inteira desmoronar em sua jogada, você recebe pontos negativos por cada peça caída no chão.\n\nFim e vitória: o jogo termina quando o grupo decidir parar ou a torre cair definitivamente. Some os pontos negativos de cada jogador — quem tiver MENOS pontos negativos vence o desafio de equilíbrio!"},
  {id:"92",nome:"Stop",editora:"Singa",cat:"Palavras",idade:"8+",jog:"2+",anos:"Todos",comp:"Folhas de papel e canetas (ou quadro branco).",obs:"",regras:"Preparação: distribua papel e caneta para cada jogador, ou use o quadro branco. Definam as categorias antes de começar — as clássicas são Nome, Animal, Objeto, Cidade e Comida, mas o grupo pode criar as próprias (Ex Presidente, Marca, Personagem de Filme, etc.).\n\nObjetivo: preencher todas as categorias com palavras válidas que comecem com a letra sorteada, buscando respostas que ninguém mais escreveu.\n\nComo jogar: 1 jogador fala o alfabeto mentalmente em silêncio enquanto outro diz 'STOP!' — a letra em que parou é a letra da rodada. Todos escrevem simultaneamente e em silêncio 1 palavra por categoria começando por essa letra. Quem preencher TODAS as categorias primeiro grita 'STOP!' e o tempo acaba para todos. Pontuação: palavra única (ninguém mais escreveu) = 10 pts; igual a outro jogador = 5 pts; em branco ou inválida = 0. Desafiem palavras duvidosas por votação.\n\nFim e vitória: some os pontos de todas as rodadas. Quem acumular mais pontos vence o campeonato de vocabulário!"},
  {id:"93",nome:"Unlock",editora:"Space Cowboys",cat:"Cooperativo",idade:"10+",jog:"1-6",anos:"Y4-Y5",comp:"Baralho de cartas impressas representando uma sala de escape. App gratuito no celular para timer, sons e dicas.",obs:"",regras:"Preparação: separe as cartas do cenário escolhido (numeradas). Instale o app Unlock! gratuitamente no celular/tablet e inicie o timer de 60 minutos no app. Leia a carta de introdução para o grupo.\n\nObjetivo: resolver todos os enigmas da sala de escape e encontrar o código de saída final dentro de 60 minutos.\n\nComo jogar: as cartas numeradas representam objetos na cena. Para COMBINAR objetos: some os números de 2 cartas — se existir uma carta com o número resultante, você descobriu algo novo! Para ABRIR fechaduras: você precisa ter encontrado a chave correspondente primeiro (nunca tente adivinhar por força bruta — perde pontos). Objetos ocultos: algumas cartas têm um pequeno ícone de olho com um botão escondido no app — procure sempre! O app reproduz sons de ambiente, fornece contexto narrativo e permite solicitar dicas (cada dica reduz a pontuação final). Trabalhem em equipe: dividam as cartas, compartilhem descobertas em voz alta.\n\nFim e vitória: localize o código de saída e insira no app antes dos 60 minutos. Sua pontuação (1-5 estrelas) depende do tempo restante e das dicas usadas. Zero minutos restantes = derrota!"},
  {id:"990.066",nome:"Genius",editora:"Estrela",cat:"Habilidade Motora",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"Aparelho eletrónico Genius com 4 botões coloridos e iluminados, sons.",obs:"",regras:"Preparação: instale as baterias no aparelho Genius e ligue-o. Escolha um dos modos: Solo (1 jogador bate seu recorde), Versus (2 jogadores, turnos alternados), ou em roda (cada pessoa repete e adiciona).\n\nObjetivo: repetir a sequência de cores e sons gerada pelo aparelho, que cresce 1 elemento a cada rodada com sucesso.\n\nComo jogar — Modo Solo: o aparelho acende os botões em uma sequência (ex.: Verde → Vermelho → Verde → Azul). Preste muita atenção à ordem! Em seguida, repita exatamente a mesma sequência pressionando os botões na ordem correta. Acertou tudo? A sequência cresce mais 1 elemento na próxima rodada. Errou? O aparelho emite um som de erro. Você tem 3 tentativas por rodada antes do game over. Modo Versus: os dois jogadores alternam quem repete; quem errar perde. Modo Roda: cada jogador repete a sequência e adiciona 1 novo botão.\n\nFim e vitória: no modo individual, o jogo termina ao errar 3 vezes. Sua pontuação é o número da sequência máxima alcançada. Recorde inicial a superar: 10 elementos!"},
  {id:"94",nome:"Backpacker",editora:"Wildcard Games",cat:"Tabuleiro",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"110 cartas de destinos e eventos, manual com regras.",obs:"",regras:"Preparação: embaralhe as 110 cartas e distribua 5 de destino para cada jogador como mão inicial. Defina o objetivo: completar X países ou fazer o maior número de países em Y rodadas.\n\nObjetivo: ser o primeiro a completar sua rota de viagem coletando destinos que formem uma volta ao mundo coerente, com mais pontos de viagem.\n\nComo jogar: na sua vez, jogue 1 carta de destino da mão para iniciar ou expandir sua rota no centro da mesa — cada novo destino deve conectar geograficamente ao anterior (da Europa vai para o Oriente Médio, dali para a Ásia, etc.). Cartas de evento mudam o jogo: 'Passagem Aérea Grátis' permite pular para qualquer destino; 'Mala Perdida' remove 1 destino; 'Conexão Perdida' pula sua vez. Rotas temáticas concedem bônus: 3 destinos de aventura = +3 pontos; 3 culturais = +3 pontos; 3 gastronômicos = +3 pontos. Compre 1 carta ao fim de cada turno.\n\nFim e vitória: o primeiro a completar a meta de países vence. Em empate, desempata quem tiver mais pontos de bônus de rotas temáticas!"},
  {id:"95",nome:"Batalha Naval",editora:"—",cat:"Clássico",idade:"8+",jog:"2",anos:"Todos",comp:"Grade impressa 10x10 para cada jogador, caneta e papel.",obs:"Jogo impresso — copiar a grade para jogar",regras:"Preparação: cada jogador desenha ou usa uma grade 10×10 (letras A-J nas linhas, números 1-10 nas colunas) — você precisa de 2 grades: uma para sua frota e uma para marcar seus ataques. Posicione secretamente a frota: 1 Porta-Aviões (5 casas), 1 Destroyer (4 casas), 2 Fragatas (3 casas cada), 1 Submarino (2 casas). Navios podem ser horizontal ou vertical, nunca se tocando.\n\nObjetivo: ser o primeiro a afundar toda a frota adversária chamando coordenadas sistematicamente.\n\nComo jogar: alternadamente, chame uma coordenada (ex.: 'D7'). O adversário responde: 'Água!' (nenhum navio) ou 'Acertou!' (há um navio ali). Quando todos os segmentos de um navio forem acertados, o adversário anuncia 'Afundou o [nome do navio]!' Marque seus ataques na grade de ataque (● = acerto, ○ = água) e os tiros recebidos na grade de defesa. Use lógica: após um acerto, atire nas casas adjacentes para encontrar a extensão do navio.\n\nFim e vitória: o primeiro a afundar os 5 navios adversários vence a batalha naval!"},
  {id:"990.067",nome:"Taco Cat Goat Cheese Pizza (PT)",editora:"Dolphin Hat Games",cat:"Cartas",idade:"8+",jog:"2-8",anos:"Todos",comp:"66 cartas em português (Taco, Gato, Cabra, Queijo, Pizza, Narval, Gorila, Marmota), manual PT.",obs:"",regras:"Versao em portugues do Taco Cat Goat Cheese Pizza. Jogue cartas dizendo a sequencia em voz alta. Quando a palavra coincidir com a imagem, bata na pilha! O mais lento pega as cartas. Gestos especiais para Narval, Gorila e Marmota. Livre-se de todas as cartas para vencer."},
  {id:"990.068",nome:"Taco Cat Goat Cheese Pizza ao Contrário",editora:"Dolphin Hat Games",cat:"Cartas",idade:"8+",jog:"2-8",anos:"Todos",comp:"64 cartas (Taco, Gato, Cabra, Queijo, Pizza, Panda, Alce, Leão-Marinho), manual.",obs:"",regras:"Preparação: embaralhe as 64 cartas e distribua igualmente entre 2-8 jogadores. Cada um mantém sua pilha virada para baixo sem ver.\n\nObjetivo: ser o primeiro a descartar todas as cartas com a lógica INVERTIDA — bater quando a palavra NÃO coincide com a imagem.\n\nComo jogar: idêntico ao Taco Cat original em mecânica — em sentido horário, cada jogador vira uma carta enquanto o grupo diz a sequência 'Taco, Gato, Cabra, Queijo, Pizza...'. PORÉM, a lógica é completamente invertida: bata na pilha quando a palavra dita for DIFERENTE da imagem revelada. Se a palavra COINCIDIR com a imagem, NÃO bata! O mais lento ou quem bater na hora errada pega a pilha inteira. O cérebro luta ferozmente contra o próprio instinto de bater quando coincide. Personagens especiais novos: Panda (dois olhos com as mãos), Alce (antlers com os braços), Leão-Marinho (bata as palmas) — faça o gesto antes de bater.\n\nFim e vitória: o primeiro a descartar todas as cartas vence. Combine com o original para sessões de caos absoluto!"},
  {id:"990.069",nome:"Taco Chapéu Bolo Presente Pizza",editora:"Dolphin Hat Games",cat:"Cartas",idade:"8+",jog:"2-8",anos:"Todos",comp:"64 cartas (Taco, Chapéu, Bolo, Presente, Pizza, Unicórnio, Ninja, Macaco), manual.",obs:"",regras:"Preparação: embaralhe as 64 cartas e distribua igualmente entre 2-8 jogadores. Cada um mantém sua pilha virada para baixo.\n\nObjetivo: ser o primeiro a descartar todas as cartas, sendo rápido com reflexos e gestos — mas com a nova sequência que confunde jogadores experientes do Taco Cat!\n\nComo jogar: idêntico ao Taco Cat original, mas com nova sequência: diga 'Taco, Chapéu, Bolo, Presente, Pizza, Taco, Chapéu...' enquanto vira cartas. Quando a palavra coincide com a imagem, todos batem na pilha — o mais lento leva tudo. A nova sequência de palavras e imagens tripa jogadores habituados ao original, porque o cérebro automaticamente quer dizer 'Cat' quando vê o gato. Personagens especiais únicos: Unicórnio (faça o chifre com o dedo no centro da testa), Ninja (posição de luta com as mãos), Macaco (arranhado as axilas).\n\nFim e vitória: o primeiro a descartar todas as cartas vence. Para mega sessão, misture os 3 baralhos Taco Cat em uma partida épica!"},
  {id:"990.070",nome:"Cowboys Acelerados",editora:"Ludus Spirit",cat:"Habilidade Motora",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas de duelo, fichas de pontuação e instrucoes.",obs:"",regras:"Preparação: embaralhe as cartas de duelo e coloque a pilha no centro da mesa. Distribua fichas de pontuação iguais para cada jogador. Todos se posicionam ao redor da mesa com as mãos visíveis.\n\nObjetivo: acumular mais fichas sendo o cowboy com melhores reflexos E maior precisão — velocidade sem precisão custa pontos!\n\nComo jogar: o jogador da vez vira a carta do topo da pilha devagar, revelando-a para todos simultaneamente. A carta indica 1 dos 3 gestos de faroeste: SACAR A PISTOLA (mão rápida à cintura e apontar), LEVANTAR AS MÃOS (ambas as mãos para o alto imediatamente), ou AGACHAR (abaixe rapidamente o corpo). Todos os jogadores devem executar o gesto correto — o MAIS RÁPIDO a executar corretamente ganha 1 ficha. PENALIDADE: fazer o gesto errado (qualquer gesto diferente do indicado) perde 1 ficha já conquistada. Cartas especiais trazem sequências de 2 gestos ou gestos combinados.\n\nFim e vitória: quando as cartas acabarem, some as fichas. O cowboy com mais fichas é o mais veloz e preciso do Velho Oeste!"},
  {id:"990.071",nome:"Duelo",editora:"Universo Uia",cat:"Comunicação",idade:"10+",jog:"2+",anos:"Y4-Y5",comp:"40 cartas de personagens, 25 cartas de ações.",obs:"2ª cópia",regras:"Mesmas regras do Duelo (990.001). 2a copia disponivel."},
  {id:"990.072",nome:"7 Famílias Diversas Como a Gente",editora:"Universo Uia",cat:"Cartas",idade:"6+",jog:"2-6",anos:"Todos",comp:"Cartas de 7 famílias diversas. 4 modos de jogo.",obs:"2ª cópia",regras:"Mesmas regras do 7 Familias (990.002). 2a copia."},
  {id:"990.073",nome:"Memorelas",editora:"Cecerelê",cat:"Memória",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"32 peças de madeira com pares de mulheres brasileiras.",obs:"2ª cópia",regras:"Mesmas regras do Memorelas (990.003). 2a copia."},
  {id:"990.074",nome:"Incríveis Inventoras",editora:"Fagulha Jogos",cat:"Conhecimento",idade:"8+",jog:"2-4",anos:"Todos",comp:"12 peças dupla-face com 2 invenções cada, 12 peças dupla-face com 2 inventoras cada, folha de gabarito.",obs:"",regras:"Preparação: separe as 12 peças dupla-face de inventoras e as 12 de invenções. Coloque o gabarito à parte para conferência ao final. Pode ser jogado individualmente, em duplas ou em equipe.\n\nObjetivo: conectar corretamente cada inventora à sua respectiva invenção, formando uma teia de conexões históricas.\n\nComo jogar: cada peça de inventora tem 2 mulheres cientistas/inventoras; cada peça de invenção tem 2 criações. Encaixe as peças conectando inventora à invenção — as peças se encaixam fisicamente apenas quando a conexão está correta. Tente fazer as conexões por dedução (o que você já sabe) ou por lógica (eliminando opções). Quando tiver dúvida, consulte dicas no verso das peças. Ao final, confira com o gabarito.\n\nFim e aprendizado: após completar, leia em voz alta sobre cada inventora retratada — Marie Curie, Ada Lovelace, Hedy Lamarr e muitas outras. Este jogo é especialmente poderoso para mostrar às alunas que mulheres sempre foram protagonistas da ciência, mesmo quando apagadas da história!"},
  {id:"990.075",nome:"Quebra-Cabeça Revolucionárias",editora:"Cecerelê",cat:"Quebra-Cabeça",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"100 peças de quebra-cabeça.",obs:"",regras:"Preparação: espalhe as 100 peças com a face da ilustração para cima sobre uma superfície ampla.\n\nObjetivo: montar o quebra-cabeça revelando a ilustração com mulheres revolucionárias de diferentes épocas e contextos.\n\nComo montar: comece pelas bordas (peças com 1 ou 2 lados retos), montando o contorno. Em seguida, identifique áreas coloridas distintas — rostos, roupas, fundos — e trabalhe de dentro para fora. Em grupo, distribua seções entre os participantes. As 100 peças tornam o desafio acessível para Y1-Y3 mas divertido para todas as idades.\n\nFim e aprendizado: ao concluir, identifique cada mulher retratada. Quem são elas? O que fizeram? De qual país/época vêm? Use o quebra-cabeça como ponto de partida para pesquisar e discutir sobre Rosa Parks, Frida Kahlo, Marie Curie, Zumbi dos Palmares e outras figuras que desafiaram o status quo e transformaram o mundo!"},
  {id:"990.076",nome:"Quebra-Cabeça Brasil Gigante",editora:"Grow",cat:"Quebra-Cabeça",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"45 peças grandes representando os estados do Brasil.",obs:"",regras:"Preparação: espalhe as 45 peças grandes sobre uma superfície ampla. Cada peça representa um estado (ou o Distrito Federal) do Brasil, com o nome impresso.\n\nObjetivo: montar o mapa completo do Brasil encaixando corretamente todos os estados em suas posições geográficas.\n\nComo montar: comece pelos estados de formato mais reconhecível (Minas Gerais, Mato Grosso, Pará) ou pelos estados do litoral, que formam a borda leste. As peças são grandes, facilitando o manuseio para Y1-Y3. Em grupo, divida as regiões (Norte, Nordeste, Centro-Oeste, Sudeste, Sul) entre as equipes.\n\nFim e aprendizado: ao concluir, desafie a turma: Qual é a capital de cada estado? Qual estado tem a maior área? Qual tem a menor? Qual é o mais populoso? Qual faz fronteira com qual? As peças grandes permitem escrever nas bordas ou usar adesivos para adicionar informações. Excelente ferramenta para aulas de geografia do Brasil!"},
  {id:"990.077",nome:"Quebra-cabeça 100 Peças – Planetas",editora:"Grow",cat:"Quebra-Cabeça",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"100 peças.",obs:"",regras:"Preparação: espalhe as 100 peças com a face colorida para cima sobre uma superfície ampla. Pode ser montado individualmente ou em grupo.\n\nObjetivo: montar o quebra-cabeça revelando a ilustração colorida do sistema solar com os 8 planetas.\n\nComo montar: comece pelas bordas e pelo fundo escuro do espaço. Em seguida, identifique os planetas pelas cores características — Saturno com seus anéis, a mancha vermelha de Júpiter, a cor azul de Netuno. As 100 peças tornam o desafio adequado para Y1-Y3 mas atraente para todos.\n\nFim e aprendizado: ao concluir, observe as proporções na imagem: Por que o Sol é tão maior? Por que Mercúrio é tão pequeno? Aprenda a ordem dos planetas: Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano, Netuno. Desafio extra: quantas luas tem cada planeta? Qual é o mais quente? O mais frio? Uma janela visual para o universo!"},
  {id:"990.078",nome:"Quebra-cabeça 200 Peças – Ciclo da Água",editora:"Grow",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Y1-Y3",comp:"200 peças.",obs:"",regras:"Preparação: espalhe as 200 peças com a face da imagem para cima. Recomendado fazer em grupo ou em duplas — 200 peças são um bom desafio para Y1-Y3.\n\nObjetivo: montar o quebra-cabeça revelando a ilustração educativa do ciclo completo da água.\n\nComo montar: comece pelas bordas e pelos elementos de maior contraste — o céu azul, a terra marrom, o mar/rio azul-verde. As setas do ciclo na imagem ajudam a orientar as peças intermediárias. Divida em seções: atmosfera (nuvens, chuva), superfície (rios, oceano), solo (infiltração), relevo (montanhas).\n\nFim e aprendizado: ao concluir, identifique cada fase do ciclo: evaporação (água vira vapor), condensação (vapor vira nuvem), precipitação (chuva/neve), escoamento superficial (rios) e infiltração (água no solo/lençol freático). Discuta: como a poluição afeta esse ciclo? Por que desmatamento prejudica as chuvas? Uma aula de ciências embrulhada em diversão!"},
  {id:"990.079",nome:"Xadrez Magnético",editora:"Amigold",cat:"Clássico",idade:"6+",jog:"2",anos:"Todos",comp:"31 peças magnéticas (falta 1 peça branca).",obs:"Falta 1 peça branca",regras:"Preparação: verifique quais 31 peças estão presentes (falta 1 branca — identifique qual antes de começar). Posicione as peças na formação padrão: torres nos cantos, cavalos ao lado, bispos, dama na sua cor, rei, e 8 peões na segunda fileira. As peças magnéticas prendem ao tabuleiro — ótimo para jogar em superfícies não planas.\n\nObjetivo: dar XEQUE-MATE no rei adversário — colocá-lo em situação de ataque sem possibilidade de escape.\n\nComo jogar: cada peça tem movimentos únicos: Rei (1 casa em qualquer direção — nunca pode entrar em xeque), Dama (livre em linhas e diagonais — mais poderosa), Torre (horizontal e vertical — qualquer distância), Bispo (diagonal — qualquer distância), Cavalo (L: 2 casas em uma direção + 1 perpendicular — única que salta peças), Peão (avança 1 casa, 2 na estreia; captura na diagonal; promove ao chegar no fim). Movimentos especiais: Roque (rei + torre, segurança), En Passant (captura especial de peão), Promoção.\n\nFim e vitória: xeque-mate = vitória imediata. Afogamento (rei sem movimento, não em xeque) = empate."},
  {id:"990.080",nome:"Pula Macaco",editora:"Estrela",cat:"Habilidade Motora",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"1 tronco, 2 copas de árvore, 4 lança-macacos, 16 macaquinhos coloridos, 16 bananas de cartão, folha de adesivos.",obs:"",regras:"Preparação: monte o tronco da árvore com as duas copas no topo. Distribua os lança-macacos e os 4 macaquinhos de cada cor para cada jogador. Posicione o tronco no centro da mesa ou no chão.\n\nObjetivo: arremessar todos os seus macaquinhos para dentro das copas da árvore, acumulando mais pontos que os adversários.\n\nComo jogar: na sua vez, posicione o lança-macaco e arremesse 1 macaquinho em direção às copas da árvore. Macaquinho que cair dentro da copa = ponto marcado (cada copa tem valor diferente)! Macaquinho que cair fora = sem ponto. Depois de arremessar todos os seus 4 macacos, some os pontos. Bananas de cartão colocadas nas copas concedem bônus extras quando um macaquinho pousar sobre elas. Cada jogador tem 4 arremessos por rodada.\n\nFim e vitória: após todos os jogadores arremessarem, some os pontos de cada um. O jogador com mais pontos acumulados vence a batalha dos macacos nas copas!"},
  {id:"990.081",nome:"Numa Fria",editora:"Art Brink",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Conjunto de pecas de gelo (cubinhos e blocos), 1 boneco ou personagem central.",obs:"",regras:"Preparação: monte o iglu encaixando todos os cubinhos e blocos de gelo em volta do boneco central — ele fica no centro da estrutura. Cada jogador escolhe uma posição ao redor do iglu.\n\nObjetivo: retirar peças de gelo do iglu sem fazer o boneco cair. Quem derrubá-lo perde!\n\nComo jogar: na sua vez, escolha e retire cuidadosamente 1 peça de gelo do iglu sem derrubar o boneco central. Pode usar os dedos que quiser, mas deve ser delicado — as peças se encaixam de forma cada vez mais instável conforme o jogo avança. Retire a peça e coloque-a de lado (fora do jogo). Passe a vez ao próximo jogador. Quanto mais peças são retiradas, mais o boneco balança e o risco aumenta!\n\nFim e vitória: o jogador que derrubar o boneco perde imediatamente a rodada. Os outros jogadores dividem os pontos ou jogam mais rodadas. Quem terminar mais rodadas sem derrubar o boneco é o campeão do equilíbrio polar!"},
  {id:"990.082",nome:"Torre Maluca",editora:"Art Brink",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Torre de blocos coloridos de madeira.",obs:"",regras:"Preparação: empilhe todos os blocos de madeira coloridos em andares de 3 blocos cada, alternando a orientação a cada andar (horizontal, vertical, horizontal...). Cada andar tem 3 blocos lado a lado.\n\nObjetivo: retirar e reposicionar blocos sem derrubar a torre, sendo o último a jogar antes do desmoronamento.\n\nComo jogar: na sua vez, usando APENAS 3 dedos de UMA mão, retire 1 bloco de qualquer andar (exceto o andar mais alto e o andar abaixo do mais alto). Você pode usar os dedos para testar quais blocos estão soltos antes de puxar. Após retirar o bloco com sucesso, coloque-o no TOPO da torre formando um novo andar. Passe a vez ao próximo jogador. Quanto mais a torre cresce e fica desbalanceada, maior o risco!\n\nFim e vitória: o jogador que fizer a torre desmoronar perde a rodada! Os outros jogadores somam pontos ou simplesmente celebram. Jogue múltiplas rodadas e o jogador que menos vezes derrubar a torre vence o torneio!"},
  {id:"990.083",nome:"Dobble (Spot It!)",editora:"Spot it Games",cat:"Habilidade Motora",idade:"6+",jog:"2-8",anos:"Todos",comp:"55 cartas circulares, cada uma com 8 simbolos diferentes. Manual com 5 modos de jogo.",obs:"",regras:"Preparação: embaralhe as 55 cartas circulares. Cada carta tem 8 símbolos de tamanhos diferentes. A mágica do Dobble: entre QUAISQUER duas cartas do baralho, existe EXATAMENTE 1 símbolo em comum!\n\nObjetivo: ser o mais rápido a identificar o símbolo comum entre duas cartas — em 5 modos diferentes.\n\nModo 1 - A Banheira: cada jogador tem uma pilha. Vire cartas do centro para cada pilha — declare o símbolo comum entre a sua carta do topo e a carta central para coletar. Mais cartas = mais pontos.\n\nModo 2 - A Fonte: todos compartilham 1 carta central virada. Grite o símbolo em comum entre sua carta e a central para se livrar da sua carta e passar para o adversário.\n\nModo 3 - A Quente: uma carta circula entre os jogadores como batata quente. Declare o símbolo em comum com a sua carta e passe para o próximo rapidamente.\n\nModo 4 - O Presente: pilha central virada; grite o símbolo e ganhe a carta.\n\nFim e vitória: depende do modo — colete mais cartas ou livre-se de todas primeiro!"},
  {id:"990.084",nome:"Knock Knock Dungeon",editora:"Paper Games",cat:"Cooperativo",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"63 cartas de masmorras, 17 fichas de recursos, manual.",obs:"",regras:"Preparação: distribua 1 herói para cada jogador (2-4 heróis disponíveis, cada um com habilidade única). Monte os corredores de masmorra com as cartas de missão embaralhadas em pilha. Distribua as fichas de recursos iniciais.\n\nObjetivo: percorrer cooperativamente os corredores da masmorra, derrotando monstros e obstáculos, e chegar ao tesouro final com toda a equipe viva.\n\nComo jogar: na sua vez, revele a carta do topo da masmorra — pode ser monstro (exige cartas de combate), obstáculo (exige carta de habilidade), item (bônus) ou armadilha (penalidade). Para derrotar monstros, os jogadores combinam livremente suas cartas de recursos (espadas, escudos, magias, poções). Discutam estratégia em voz alta. Use as habilidades especiais dos heróis em momentos críticos. Cartas de poção curam heróis feridos.\n\nFim e vitória: o grupo vence ao derrotar o boss final com toda a equipe viva. Se qualquer herói for eliminado antes de chegar ao final, todos perdem! Dificuldade aumenta com o número de corredores escolhidos."},
  {id:"990.085",nome:"Quem Foi?",editora:"Paper Games",cat:"Cartas",idade:"8+",jog:"2-5",anos:"Todos",comp:"49 cartas de personagens históricos e fictícios, manual.",obs:"",regras:"Preparação: embaralhe as 49 cartas de personagens históricos e fictícios. Cada jogador pega 1 carta e prende na testa (ou segura levantada) sem olhar — todos veem seu personagem, mas você não sabe quem é!\n\nObjetivo: adivinhar o personagem da sua carta fazendo perguntas de sim ou não, acumulando pontos por adivinhar com o menor número de perguntas.\n\nComo jogar: em sentido horário, o jogador da vez faz 1 pergunta que possa ser respondida com SIM ou NÃO (ex.: 'Sou do Brasil?', 'Sou uma mulher?', 'Sou um personagem fictício?', 'Vivi antes do século XX?', 'Sou famoso na ciência?'). Os outros respondem honestamente. Você pode tentar adivinhar a qualquer momento — mas se errar, é eliminado! Pontuação: adivinhou com 3 perguntas = 5 pts; com 5 = 3 pts; com 7+ = 1 pt.\n\nFim e vitória: o jogo termina quando todos adivinharem ou forem eliminados. Quem acumular mais pontos ao longo das rodadas vence o duelo de deduções históricas!"},
  {id:"990.086",nome:"Trio",editora:"Paper Games",cat:"Estratégia",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"36 cartas numeradas (valores 1 a 7 em tres cores), manual.",obs:"",regras:"Preparação: embaralhe as 36 cartas numeradas (valores 1 a 7, em 3 cores, 3 cópias de cada número). Distribua algumas cartas viradas para baixo na frente de cada jogador e deixe outras viradas na mesa (visíveis a todos).\n\nObjetivo: ser o primeiro a capturar um Trio — 3 cartas do mesmo número, independente de cor.\n\nComo jogar: na sua vez, tente completar um Trio de uma de duas formas: (A) Peça uma carta virada a outro jogador dizendo o número que procura — se ele tiver, ele entrega; (B) Revele uma carta virada na mesa. Se a carta revelada ou entregue completar o seu trio (você já tem as outras 2), capture as 3! Mas se errar 3 vezes ao pedir cartas (o jogador não tinha), você perde pontos penalidade. Memória de quais cartas foram vistas é essencial para fazer as pedidas certas.\n\nFim e vitória: o primeiro a capturar um Trio vence a rodada — ou jogue até todas as cartas estarem capturadas e some os trios. Mais trios = mais pontos!"},
  {id:"990.087",nome:"Misty",editora:"Paper Games",cat:"Estratégia",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"54 cartas com valores e efeitos especiais, manual.",obs:"",regras:"Preparação: embaralhe as 54 cartas e distribua-as viradas para baixo em uma grade no centro da mesa. Cada jogador olha secretamente 2 cartas da grade (memorizando posição e valor) antes do jogo começar.\n\nObjetivo: acumular mais pontos capturando pares de cartas com o mesmo valor, usando memória para lembrar onde estão.\n\nComo jogar: na sua vez, vire 2 cartas quaisquer da grade. Se forem do mesmo valor: capture o par e ganhe os pontos indicados! Se forem diferentes: vire-as de volta (todos assistem — memorizem!). Cartas especiais adicionam drama: Troca (troque 2 cartas de posição na grade), Névoa (vire uma carta de volta virada e embaralhada), Olho (espie 1 carta sem revelar a todos). Use essas habilidades para atrapalhar os adversários ou garantir seus pares.\n\nFim e vitória: quando todas as cartas forem capturadas (ou quando ninguém mais conseguir fazer pares), some os pontos das cartas de cada jogador. O maior total vence!"},
  {id:"990.088",nome:"Alieniñas",editora:"Gameshives",cat:"Habilidade Motora",idade:"8+",jog:"2-4",anos:"Todos",comp:"72 cartas de camuflagem, 9 cartas de civis, 8 cartas de alieniñas, 6 cartas de mapas, 4 cartas de multiplicador, 1 bloco de pontuação.",obs:"",regras:"Preparação: distribua 1 alien secreto para cada jogador (nem todos têm alien — alguns são civis). Embaralhe as 72 cartas de camuflagem. Distribua as cartas de mapa e as de multiplicador no centro.\n\nObjetivo: aliens tentam se disfarçar o máximo possível; detetives tentam identificar e revelar os aliens antes que escapem.\n\nComo jogar: aliens jogam cartas de camuflagem para construir disfarces (quanto mais convincente, mais difícil de revelar). Detetives jogam cartas de busca para examinar suspeitos — se as cartas de camuflagem não cobrirem completamente o alien, ele é revelado e perde pontos. Cartas de mapa indicam zonas onde aliens podem se esconder mais facilmente. Multiplicadores aumentam os pontos em jogo para todas as ações da rodada.\n\nFim e vitória: ao final do jogo, some os pontos: detetives que revelaram aliens ganham bônus por cada alien capturado; aliens que sobreviveram não revelados ganham pontos pela duração. A equipe com mais pontos vence o duelo de disfarces extraterrestres!"},
  {id:"990.089",nome:"Melvin vs Kronk",editora:"Geeks n Orcs",cat:"Habilidade Motora",idade:"8+",jog:"2-4",anos:"Todos",comp:"78 cartas de personagens e acoes, manual.",obs:"",regras:"Preparação: um jogador escolhe o baralho de MELVIN (o herói) e o outro o de KRONK (o vilão). Cada baralho tem 39 cartas com personagens aliados, ataques, defesas e magias temáticas. Distribua a mão inicial de 5 cartas cada.\n\nObjetivo: eliminar todos os personagens ativos do adversário usando ataques, combos e magias.\n\nComo jogar: na sua vez, (1) compre 1 carta do baralho; (2) jogue cartas de personagens aliados na sua área de batalha (cada um tem pontos de ataque e vida); (3) ataque personagens adversários com seus aliados (subtrai vida); (4) jogue cartas de magia para efeitos especiais (cura, dano extra, bloqueio, troca de cartas). Personagens com vida = 0 são descartados. Cartas de COMBO permitem encadear ações extras no mesmo turno.\n\nFim e vitória: o primeiro a eliminar todos os personagens ativos do adversário vence o épico duelo entre o bem (Melvin) e o mal (Kronk)! Com 4 jogadores: 2 times de 2 jogadores, cada um com baralho."},
  {id:"990.090",nome:"Eu Sou uma Banana",editora:"Grok Games",cat:"Comunicação",idade:"8+",jog:"3-8",anos:"Todos",comp:"120 cartas de objetos/animais/conceitos, 1 micro tabuleiro redondo, 1 par de óculos de papel.",obs:"",regras:"Preparação: embaralhe as 120 cartas de objetos, animais e conceitos. Distribua os óculos de papel (adereço obrigatório!) para o ator de cada rodada. O micro tabuleiro redondo registra tentativas e pontos.\n\nObjetivo: adivinhar o maior número de cartas sendo rápido, e interpretar de forma criativa quando for ator.\n\nComo jogar: o ator da rodada coloca os óculos de papel e pega uma carta sem mostrar. A partir daí, deve SE COMPORTAR, FALAR E AGIR como se fosse aquela carta — 'Eu sou uma banana' (dobra o corpo em formato de banana), 'Eu sou um semáforo' (para, verde, vai), 'Eu sou um pinguim' (caminha com pernões abertos). Os outros tentam adivinhar em voz alta a qualquer momento. O ator não pode dizer o nome, mas pode dar pistas falando na primeira pessoa. Quando alguém acertar, o ato ganha 1 ponto e o adivinhador ganha 1 ponto.\n\nFim e vitória: após todos terem atuado igualmente, some os pontos. Quem acumular mais pontos (como ator e adivinhador) vence!"},
  {id:"990.091",nome:"Deep Sea Adventure",editora:"Oink Games",cat:"Estratégia",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"2 dados de movimento, 6 meeples de mergulhadores, 48 fichas de tesouros, 1 submarino, 1 marcador de oxigênio.",obs:"",regras:"Preparação: posicione o submarino no início do percurso. Empilhe as 48 fichas de tesouro viradas para baixo ao longo do corredor (mais valiosas no fundo). Coloque o marcador de oxigênio em 25. Cada jogador coloca seu meeple de mergulhador no submarino.\n\nObjetivo: coletar tesouros valiosos do fundo do mar E voltar ao submarino antes que o oxigênio acabe.\n\nComo jogar: na sua vez, role os 2 dados de movimento e avance ou recue seu mergulhador. Ao parar em uma ficha, pegue-a e carregue — mas atenção: CADA ficha de tesouro que qualquer jogador estiver carregando reduz o oxigênio total em 1 por turno. Mais tesouros = menos oxigênio para todos! Para voltar ao submarino, role e mova em direção à saída. Se o marcador de oxigênio chegar a zero, qualquer mergulhador ainda no corredor perde TODOS os tesouros que carregava.\n\nFim e vitória: após 3 mergulhos, quem tiver mais tesouros guardados com sucesso no submarino vence. Ganância demais custa tudo — saiba quando recuar!"},
  {id:"990.092",nome:"Dobro",editora:"Grok Games",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Todos",comp:"Baralho de cartas com valores numéricos e instrucoes.",obs:"",regras:"Preparação: embaralhe as cartas numéricas e distribua igualmente entre os jogadores. Vire 1 carta no centro como referência inicial.\n\nObjetivo: formar e declarar pares de cartas cujos valores somam o DOBRO do valor da carta de referência atual.\n\nComo jogar: a carta de referência no centro define o alvo de soma. Ex.: referência = 5, então pares válidos são cartas que somam 10 (1+9, 2+8, 3+7, etc.). Na sua vez, você pode: (A) jogar 2 cartas da mão que somam o dobro da referência — declare o par e some os pontos; (B) jogar 1 carta nova como referência (mudando o alvo para todos); (C) usar cartas de instrução para bloquear adversários ou roubar referência. Quando um adversário está prestes a completar um par lucrativo, troque a referência para frustrar seus planos.\n\nFim e vitória: quando o baralho se esgotar, some o total dos pares declarados por cada jogador. O maior total vence o duelo matemático!"},
  {id:"990.093",nome:"13 Ghosts",editora:"Conclave",cat:"Estratégia",idade:"8+",jog:"2-4",anos:"Todos",comp:"26 cartas de fantasmas (13 pares), 1 carta de regras.",obs:"",regras:"Preparação: embaralhe as 26 cartas de fantasmas (13 pares distintos) e disponha todas viradas para baixo em uma grade no centro da mesa.\n\nObjetivo: capturar o maior número de pares de fantasmas usando memória e sorte.\n\nComo jogar: na sua vez, vire 2 cartas quaisquer da grade. Se as 2 mostrarem o mesmo tipo de fantasma (par!), capture-as e jogue novamente — encadeie pares! Se forem tipos diferentes, vire de volta na posição original e passe a vez. Mas atenção aos fantasmas especiais: O ATRAVESSADOR — quando revelado, troca de posição com uma carta aleatória da grade (bagunçando tudo que você memorizou!); O FANTASMA DA MEIA-NOITE — quando revelado, embaralha todas as cartas que não foram capturadas ainda (caos total!). Preste atenção em quais cartas os adversários revelam para usar esse conhecimento na sua vez.\n\nFim e vitória: quando todos os pares forem capturados, some as cartas de cada jogador. Quem capturou mais pares vence a caça aos fantasmas!"},
  {id:"990.094",nome:"No, Thanks!",editora:"Paper Games",cat:"Estratégia",idade:"8+",jog:"3-5",anos:"Todos",comp:"33 cartas numeradas de 3 a 35, 55 fichas de pontuação, manual.",obs:"",regras:"Preparação: embaralhe as 33 cartas numeradas (3 a 35) e remova secretamente 9 cartas do baralho — ninguém sabe quais foram removidas, criando incerteza. Distribua 11 fichas para cada jogador.\n\nObjetivo: ter a menor pontuação líquida ao final (pontos de cartas MENOS fichas acumuladas).\n\nComo jogar: o turno é simples — a carta do topo é revelada e você TEM QUE tomá-la OU pagar 1 ficha para passar a carta ao próximo jogador. Cartas altas (27, 30, 35...) são pontos negativos. Fichas são pontos positivos. REGRA CRUCIAL de sequências: se você tiver cartas consecutivas (ex.: 7, 8, 9), elas valem apenas a menor da sequência (7 pontos, não 24). Dilema constante: pagar mais fichas para evitar cartas altas OU pegar a carta com suas fichas acumuladas (às vezes compensa!).\n\nFim e vitória: quando o baralho se esgotar, some suas cartas e subtraia as fichas acumuladas. Sequências reduzem muito os pontos. A menor pontuação líquida vence!"},
  {id:"990.095",nome:"A.E.R.O.",editora:"Adoleta Games",cat:"Estratégia",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"4 dados de bandidos, 4 dados numerados, 24 marcadores de bandidos, manual.",obs:"",regras:"Preparação: coloque os 4 dados de bandidos e os 4 dados numerados no centro. Distribua os marcadores de bandidos entre os jogadores. Defina o número de rodadas (recomendado: 5-7).\n\nObjetivo: capturar o maior número de bandidos ao longo das rodadas sendo o melhor xerife da cidade.\n\nComo jogar: na sua vez, role os 4 dados de bandidos — cada face mostra um tipo de criminoso (ladrão, assaltante, bandido armado, etc.) com nível de dificuldade. Em seguida, role os 4 dados numerados — esses são seus policiais. Use os resultados numéricos para capturar bandidos: combinações específicas (par, sequência, igual ao nível do bandido) permitem capturar o criminoso correspondente. Cada bandido tem suas regras de captura impressas no marcador. Bandido não capturado escapa e prejudica sua pontuação.\n\nFim e vitória: após todas as rodadas, some os bandidos capturados menos os que escaparam. O xerife com maior saldo positivo vence a disputa pela segurança da cidade!"},
  {id:"990.096",nome:"Sixstix",editora:"Paper Games",cat:"Habilidade Motora",idade:"8+",jog:"2-4",anos:"Todos",comp:"55 cartas de desafio, 6 palitos de madeira, manual.",obs:"",regras:"Preparação: cada jogador pega os seus 6 palitos de madeira de mesma cor. Embaralhe as 55 cartas de desafio e coloque-as em uma pilha virada para baixo no centro da mesa. Todos ficam sentados em volta com os palitos na mão.\n\nObjetivo: ser o mais rápido a replicar com exatidão a figura mostrada na carta de desafio usando exatamente 6 palitos.\n\nComo jogar: vire a carta do topo revelando uma figura geométrica formada por palitos em ângulos específicos — algumas são simétricas, outras têm ângulos incomuns e combinações complexas. Todos os jogadores simultaneamente tentam reproduzir aquela figura posicionando seus 6 palitos da forma mais fiel possível. Palitos podem ser dispostos em qualquer ângulo, sobrepostos ou encostados. Quando um jogador acredita ter replicado a figura corretamente, bate na mesa com a mão livre para sinalizar que terminou. Os demais param e conferem se a figura daquele jogador está correta comparando com a carta. Se correto, o jogador ganha a carta como ponto. Se errado, os demais continuam tentando.\n\nFim e vitória: após todas as 55 cartas do baralho serem disputadas, conte as cartas de cada jogador. Quem tiver mais cartas vence o campeonato de palitos! As cartas mais difíceis (com ângulos incomuns e sobreposições) são as mais disputadas e requerem mais concentração."},
  {id:"990.097",nome:"Draftosaurus",editora:"Meeplebr",cat:"Estratégia",idade:"6+",jog:"2-5",anos:"Y1-Y3",comp:"5 tabuleiros de zoo, 60 mini-dinossauros de madeira (10 de 6 espécies), 1 dado de colocação, 1 bolsa.",obs:"",regras:"Preparação: coloque 1 tabuleiro de zoo na frente de cada jogador — cada tabuleiro tem 6 recintos com regras específicas de pontuação (recinto de gelo, vulcão, floresta, pradaria, rio e lagoa). Coloque todos os 60 mini-dinossauros de madeira na bolsa opaca e misture bem. Separe o dado de colocação.\n\nObjetivo: construir o zoo de dinossauros mais valioso escolhendo estrategicamente quais dinos colocar em quais recintos ao longo de dois semestres de zoo.\n\nComo jogar: cada rodada começa com todos os jogadores retirando simultaneamente 6 dinos da bolsa, formando sua mão. Em seguida, 1 jogador (em rotação) rola o dado especial que cria UMA restrição válida para todos nesta rodada — por exemplo: só pode colocar dino em recinto já ocupado, ou só pode colocar dino em recinto vazio, ou só no recinto mais à esquerda. Cada jogador escolhe 1 dino da mão e o coloca em qualquer recinto do seu zoo que respeite a restrição. Os dinos restantes na mão são passados para o jogador ao lado (mecânica de draft), que então escolhe mais 1, e assim sucessivamente até os dinos acabarem.\n\nFim e vitória: após 2 rodadas completas (verão e inverno), calcule os pontos de cada recinto conforme suas regras únicas — alguns recintos preferem espécies idênticas, outros preferem variedade, outros valorizam quantidade. Quem construir o zoo com mais pontos vence!"},
  {id:"990.098",nome:"Trilhas Urbanas",editora:"Pistache Editorial",cat:"Tabuleiro",idade:"8+",jog:"2-6",anos:"Todos",comp:"Pecas de inicio e fim, 7 pecas de paisagem urbana, 8 dados de icones, 10 cartas de grandes desafios, 65 cartas de solucoes, 6 peons, manual de instrucoes e manual do educador.",obs:"",regras:"Preparação: monte o percurso conectando a peça de INÍCIO à de FIM com as 7 peças de paisagem urbana escolhidas ou sorteadas. Cada jogador posiciona seu peão no início. Separe o baralho de cartas de soluções e as 10 cartas de grandes desafios.\n\nObjetivo: percorrer o circuito urbano colaborativamente resolvendo desafios para chegar ao destino final como comunidade unida.\n\nComo jogar: na sua vez, role os 8 dados de ícones — cada dado pode mostrar símbolos de praça, rio, comércio, patrimônio, transporte ou obstáculo urbano. O resultado determina o tipo de paisagem que você atravessa e qual desafio urbano encontra. Para superar um desafio, o grupo debate e escolhe cartas de solução compatíveis com o contexto (ex.: como melhorar a mobilidade nesta praça? como preservar este patrimônio?). Soluções aceitas permitem avançar; desafios não resolvidos travam o grupo. Cartas de grandes desafios exigem discussão coletiva mais profunda e valem mais avanço. Peões de todos jogadores avançam quando o grupo resolve colaborativamente.\n\nFim e vitória: quando todos os jogadores cruzarem a linha de chegada, o grupo celebra a vitória coletiva! O manual do educador traz reflexões sobre cidadania, mobilidade urbana e participação comunitária para aprofundar a experiência além do jogo."},
  {id:"990.099",nome:"Magic Maze",editora:"Conclave",cat:"Cooperativo",idade:"8+",jog:"1-8",anos:"Y4-Y5",comp:"Tiles de tabuleiro modulares, peoes de herois, cartas de missao, ampulheta, peca de STOP.",obs:"",regras:"Preparação: monte o labirinto inicial com os 4 tiles de saída e o tile central. Posicione os 4 heróis (guerreiro, mago, elfo, anão) no tile central. Distribua as cartas de ação entre os jogadores — cada jogador controla apenas ALGUMAS das direções ou habilidades disponíveis, não todas. Vire a ampulheta para dar início ao tempo.\n\nObjetivo: cooperar para que CADA herói encontre o seu item específico em alguma loja do labirinto expandido e depois todos escapem pela saída correta — tudo antes do tempo acabar.\n\nComo jogar: REGRA FUNDAMENTAL — é absolutamente proibido falar, fazer gestos ou comunicar de qualquer forma durante o jogo (exceto usando a peça laranja de STOP). Cada jogador pode executar apenas as ações do seu conjunto de cartas: por exemplo, um jogador move qualquer herói para o NORTE; outro move para o SUL; outro aciona escadas e portais. Quando você quer chamar atenção de um parceiro, coloque a peça laranja de STOP à frente dele. Explorar novos tiles embaralhados expande o labirinto. Quando a ampulheta esvaziar, o jogo para — só pode recarregá-la chegando a uma das casas de recarga específicas.\n\nFim e vitória: se todos os heróis escaparem com seus itens antes do tempo acabar, o grupo vence! Se o tempo acabar sem que todos escapem, a missão falhou. Há 10 cenários de dificuldade crescente para grupos avançados."},
  {id:"990.100",nome:"Dixit Disney",editora:"Libellud / Asmodee",cat:"Comunicação",idade:"6+",jog:"3-6",anos:"Y1-Y3",comp:"84 cartas com ilustrações Disney, 36 fichas de votos (6 cores), 1 tabuleiro de pontuacao, 6 peons de coelho.",obs:"",regras:"Preparação: embaralhe as 84 cartas de ilustrações Disney e distribua 6 para cada jogador. O restante forma o baralho de compra. Coloque os peões de coelho no espaço 0 do tabuleiro. Distribua fichas de votação numeradas (na sua cor) para cada jogador.\n\nObjetivo: fazer sua equipe adivinhar sua carta sem que todos adivinhem — o segredo é ser criativo, não óbvio — usando personagens e cenas dos clássicos Disney.\n\nComo jogar: o narrador da rodada escolhe 1 carta da mão e diz em voz alta UMA palavra, frase, som ou melodia que a descreva — sem mostrar a carta. Todos os outros escolhem 1 carta da própria mão que melhor combine com a descrição dada e passam ao narrador viradas. O narrador embaralha todas as cartas (incluindo a sua) e as revela numeradas. Cada jogador vota em segredo em qual carta acredita ser do narrador, revelando o voto simultaneamente. PONTUAÇÃO: se NINGUÉM acertar ou se TODOS acertarem, o narrador não pontua e os outros ganham 2 pts. Se pelo menos 1 (mas não todos) acertar, narrador e quem acertou ganham 3 pts; quem recebeu votos indevidos ganha 1 pt por voto. Ao final compre 1 carta para repor a mão.\n\nFim e vitória: avance os peões no tabuleiro conforme os pontos acumulados. O primeiro a chegar à casa final (ou quem tiver mais pontos quando o baralho acabar) vence o torneio mágico Disney!"},
  {id:"990.101",nome:"Splendor Marvel",editora:"Space Cowboys",cat:"Estratégia",idade:"10+",jog:"2-4",anos:"Y4-Y5",comp:"36 cartas de Poder (nivel 1, 2, 3), cartas de Localização, fichas de Joias do Infinito (6 tipos), fichas de Tempo, cartas de heroi, tabuleiro.",obs:"",regras:"Preparação: organize as cartas de Poder em 3 fileiras por nível (1, 2, 3) com 4 cartas viradas para cima por nível e os baralhos correspondentes ao lado. Coloque as fichas de Joias do Infinito (6 tipos: Mente, Espaço, Realidade, Poder, Tempo, Alma) no banco central — quantidade por cor varia com o número de jogadores. Disponibilize as cartas de Localização separadas.\n\nObjetivo: recrutar heróis e vilões Marvel usando Joias do Infinito acumuladas, atingindo 16 pontos de Prestígio para vencer o universo.\n\nComo jogar: na sua vez, faça UMA das ações: (A) pegue 3 fichas de Joias de 3 cores diferentes do banco; (B) pegue 2 fichas de uma mesma cor (mínimo 4 disponíveis daquela cor); (C) recrute um personagem visível pagando com fichas — personagens recrutados concedem bônus permanentes de Joias para compras futuras (como desconto automático); (D) reserve um personagem (coloque na sua mão para comprar depois + receba 1 ficha dourada curinga). Localizações são desbloqueadas quando certos personagens são recrutados, dando poderes especiais. Personagens de nível 3 têm custo altíssimo mas valem muitos pontos de Prestígio.\n\nFim e vitória: quando qualquer jogador atingir 16 pontos de Prestígio, todos terminam a rodada atual para igualar oportunidades. Quem tiver mais Prestígio vence o controle do universo Marvel!"},
  {id:"990.102",nome:"Blokus",editora:"Mattel",cat:"Estratégia",idade:"7+",jog:"2-4",anos:"Todos",comp:"84 peças de tetromino (21 de cada cor: azul, amarelo, vermelho, verde), 1 tabuleiro 20x20.",obs:"",regras:"Preparação: cada jogador escolhe uma cor e recebe suas 21 peças de tetromino — formas únicas de 1 a 5 quadradinhos. O tabuleiro 20x20 começa vazio. O primeiro peão de cada jogador deve iniciar em um dos 4 cantos do tabuleiro.\n\nObjetivo: colocar o máximo possível das suas 21 peças no tabuleiro, bloqueando adversários enquanto expande seu território pelos cantos.\n\nComo jogar: na sua vez, escolha qualquer peça da sua coleção e coloque no tabuleiro seguindo a REGRA FUNDAMENTAL: cada nova peça deve tocar uma peça da SUA cor — mas APENAS pelo canto (diagonal), NUNCA pelas laterais (nunca lado a lado com as suas próprias). Peças de cores diferentes podem se tocar pelas laterais normalmente. Com 4 jogadores, as cores se cruzam criando um puzzle territorial complexo. Estratégia básica: expanda para territórios abertos antes que adversários bloqueiem os cantos. Peças grandes (5 quadrados) são mais poderosas mas mais difíceis de encaixar depois. Jogue as grandes cedo!\n\nFim e vitória: quando nenhum jogador puder mais fazer nenhuma jogada legal, some as peças restantes de cada um (cada quadrado de peça não colocada = -1 ponto). Quem colocou todas as peças ganha bônus de +15. A menor pontuação negativa (ou maior bônus) vence!"},
  {id:"990.103",nome:"Bloqueio",editora:"—",cat:"Estratégia",idade:"7+",jog:"2-4",anos:"Todos",comp:"Tabuleiro e peças geométricas coloridas.",obs:"",regras:"Preparação: posicione o tabuleiro quadriculado no centro. Cada jogador escolhe uma cor e recebe seu conjunto de peças geométricas (triângulos, quadrados, retângulos de tamanhos variados). O primeiro jogador da vez pode iniciar em qualquer espaço de borda do tabuleiro.\n\nObjetivo: maximizar o território ocupado pelas suas peças enquanto bloqueia as rotas de expansão dos adversários.\n\nComo jogar: na sua vez, coloque UMA peça adjacente (lado a lado, não diagonal) a alguma peça já sua no tabuleiro — exceto no primeiro turno, quando pode escolher qualquer espaço de borda. Peças devem respeitar o grid e nunca se sobrepor. Expansão estratégica: tente formar caminhos longos para garantir território antes que adversários bloqueiem as saídas. Quando uma região ficar completamente cercada por peças adversárias, ela não pode mais expandir. Adversários também podem usar peças para dividir o tabuleiro criando zonas de controle separadas. Peças de formato irregular podem defender cantos difíceis de alcançar.\n\nFim e vitória: quando nenhum jogador conseguir mais fazer uma jogada legal em sua vez (sem espaço para colocar peças adjacentes), conte os quadrados do tabuleiro ocupados por cada cor. Quem ocupar mais quadrados vence o duelo territorial!"},
  {id:"990.104",nome:"Detetive",editora:"Grow",cat:"Tabuleiro",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro do casarao, cartas de suspeitos, armas e comodos, fichas de anotacao, dados, peons, envelope secreto.",obs:"",regras:"Preparação: coloque 1 carta de suspeito, 1 de arma e 1 de cômodo em um envelope secreto sem que ninguém veja — esses são o assassino, a arma do crime e o local. Embaralhe as cartas restantes e distribua igualmente entre os jogadores. Cada um usa sua ficha de anotação para marcar o que sabe e o que já eliminou. Posicione os peões nos cômodos indicados.\n\nObjetivo: descobrir quem cometeu o assassinato, com qual arma e em qual cômodo, fazendo sugestões lógicas enquanto percorre o casarão.\n\nComo jogar: na sua vez, role os dados e mova seu peão pelos corredores. Ao entrar em um cômodo, faça uma SUGESTÃO: diga 1 suspeito + 1 arma que poderiam estar naquele cômodo específico. Cada outro jogador, em sequência, deve mostrar secretamente a você 1 carta que prove que aquele elemento é falso — se tiver. Use a ficha para marcar: X para eliminados, interrogação para possíveis, S para confirmados. Acumule evidências para afunilar as possibilidades. Quando tiver certeza absoluta, vá ao centro do casarão e faça a ACUSAÇÃO FINAL revelando suspeito + arma + cômodo.\n\nFim e vitória: se a acusação conferir com o envelope secreto, você desvendou o mistério e venceu! Se errar, você é silenciosamente eliminado (não revela o que viu) e os outros continuam. Lógica dedutiva e anotações cuidadosas são as chaves para resolver o crime!"},
  {id:"990.105",nome:"Convidados Indesejados",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"3-6",anos:"Y4-Y5",comp:"Tabuleiro da mansao, cartas de convidados, cartas de itens, tokens de susto, dados.",obs:"",regras:"Preparação: monte o tabuleiro da mansão com todos os cômodos e corredores. Distribua as cartas de convidados (personagens humanos) entre os jogadores do time dos convidados. Atribua os personagens fantasmas ao time adversário. Coloque os tokens de susto e os itens de fuga nos locais indicados pelo manual.\n\nObjetivo: os convidados cooperam para coletar todos os itens de fuga e escapar da mansão antes que os fantasmas os assustar; os fantasmas cooperam para bloquear e eliminar todos os convidados antes da fuga.\n\nComo jogar: os dois times alternam rodadas. Time dos CONVIDADOS: cada jogador move seu personagem pelo tabuleiro tentando coletar itens espalhados pelos cômodos — certos itens combinados abrem a saída final. Alguns itens exigem 2 convidados no mesmo cômodo simultaneamente; coordenação é essencial. Time dos FANTASMAS: cada fantasma se move pelos corredores tentando ocupar o mesmo cômodo de um convidado. Se 2 fantasmas cercarem 1 convidado no mesmo cômodo, ele recebe 1 token de susto e fica paralisado por 1 turno. Com 3 tokens de susto um convidado é eliminado.\n\nFim e vitória: convidados vencem se todos escaparem pela saída com os itens necessários coletados. Fantasmas vencem se eliminarem todos os convidados ou bloquearem permanentemente todos os caminhos de fuga. Uma batalha de estratégia em equipe!"},
  {id:"990.106",nome:"Labirinto Mágico",editora:"Ravensburger",cat:"Tabuleiro",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Tabuleiro com tiles deslizantes, 24 cartas de objeto, 4 peons coloridos, tiles de labirinto.",obs:"",regras:"Preparação: monte o tabuleiro encaixando os tiles de labirinto seguindo a configuração inicial. Sempre há 1 peça extra que fica do lado de fora. Cada jogador coloca seu peão no canto correspondente à sua cor. Embaralhe as 24 cartas de objeto e distribua 6 para cada jogador empilhadas — apenas a carta do topo é visível para o dono.\n\nObjetivo: percorrer o labirinto mágico para coletar os objetos mostrados nas suas cartas, sendo o primeiro a encontrar todos e retornar ao ponto de partida.\n\nComo jogar: na sua vez, você PRIMEIRO deve inserir a peça extra em uma das aberturas nas bordas do tabuleiro empurrando uma fileira ou coluna inteira — isso desloca todos os tiles dessa linha e a peça que sai do outro lado fica disponível para o próximo turno. Depois de empurrar, mova seu peão quantas casas quiser pelos corredores agora reconfigurados. Se o peão sair pela borda durante o empurrão, reaparece do lado oposto. Se chegar ao objeto indicado na carta do topo, colete-o e vire a próxima carta. ESTRATÉGIA DUPLA: tente abrir seu próprio caminho E fechar o caminho que o adversário precisava usar.\n\nFim e vitória: o primeiro jogador a coletar todos os seus objetos e voltar à posição inicial de partida vence a aventura pelo labirinto mágico!"},
  {id:"990.107",nome:"Super Trunfo: Dinossauros",editora:"Grow",cat:"Cartas",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"32 cartas de dinossauros com atributos numericos.",obs:"",regras:"Preparação: distribua as 32 cartas igualmente entre todos os jogadores (8 cartas cada em jogo de 4). Cada jogador mantém sua pilha virada para baixo sem ver as cartas — apenas a carta do topo fica visível para o próprio dono.\n\nObjetivo: capturar todas as cartas dos adversários sendo o jogador com maior valor nos atributos escolhidos rodada a rodada.\n\nComo jogar: o jogador da vez olha sua carta do topo (sem mostrar) e escolhe UM atributo: PESO (em toneladas), COMPRIMENTO (em metros), VELOCIDADE (km/h) ou FEROCIDADE (escala 1-10). Todos revelam suas cartas e comparam o valor nesse atributo. Quem tiver o MAIOR valor captura TODAS as cartas reveladas e as coloca no fundo da sua pilha. O vencedor da rodada escolhe o próximo atributo. EMPATE: em caso de empate, as cartas ficam no centro e o vencedor da próxima rodada leva tudo junto.\n\nFim e vitória: o jogo termina quando um jogador capturar TODAS as cartas dos adversários (ideal para 2-3 jogadores) ou quando o tempo acordado acabar. Quem tiver mais cartas ao final vence o torneio dos dinossauros! Dica: T-Rex domina em Ferocidade; Argentinosaurus lidera em Peso e Comprimento."},
  {id:"990.108",nome:"Super Trunfo: Dinossauros 2",editora:"Grow",cat:"Cartas",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"32 cartas de dinossauros com atributos, continuação da série.",obs:"",regras:"Mesmas regras do Super Trunfo. Expansao com novos dinossauros para colecionar e jogar. Pode ser misturado com o baralho original para partidas mais longas com mais variedade."},
  {id:"990.109",nome:"Super Trunfo: Mitologia Grega",editora:"Grow",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"32 cartas de deuses e herois gregos com atributos.",obs:"",regras:"Preparação: distribua as 32 cartas igualmente com deuses olímpicos (Zeus, Hera, Poseidon, Atena, Ares, Apolo, Hermes, Hefesto, Afrodite), heróis (Hércules, Aquiles, Ulisses, Perseu) e criaturas (Minotauro, Ciclope, Hidra, Medusa). Cada jogador mantém pilha virada para baixo; apenas a carta do topo é visível para o dono.\n\nObjetivo: vencer duelos usando os atributos mitológicos dos personagens gregos para capturar todas as cartas adversárias.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: PODER (força divina 1-100), POPULARIDADE (culto em civilizações, 1-100), FEITOS (número de façanhas heroicas) ou FAMÍLIA OLÍMPICA (prestígio da linhagem divina). Todos revelam suas cartas e quem tiver o maior valor captura tudo. Em caso de empate, as cartas ficam no centro e o próximo vencedor leva tudo. Estratégia: Zeus geralmente lidera em Poder; Hércules domina em Feitos; Afrodite surpreende em Popularidade!\n\nFim e vitória: quem capturar todas as cartas vence! O jogo também é uma introdução à mitologia — após a partida, converse sobre as histórias de cada personagem para aprofundar o aprendizado."},
  {id:"990.110",nome:"Super Trunfo: Mitologia Nórdica",editora:"Grow",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"32 cartas de deuses e criaturas nórdicas com atributos.",obs:"",regras:"Preparação: distribua as 32 cartas de deuses e criaturas nórdicas: Thor, Odin, Loki, Freya, Tyr, Baldur, Heimdall, Fenrir, Jormungandr, Surtr, Valquírias e mais. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: dominar o jogo usando os poderes nórdicos dos personagens para capturar todas as cartas adversárias e reinar nos Nove Mundos.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: FORÇA (poder de combate direto), ASTÚCIA (inteligência e manha para enganar), ARMAMENTOS (qualidade das armas divinas) ou PODER MÁGICO (conexão com forças sobrenaturais). Todos revelam suas cartas e quem tiver o maior valor vence as cartas da rodada. Thor tende a dominar em Força e Armamentos (com Mjolnir!); Loki é imbatível em Astúcia; Odin surpreende em Poder Mágico. Empates ficam no centro para o próximo vencedor.\n\nFim e vitória: capturar todas as cartas ou ter mais ao final do tempo vence! Após o jogo, explore as histórias nórdicas — muito diferentes das gregas, com o apocalipse do Ragnarök como elemento central da mitologia."},
  {id:"990.111",nome:"Super Trunfo: Feras Extintas",editora:"Grow",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Todos",comp:"32 cartas de animais extintos com atributos científicos.",obs:"",regras:"Preparação: distribua as 32 cartas de animais extintos: Mamute-Lanoso, Smilodon (Tigre-Dente-de-Sabre), Megalodon, Dinohyus (porco gigante), Gigantopithecus, Argentavis (ave gigante), Dunkleosteus (peixe blindado) e outros. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: vencer duelos de atributos para capturar todas as cartas usando o conhecimento sobre estas criaturas extintas extraordinárias.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: TAMANHO (comprimento ou altura em metros), PESO (em toneladas), FORÇA DE MORDIDA (em quilos-força), PERÍODO (anos atrás que existiu — valor mais alto = mais antigo) ou PERIGO (escala de ameaça 1-10). Todos revelam e quem tiver o maior valor captura as cartas da rodada. O Megalodon domina em Força de Mordida; o Mamute em Peso; o Dinohyus surpreende muita gente! Empates acumulam para o próximo vencedor.\n\nFim e vitória: quem capturar todas as cartas vence! O conteúdo paleontológico real torna este jogo um excelente complemento para aulas de ciências sobre evolução, extinção em massa e biodiversidade."},
  {id:"990.112",nome:"Super Trunfo: Pixar",editora:"Grow",cat:"Cartas",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"32 cartas de personagens dos filmes Pixar.",obs:"",regras:"Preparação: distribua as 32 cartas com personagens dos filmes Pixar: Buzz Lightyear, Woody, Nemo, Dory, WALL-E, EVE, Merida, Miguel, Remy (Ratatouille), Violet Parr, Alegria (Divertidamente) e outros. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: usar os atributos dos personagens Pixar para capturar todas as cartas adversárias enquanto relembra os filmes favoritos.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: POPULARIDADE (ranking de fãs), CORAGEM (nível de bravura na história do filme), VELOCIDADE (quão rápido o personagem pode se mover) ou AVENTURAS (número de desafios enfrentados na trama). Todos revelam suas cartas e quem tiver o maior valor vence as cartas da rodada. Buzz Lightyear tende a liderar em Coragem e Aventuras; WALL-E surpreende em Popularidade; Merida domina em Velocidade!\n\nFim e vitória: capturar todas as cartas ou ter mais ao final do tempo vence! Uma ótima desculpa para relembrar os momentos mais emocionantes dos filmes Pixar enquanto pratica comparação numérica e lógica de atributos."},
  {id:"990.113",nome:"Super Trunfo: Cidades do Mundo",editora:"Grow",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"32 cartas de cidades com dados geográficos e populacionais.",obs:"",regras:"Preparação: distribua as 32 cartas das maiores metrópoles do mundo: Tóquio, Nova York, São Paulo, Mumbai, Cidade do México, Cairo, Londres, Moscou, Beijing, Buenos Aires, Lagos, Jacarta e outras. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: usar dados geográficos reais das cidades para vencer duelos e capturar todas as cartas adversárias.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: POPULAÇÃO (em milhões de habitantes), ÁREA (km² da área urbana), ALTITUDE (metros acima do mar), IDH (Índice de Desenvolvimento Humano da cidade, 0-1) ou PONTOS TURÍSTICOS (número de atrações internacionalmente famosas). Todos revelam e quem tiver o maior valor captura as cartas. Tóquio domina em População; Moscou e Pequim disputam em Área; Bogotá surpreende em Altitude; Viena lidera em IDH!\n\nFim e vitória: quem capturar todas as cartas vence! Os dados são reais e baseados em estatísticas atualizadas — o jogo transforma uma competição simples em um atlas geográfico mundial de fato educativo."},
  {id:"990.114",nome:"Super Trunfo: Monumentos do Mundo",editora:"Grow",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"32 cartas de monumentos históricos com dados.",obs:"",regras:"Preparação: distribua as 32 cartas de monumentos históricos: Cristo Redentor, Torre Eiffel, Coliseu, Grande Muralha da China, Machu Picchu, Taj Mahal, Pirâmides de Gizé, Stonehenge, Partenon, Angkor Wat, Chichen Itza e outros. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: usar atributos históricos e físicos dos monumentos para vencer duelos e capturar todas as cartas adversárias.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: ALTURA (em metros — para estruturas verticais), IDADE (em anos desde a construção — maior é melhor), VISITANTES ANUAIS (em milhões de turistas), VALOR HISTÓRICO (importância cultural em escala 1-10) ou CURIOSIDADES (número de fatos notáveis registrados). Todos revelam e quem tiver o maior valor captura as cartas. As Pirâmides dominam em Idade; a Torre Eiffel em Visitantes; Machu Picchu surpreende em Curiosidades!\n\nFim e vitória: capturar todas as cartas vence! Cada carta traz uma curiosidade real sobre o monumento — o jogo é uma aula de história universal embrulhada em competição animada."},
  {id:"990.115",nome:"Super Trunfo: Países",editora:"Grow",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"32 cartas de países com dados geopoliticos.",obs:"",regras:"Preparação: distribua as 32 cartas de países do mundo: Brasil, China, EUA, Rússia, Índia, Austrália, Canadá, Argentina, Alemanha, Japão, Nigéria, França e outros. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: usar dados geopolíticos reais dos países para vencer duelos e capturar todas as cartas adversárias.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: ÁREA (km² do território — maior território), POPULAÇÃO (em milhões de habitantes), PIB (Produto Interno Bruto em bilhões de dólares), ALTITUDE MÁXIMA (pico mais alto do país em metros) ou NÚMERO DE VIZINHOS (países com fronteira terrestre). Todos revelam e quem tiver o maior valor captura as cartas. Rússia domina em Área; China e Índia brigam por População; EUA lidera em PIB; Nepal surpreende em Altitude!\n\nFim e vitória: quem capturar todas as cartas vence o torneio geopolítico! Os dados são educativos e baseados em estatísticas reais — os alunos aprendem geopolítica mundial de forma competitiva e genuinamente divertida."},
  {id:"990.116",nome:"Super Trunfo: Sistema Solar",editora:"Grow",cat:"Cartas",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"32 cartas de planetas, luas e outros corpos celestes.",obs:"",regras:"Preparação: distribua as 32 cartas de corpos celestes: Sol, Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano, Netuno, Plutão, Ceres, luas como Io, Europa, Ganimedes, Titan, e asteroides/cometas notáveis. Cada jogador mantém pilha virada; apenas a carta do topo é visível para o dono.\n\nObjetivo: usar dados astronômicos reais para vencer duelos e aprender sobre as proporções incríveis do nosso sistema solar.\n\nComo jogar: o jogador da vez olha sua carta e escolhe UM atributo: DIÂMETRO (em km — tamanho do objeto), MASSA (em relação à Terra: Terra=1), DISTÂNCIA DO SOL (em milhões de km — maior = mais longe), NÚMERO DE LUAS (satélites naturais conhecidos) ou TEMPERATURA (em °C — valores extremos, seja frio ou quente, vencem). Todos revelam e quem tiver o maior valor captura as cartas. O Sol domina quase tudo; Júpiter surpreende com 79 luas conhecidas! Saturno destaca-se com seus anéis.\n\nFim e vitória: capturar todas as cartas vence o torneio espacial! As proporções do universo ganham vida nas comparações — Júpiter é 11 vezes maior que a Terra, e o Sol cabe 1.300.000 Terras dentro dele!"},
  {id:"990.117",nome:"Lice Tatil",editora:"—",cat:"Tabuleiro",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"Tabuleiro tatil, pecas com texturas diferentes, dados.",obs:"",regras:"Preparação: posicione o tabuleiro tátil no centro com todas as peças de textura encaixadas nos espaços correspondentes. Identifique com o grupo quais texturas estão presentes (áspero, liso, macio, granulado, emborrachado, nervurado). Cada jogador escolhe um peão colorido e posiciona na largada.\n\nObjetivo: percorrer o tabuleiro reconhecendo texturas pelo toque, desenvolvendo a percepção sensorial tátil e a concentração.\n\nComo jogar: na sua vez, role o dado para determinar quantas casas avançar. Ao parar em uma casa, feche os olhos (ou use uma venda) e toque a textura daquela casa com a ponta dos dedos. Se identificar corretamente a textura (confirmado pelo restante do grupo), avance 1 casa extra como bônus sensorial. Em casas de desafio especial: identifique uma peça escondida num saquinho pelo toque sem ver, ou discrimine entre duas texturas muito parecidas. Casas com símbolo de retrocesso existem para quem errar desafios especiais repetidamente.\n\nFim e vitória: o primeiro a chegar ao final do tabuleiro vence! A atividade desenvolve discriminação tátil, vocabulário sensorial e concentração — especialmente valiosa para trabalhar percepção sensorial nos primeiros anos escolares e em atividades de inclusão."},
  {id:"990.118",nome:"Como Eu Me Sinto",editora:"—",cat:"Comunicação",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Cartas de emoções com ilustrações expressivas, manual de mediação.",obs:"",regras:"Preparação: espalhe todas as cartas de emoções viradas para cima no centro da roda, formando um leque visual com expressões faciais e cenas do cotidiano. Identifique um mediador para a atividade — pode ser um professor, psicólogo ou líder estudantil. Todos se sentam em roda de forma acolhedora.\n\nObjetivo: desenvolver o vocabulário emocional e a inteligência emocional por meio do compartilhamento autêntico de sentimentos em ambiente seguro e sem julgamentos.\n\nComo jogar: cada participante observa as cartas disponíveis e escolhe aquela que melhor representa como se sente agora ou como se sentiu em uma situação recente. Quando estiver pronto, compartilha com o grupo: qual carta escolheu, o nome da emoção representada, e o motivo ou situação que gerou esse sentimento. O mediador facilita com perguntas abertas: 'O que aconteceu para você se sentir assim?' e 'Quem mais já se sentiu algo parecido?'. Pode ser usado de várias formas: roda de abertura de aula, resolução de conflitos, atividade de empatia coletiva, ou prática de vocabulário emocional. Não há vencedores — todos participam com igual importância.\n\nFim da atividade: encerre com uma reflexão coletiva sobre como nomear sentimentos nos ajuda a entendê-los, comunicá-los melhor e construir relações mais empáticas. O manual traz sugestões de mediação para diferentes contextos e faixas etárias."},
  {id:"990.119",nome:"Fórmula Turbo",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"2-6",anos:"Todos",comp:"Tabuleiro de circuito, carros coloridos, cartas de velocidade e evento, dados.",obs:"",regras:"Preparação: monte o tabuleiro de circuito com os segmentos de pista reta e curvas. Defina o número de voltas (1-2 para partidas rápidas, 3 para torneio). Posicione os carros coloridos na grelha de largada em ordem sorteada. Distribua a mão inicial de 5 cartas de velocidade e evento para cada jogador.\n\nObjetivo: cruzar a linha de chegada antes dos adversários completando todas as voltas sem sair da pista.\n\nComo jogar: na sua vez, jogue 1 ou mais cartas de velocidade da mão para avançar pelo circuito — cada carta tem um valor numérico de avanço em casas. REGRAS TÉCNICAS: ao entrar em curvas, você só pode avançar no máximo o valor limite impresso na curva (deve frear). Cartas de Aceleração permitem avançar além do limite normal, mas role um dado de risco — sucesso garante o bônus, falha causa desgaste (perde velocidade no próximo turno). Cartas de Evento afetam todos os pilotos: chuva reduz velocidade nas curvas, acidente obriga parada de 1 turno, safety car iguala posições do pelotão. Ultrapassagens só podem ocorrer em retas. Ao final da vez, compre cartas para repor a mão até o limite.\n\nFim e vitória: o primeiro a cruzar a linha de chegada ao completar o número definido de voltas vence o Grand Prix!"},
  {id:"990.120",nome:"Quem Sumiu Stitch",editora:"—",cat:"Tabuleiro",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Tabuleiro, cartas de pistas, peoes, dado, ilustrações do Stitch.",obs:"",regras:"Preparação: espalhe o tabuleiro de cenários da casa de Lilo no centro. O mediador (ou um jogador fora do turno) esconde a peça do Stitch embaixo de uma das casas sem que os outros vejam. Espalhe as cartas de pistas viradas para baixo nos outros espaços. Cada jogador posiciona seu peão na entrada da casa.\n\nObjetivo: ser o primeiro a descobrir onde o Stitch se escondeu usando as pistas das cartas para deduzir a posição correta.\n\nComo jogar: na sua vez, role o dado e mova até uma casa. Vire a carta daquela casa para ver o que está lá: 'Stitch não está aqui — tente a casa azul', 'Armadilha! Perca 1 turno e volte 2 casas', 'Pista quente! O Stitch está a no máximo 2 casas de distância' ou 'Pista fria! O Stitch está do outro lado da casa'. Colete e memorize as pistas. Quando estiver suficientemente confiante, declare a busca final — vá até a casa suspeita e levante. Se for o Stitch, marque 1 ponto. Se errar, volte à entrada e perca 1 turno. O mediador reposiciona o Stitch secretamente para a próxima rodada.\n\nFim e vitória: após o número combinado de rodadas, quem encontrou o Stitch mais vezes vence a grande caçada no estilo de Lilo e Stitch!"},
  {id:"990.121",nome:"Criando Histórias",editora:"—",cat:"Comunicação",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Cartas de personagens, cenarios, objetos e eventos para criacao de historias.",obs:"",regras:"Preparação: separe as cartas em 4 categorias — PERSONAGENS (quem), CENÁRIOS (onde), OBJETOS (o quê) e EVENTOS (o que acontece). Embaralhe cada categoria em pilha separada. Defina com o grupo se será o modo competitivo ou colaborativo.\n\nObjetivo: estimular a criatividade e a narração oral usando combinações aleatórias e improváveis de elementos para criar histórias originais e envolventes.\n\nComo jogar — MODO COMPETITIVO: cada jogador sorteia 1 carta de cada categoria (1 personagem, 1 cenário, 1 objeto, 1 evento) e tem exatamente 2 minutos para criar e narrar uma história coerente usando TODOS os elementos sorteados. Ao terminar, os outros jogadores votam na história mais criativa, mais engraçada ou melhor narrada (votar em outra pessoa — não em si mesmo). Quem receber mais votos ganha 1 ponto. — MODO COLABORATIVO: o grupo sorteia 4 cartas juntas e vai construindo uma única história em ciranda, cada jogador acrescentando 2-3 frases que continuam o que o anterior disse. O último jogador dá o desfecho final da narrativa.\n\nFim e vitória: no modo competitivo, quem acumular mais pontos após o número combinado de rodadas vence o campeonato de narradores criativos! No modo colaborativo, todos vencem ao completar uma história original juntos."},
  {id:"990.122",nome:"Lince",editora:"Grow",cat:"Habilidade Motora",idade:"6+",jog:"2-8",anos:"Todos",comp:"Tabuleiro central com objetos, cartas de desafio, pino central.",obs:"",regras:"Preparação: coloque o tabuleiro circular com os 90+ objetos coloridos no centro da mesa, acessível a todos. Embaralhe as cartas de desafio em uma pilha. Posicione o pino central no centro do tabuleiro. Todos os jogadores devem conseguir alcançar o centro da mesa com o braço.\n\nObjetivo: ser o mais rápido a encontrar e tocar o objeto específico no tabuleiro para acumular o maior número de cartas.\n\nComo jogar: vire a carta do topo para todos verem simultaneamente. A carta mostra 1 objeto específico (variações por nível de dificuldade: nível fácil mostra o objeto exato com cor; nível médio mostra apenas silhueta; nível difícil descreve em palavras sem imagem). No momento em que a carta for revelada, todos varreram o tabuleiro com os olhos e tentam tocar o objeto correto o mais rápido possível. O PRIMEIRO a tocar no objeto correto ganha a carta como ponto. Tocar no objeto errado: perde o ponto da rodada E devolve 1 carta já acumulada. Reflexos rápidos combinados com atenção aos detalhes são fundamentais.\n\nFim e vitória: quando todas as cartas forem jogadas, quem acumulou mais cartas vence o torneio de olho de lince! Para grupos maiores, pode jogar em equipes de 2."},
  {id:"990.123",nome:"Novo Master",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro, 300+ cartas de 6 categorias (Arte, Esporte, Ciencia, Historia, Entretenimento, Natureza), dados, peons.",obs:"",regras:"Preparação: coloque o tabuleiro colorido no centro com as 6 categorias identificadas por cor: ARTE (violeta), ESPORTE (laranja), CIÊNCIA (azul), HISTÓRIA (amarelo), ENTRETENIMENTO (rosa) e NATUREZA (verde). Distribua os peões pelos pontos de partida. Empilhe as cartas de cada categoria separadamente. Cada carta tem perguntas de 3 níveis de dificuldade.\n\nObjetivo: responder perguntas de TODAS as 6 categorias ao percorrer o tabuleiro e depois vencer a pergunta final no centro para ser coroado Mestre do Conhecimento.\n\nComo jogar: role o dado colorido — a cor determina a categoria da pergunta. Avance pelo tabuleiro até uma casa da cor sorteada. Outro jogador escolhe uma pergunta da carta dessa categoria (no nível de dificuldade indicado pela casa: básico, médio ou difícil). Acertou: para cada categoria, ganhe um marcador (troféu) da cor correspondente quando responder corretamente pela primeira vez — você precisa de 1 troféu de cada uma das 6 cores para avançar ao centro. Errou: fique no lugar. Com todos os 6 troféus, vá ao centro e responda a pergunta final sorteada aleatoriamente.\n\nFim e vitória: o primeiro a responder corretamente a pergunta central com todos os 6 troféus vence o título de Mestre do Conhecimento Grow!"},
  {id:"990.124",nome:"Palpite Certo",editora:"Grow",cat:"Conhecimento",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas com perguntas numéricas e de estimativa, tabuleiro de pontuação.",obs:"",regras:"Preparação: distribua papel e caneta para cada jogador. Coloque as cartas de perguntas em uma pilha. Defina o número de rodadas (geralmente 10-15). Designe um leitor para cada rodada, que pode rotacionar entre os jogadores.\n\nObjetivo: ter a maior pontuação total acertando estimativas numéricas ou, quando não souber exatamente, apostando no palpite mais próximo de quem acertar.\n\nComo jogar: o leitor revela a pergunta numérica em voz alta (ex.: 'Qual a população de Tóquio?', 'Em que ano o Brasil declarou independência?', 'Quantos km de extensão tem o Rio Amazonas?'). Todos escrevem seus palpites no papel em segredo e revelam simultaneamente ao sinal do leitor. SISTEMA DE PONTOS: quem acertar EXATAMENTE ganha 5 pontos (bônus por precisão). Se ninguém acertar exato, quem estiver MAIS PRÓXIMO (por cima ou por baixo) ganha 3 pontos. Cada jogador também pode opcionalmente apostar em quem vai acertar ou estar mais próximo — acertar a aposta vale 1 ponto bônus extra. Isso cria uma camada de meta-raciocínio interessante.\n\nFim e vitória: após todas as rodadas, some os pontos totais. Quem tiver a maior pontuação vence o campeonato do palpite certo, combinando conhecimento, intuição numérica e leitura dos adversários!"},
