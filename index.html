  {id:"990.125",nome:"Super Soletrando",editora:"Grow",cat:"Palavras",idade:"8+",jog:"2-6",anos:"Todos",comp:"500+ palavras em cartas de dificuldade variada, manual com regras.",obs:"",regras:"Preparação: distribua as cartas de palavras em 3 pilhas por nível de dificuldade: BÁSICO (palavras simples do cotidiano), MÉDIO (palavras com dificuldades comuns como duplo r, lh, nh, ss) e AVANÇADO (palavras raras, estrangeirismos ou de grafia complexa). Defina o modo: individual, equipes de 2-3 ou torneio eliminatório.\n\nObjetivo: soletrar corretamente o maior número de palavras para acumular pontos e vencer o campeonato de soletração.\n\nComo jogar: o mediador pega 1 carta e lê a palavra em voz alta claramente (pode usar em uma frase para contextualizar). O jogador da vez soletra letra por letra em voz alta: A-N-I-M-A-L. O mediador pode repetir a palavra uma única vez se o jogador solicitar antes de iniciar. MODOS ESPECIAIS: algumas cartas pedem soletrar ao CONTRÁRIO (de trás para frente); outras pedem identificar a sílaba TÔNICA; outras pedem DIVISÃO SILÁBICA completa. Pontuação: palavra básica = 1 ponto; média = 2 pontos; avançada = 3 pontos; erros = 0 ponto. Em equipes, os pontos vão para a equipe e cada integrante soletra por turno.\n\nFim e vitória: ao esgotar as cartas ou no número definido de rodadas, some os pontos acumulados. Quem ou qual equipe acumular mais pontos é coroado Campeão da Soletração FUNIX!"},
  {id:"990.126",nome:"War",editora:"Grow",cat:"Estratégia",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro mapa-mundi, 40 territorios, exercitos em 5 cores, dados, cartas de missao, manual.",obs:"",regras:"Preparação: posicione os exércitos inicialmente nos 40 territórios do mapa-mundi (distribuição combinada ou aleatória). Distribua 1 carta de missão secreta para cada jogador em envelope fechado — NINGUÉM revela a missão durante o jogo. Defina a ordem dos turnos com o dado. Distribua os exércitos de reforço iniciais conforme o manual.\n\nObjetivo: completar sua missão secreta antes dos outros — conquistar territórios de 2 continentes específicos, eliminar o exército de determinada cor, ou controlar um número mínimo de territórios com pelo menos 2 exércitos cada.\n\nComo jogar: cada turno tem 3 fases. (1) REFORÇOS: ganhe exércitos extras conforme territórios controlados (1 exército a cada 3 territórios, mínimo 3) mais bônus de continentes inteiramente dominados. (2) ATAQUE: ataque territórios adjacentes ao seu — atacante usa até 3 dados, defensor até 2; compare os maiores dados em par (atacante precisa superar para vencer; empate favorece defensor). Conquiste pelo menos 1 território para ganhar 1 carta de bônus no final do turno. Troque 3 cartas de um conjunto por exércitos extras. (3) REPOSICIONAMENTO: mova exércitos entre territórios conectados como desejar.\n\nFim e vitória: quando completar sua missão, revele a carta e vença! Alternativamente, conquistar TODOS os territórios do mapa garante vitória por dominação total — mas seus adversários estão de olho nas suas movimentações!"},
  {id:"990.127",nome:"Batalha das Letras",editora:"—",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Todos",comp:"Cartas de letras e palavras, tabuleiro ou grade de pontuação.",obs:"",regras:"Preparação: embaralhe as cartas de letras separadamente das cartas de palavras e coloque-as em pilhas no centro. Distribua 5 cartas de letras para cada jogador como mão inicial. Defina o número de rodadas ou o tempo total de jogo.\n\nObjetivo: formar as palavras mais longas possíveis usando as letras disponíveis para acumular o maior número de pontos ao longo das rodadas.\n\nComo jogar: em cada rodada, letras são reveladas progressivamente do baralho central e os jogadores competem para compor as melhores palavras com as letras em mão. Cada letra tem um valor em pontos — letras raras (X, Z, K) valem mais. Palavras mais longas multiplicam a pontuação. Para declarar uma palavra: grite STOP, mostre as cartas formando a palavra. Palavras devem ser válidas em português, aceitas pelo grupo. Outros jogadores podem contestar — use dicionário como árbitro. Bloquear adversários: escolha letras que prejudiquem as combinações que eles visivelmente estão montando.\n\nFim e vitória: após todas as rodadas, some os pontos acumulados por palavras válidas declaradas. Quem acumulou mais pontos vence o campeonato das letras!"},
  {id:"990.128",nome:"Batalha Naval",editora:"—",cat:"Clássico",idade:"8+",jog:"2",anos:"Todos",comp:"Grade de tabuleiro para cada jogador, pecas de navios, marcadores.",obs:"",regras:"Preparação: cada jogador recebe uma grade dupla — uma para posicionar sua frota em segredo e outra para marcar os disparos adversários. Posicione secretamente: 1 porta-aviões (5 casas), 1 cruzador (4 casas), 2 destróieres (3 casas cada) e 1 submarino (2 casas). Navios em linhas horizontais ou verticais, nunca diagonais, sem se tocarem.\n\nObjetivo: afundar toda a frota adversária antes que ele afunde a sua, deduzindo onde os navios estão escondidos por eliminação.\n\nComo jogar: os jogadores se alternam chamando coordenadas em voz alta (ex.: B-3, F-7). O adversário responde honestamente: ÁGUA se a casa estiver vazia, ACERTOU! se bater em um navio (marque com X). Quando TODOS os quadrados de um navio forem atingidos: AFUNDOU! e o adversário informa qual navio. Marque na sua grade de ataque o que acertou e o que errou. Use lógica dedutiva: ao acertar, ataque as casas adjacentes para encontrar a extensão do navio. Evite padrões previsíveis ao posicionar sua frota!\n\nFim e vitória: quem afundar TODA a frota adversária primeiro vence a batalha naval! Estratégia de posicionamento inicial é tão importante quanto a precisão dos ataques."},
  {id:"990.129",nome:"Radar",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"2-4",anos:"Todos",comp:"Tabuleiro de radar circular, cartas de objetos, marcadores.",obs:"",regras:"Preparação: coloque o tabuleiro de radar circular no centro, acessível a todos os jogadores. Embaralhe as cartas de objetos em uma pilha. Todos ficam em posição de alcançar o tabuleiro com a mão.\n\nObjetivo: ser o mais rápido a localizar e tocar o símbolo ou objeto correto no radar para acumular o maior número de cartas.\n\nComo jogar: vire a carta do topo — ela mostra um símbolo ou objeto específico que está escondido entre os muitos ícones do tabuleiro de radar. No momento da revelação, todos vasculham simultaneamente o tabuleiro e tentam tocar o objeto correto o mais rápido possível. O PRIMEIRO a tocar corretamente ganha a carta como ponto. Cuidado: o radar tem ícones parecidos mas não idênticos — atenção aos detalhes de cor, formato e tamanho. VARIAÇÕES: cartas básicas mostram o objeto exato; cartas avançadas descrevem em palavras; cartas expert listam apenas uma característica do objeto.\n\nFim e vitória: quando todas as cartas forem disputadas, quem acumulou mais cartas vence o campeonato de identificação rápida e atenção visual!"},
  {id:"990.131",nome:"Memomímica – Divertidamente 2",editora:"—",cat:"Comunicação",idade:"6+",jog:"2+",anos:"Y1-Y3",comp:"Cartas de emoções e personagens do filme Divertidamente 2, instrucoes.",obs:"",regras:"Preparação: separe as cartas de emoções (Alegria, Tristeza, Raiva, Medo, Nojinho, Tédio, Ansiedade, Vergonha e outros novos personagens de Divertidamente 2) das cartas de situações do filme. Embaralhe cada conjunto separado. Defina equipes ou modo individual.\n\nObjetivo: adivinhar emoções e cenas icônicas de Divertidamente 2 por mímica criativa, combinando interpretação corporal com memória das cartas usadas.\n\nComo jogar — FASE DE MÍMICA: o ator pega uma carta (emoção ou cena) sem mostrar e usa apenas expressões faciais, gestos e movimentos corporais para imitá-la. SEM sons, SEM falar, SEM indicar letras. Os outros tentam adivinhar livremente. Ator e adivinhador correto ganham 1 ponto cada. FASE DE MEMÓRIA: após várias rodadas de mímica, espalhe todas as cartas usadas viradas para baixo em grade. Jogadores devem encontrar pares de cartas relacionadas — emoção + situação que a causou no filme — virando 2 por vez (clássico jogo da memória). Par correto = 1 ponto extra.\n\nFim e vitória: some os pontos de mímica e memória. Quem acumular mais pontos vence a experiência emocional temática de Divertidamente 2!"},
  {id:"990.132",nome:"Mixtura",editora:"—",cat:"Cartas",idade:"8+",jog:"2-4",anos:"Todos",comp:"Baralho de cartas com ingredientes e receitas.",obs:"",regras:"Preparação: embaralhe o baralho de ingredientes e distribua 5 cartas para cada jogador como mão inicial. Distribua 3 cartas de receitas para cada jogador (objetivos secretos). O restante forma a pilha de compra central. Separe o baralho de cartas especiais ao lado.\n\nObjetivo: completar o maior número de receitas secretas coletando os ingredientes exatos antes que os adversários completem as deles.\n\nComo jogar: na sua vez, compre 1 carta da pilha central e execute até 2 ações: colocar ingredientes coletados na sua área de jogo, jogar uma carta especial (roubar ingrediente de adversário, forçar descarte ou bloquear jogada), ou descartar cartas indesejadas. Cada receita exige combinações específicas de ingredientes em quantidade, cor e tipo. Ao completar uma receita: mostre ao grupo, descarte os ingredientes usados, marque o ponto na ficha e pesque uma nova carta de receita para manter sempre 3 objetivos. Adversários com cartas de roubo podem levar ingredientes que você estava acumulando.\n\nFim e vitória: quando a pilha de compra se esgotar ou alguém completar um número definido de receitas, some os pontos. Quem completou mais receitas (ou a de maior valor) vence o campeonato culinário!"},
  {id:"990.133",nome:"É Proibido Falar!",editora:"—",cat:"Comunicação",idade:"8+",jog:"2+",anos:"Todos",comp:"Cartas de palavras secretas, ampulheta.",obs:"",regras:"Preparação: divida em 2 equipes de igual tamanho. Embaralhe as cartas de palavras secretas. Cada equipe nomeia um comunicador para começar (alterna a cada rodada). Vire a ampulheta (60 segundos recomendados por rodada).\n\nObjetivo: fazer a equipe adivinhar o maior número de palavras secretas usando APENAS mímica pura — absolutamente nenhum som ou letra pode ser usado.\n\nComo jogar: o comunicador pega a carta e lê a palavra em segredo. Usando apenas expressões faciais, movimentos do corpo, gestos com mãos e postura — comunica a palavra à equipe. ABSOLUTAMENTE PROIBIDO: qualquer som vocal (incluindo respiração exagerada), indicar letras no ar, mostrar tamanho com as mãos de forma óbvia, apontar para objetos reais no ambiente que representem a palavra. A equipe chuta livremente enquanto o comunicador acenar sim ou não com a cabeça (SEM fazer isso de forma muito explícita). Quando acertar, o comunicador pega a próxima carta imediatamente. Pode pular palavras impossíveis, mas desconta 1 ponto.\n\nFim e vitória: some os pontos de acertos e subtraia os pulos. A equipe com mais pontos em todas as rodadas vence o torneio do silêncio absoluto!"},
  {id:"990.134",nome:"Passa Letra",editora:"—",cat:"Palavras",idade:"8+",jog:"2-6",anos:"Todos",comp:"Cartas de categorias e letras.",obs:"",regras:"Preparação: embaralhe as cartas de categorias e as cartas de letras em pilhas separadas. Decida se o jogo será simultâneo (todos competem ao mesmo tempo) ou em turnos (cada jogador tem sua vez). Posicione todos em roda ou ao redor da mesa.\n\nObjetivo: ser o mais rápido a citar palavras válidas combinando categoria + letra para acumular o maior número de cartas ao longo do jogo.\n\nComo jogar — MODO SIMULTÂNEO: vire ao mesmo tempo 1 carta de categoria (ex.: 'frutas') e 1 carta de letra (ex.: P). Todos competem para ser o primeiro a gritar uma palavra válida que atenda aos dois critérios (ex.: Pêra, Pêssego). O mais rápido ganha a carta-ponto. Palavras impróprias, inválidas ou já citadas naquela rodada são descartadas. — MODO TURNO: cada jogador tem 10 segundos após ver a categoria e letra para citar uma palavra válida. Acertou no tempo: ponto. Errou ou demorou: perde a vez. VARIAÇÃO: citar 3 palavras válidas no tempo dobrado vale 3 pontos (modo desafiador).\n\nFim e vitória: quando todas as cartas forem disputadas, some os pontos. Quem acumular mais vence o torneio de vocabulário rápido!"},
  {id:"990.135",nome:"Imagem & Ação Maluco",editora:"Grow",cat:"Comunicação",idade:"8+",jog:"4+",anos:"Y4-Y5",comp:"1 tabuleiro, 1 ampulheta, 1 baralho, 4 peões, 2 dados, 2 canetas, 1 tapa-olho, 1 lousa reutilizavel, 1 gabarito.",obs:"",regras:"Preparação: divida em 2 equipes (2-4 por equipe). Posicione o tabuleiro ao centro com os peões na largada. Distribua as canetas e a lousa reutilizável apagável. O tapa-olho vai para o desenhista (para ver a carta discretamente). Dados e ampulheta prontos.\n\nObjetivo: adivinhar o maior número de palavras desenhadas na lousa para avançar mais rápido pelo tabuleiro e chegar ao final.\n\nComo jogar: role os dados para determinar quantas casas o desenhista pode avançar se a equipe adivinhar. O desenhista pega a carta pelo tapa-olho, vê a palavra e começa a desenhar na lousa imediatamente — SEM letras, números, fala ou gestos. A equipe tenta adivinhar durante o tempo da ampulheta. Se acertar: avança as casas indicadas. CARTAS MALUCO: quando a carta maluco for sorteada, um desafio especial entra em cena — desenhar com a mão não dominante, de olhos fechados, em menos de 15 segundos, ou outra variante surpreendente. Cartas maluco valem mais casas de avanço quando adivinhadas. Após cada rodada, apague a lousa.\n\nFim e vitória: a primeira equipe a chegar ao final do percurso do tabuleiro vence o campeonato artístico maluco!"},
  {id:"990.136",nome:"Imagem & Ação 2",editora:"Grow",cat:"Comunicação",idade:"8+",jog:"4+",anos:"Y4-Y5",comp:"1 tabuleiro, 1 ampulheta, 1 baralho com centenas de palavras, 4 peões, 2 dados.",obs:"",regras:"Preparação: divida em 2 equipes. Coloque o tabuleiro no centro com os peões das equipes na largada. Distribua papel e caneta para o desenhista. Baralho de palavras embaralhado com a ampulheta ao lado.\n\nObjetivo: fazer a equipe adivinhar o maior número de palavras desenhadas para avançar pelo tabuleiro e chegar primeiro ao final.\n\nComo jogar: o desenhista da equipe pega uma carta e vê a palavra (sem mostrar). Vira a ampulheta e começa a desenhar no papel — PROIBIDO escrever letras ou números, fazer gestos, falar ou sinalizar com o corpo. A equipe tenta adivinhar livremente durante o tempo da ampulheta. Se acertar: avança no tabuleiro. Se não acertar no tempo: a equipe adversária pode tentar uma resposta única e roubar o ponto de avanço. Categorias variam: objetos simples, verbos (desenhar ações é mais difícil!), conceitos abstratos, expressões idiomáticas e provérbios. Palavras difíceis têm estrela e valem 2 casas. Desenhistas alternam a cada rodada dentro da equipe.\n\nFim e vitória: a primeira equipe a chegar à casa final do percurso vence o campeonato de Imagem & Ação 2!"},
  {id:"990.137",nome:"Imagem & Ação Junior",editora:"Grow",cat:"Comunicação",idade:"6+",jog:"4+",anos:"Todos",comp:"1 baralho azul (facil), 1 baralho preto (medio), 233 quadros plastificados para desenho, 2 canetas de secagem rapida, 1 apagador, 1 ampulheta.",obs:"",regras:"Preparação: distribua os quadros plásticos e as canetas de secagem rápida para os desenhistas. Baralho AZUL (fácil) para turmas de Y1-Y2 ou iniciantes; baralho PRETO (médio) para Y3-Y5 ou jogadores mais experientes. Divida em 2 equipes ou jogue em roda com pontuação individual.\n\nObjetivo: fazer a equipe ou o grupo adivinhar as palavras ou conceitos que o desenhista representa no quadro plástico reutilizável.\n\nComo jogar: o desenhista pega uma carta (baralho escolhido), vê a palavra sem mostrar e começa a desenhar no quadro plástico quando o sinal for dado. SEM letras, números, falar ou gesticular — apenas o desenho comunica. A equipe tenta adivinhar livremente. Se acertar no tempo: ponto para a equipe! Após cada tentativa (acerto ou erro), a caneta de secagem rápida já está seca e o quadro pode ser apagado com o apagador para reutilizar. Baralho azul: animais, brinquedos, comidas, personagens infantis. Baralho preto: verbos, ações, cenários, objetos menos óbvios. DICA para turmas mistas: coloque Y4-Y5 no baralho preto e Y1-Y3 no azul.\n\nFim e vitória: após igual número de rodadas, a equipe com mais acertos (ou o jogador individual com mais pontos) vence o campeonato artístico junior!"},
  {id:"990.138",nome:"Perfil Junior",editora:"Grow",cat:"Conhecimento",idade:"6+",jog:"2-6",anos:"Y1-Y3",comp:"Cartas com personagens e objetos infantis, dicas numeradas de 1 a 10, tabuleiro de pontuacao.",obs:"",regras:"Preparação: separe as cartas por categoria (animais, brinquedos, personagens de desenho, objetos do cotidiano). Defina modo individual ou em equipes. Coloque o tabuleiro de pontuação ao alcance de todos.\n\nObjetivo: adivinhar o personagem ou objeto secreto com o MENOR número de dicas possível — quanto antes acertar, mais pontos ganha.\n\nComo jogar: um jogador (ou o mediador) pega uma carta e lê as dicas numeradas uma por vez, do 1 ao 10. DICA 1 é a mais difícil e vaga (apenas 1 detalhe pouco óbvio). DICA 10 é a mais fácil e reveladora (quase diz o nome). Após CADA dica revelada, qualquer jogador (ou equipe, se no modo equipes) pode tentar responder. Se acertar na dica 1: 10 pontos; dica 2: 9 pontos; ... dica 10: 1 ponto. REGRA IMPORTANTE: a primeira resposta errada em cada rodada não desconta pontos, mas nas seguintes cada erro desconta 1 ponto — então pense bem antes de responder!\n\nFim e vitória: após um número igual de cartas para cada jogador/equipe, some os pontos acumulados. Quem adivinhou mais cedo e mais vezes vence o torneio de Perfil Junior!"},
  {id:"990.139",nome:"Perfil 7",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas com personagens historicos, filmes, ciencia, arte e muito mais. Tabuleiro e marcadores.",obs:"",regras:"Preparação: coloque o tabuleiro ao centro com peões na largada. Embaralhe as cartas de todas as categorias (Ciência, História, Arte, Esporte, Natureza, Entretenimento). Defina individual ou equipes. Designe um leitor por rodada (pode rotacionar).\n\nObjetivo: adivinhar personagens, objetos e conceitos com o menor número de dicas possível para acumular a maior pontuação e vencer a pergunta central.\n\nComo jogar: o leitor pega uma carta e lê as dicas numeradas progressivamente — dica 1 (ultra-difícil, detalhe obscuro) até dica 10 (quase revela o nome). Após cada dica, os jogadores podem tentar responder. PONTUAÇÃO: acertar na dica 1 = 10 pontos; dica 2 = 9 pontos; e assim por diante. Cada resposta errada = 0 ponto, mas não desconta. SISTEMA TABULEIRO: avance pelo percurso conforme pontos acumulados. Para vencer, o jogador precisa responder perguntas de todas as 6 categorias e depois chegar ao centro para a pergunta final. Categorias cobrem desde fatos históricos até cultura pop — o jogo mais completo da linha Perfil.\n\nFim e vitória: o primeiro a chegar ao centro e responder corretamente a pergunta final (do nível de dificuldade correspondente) vence o título de Mestre do Perfil 7!"},
  {id:"990.140",nome:"Descubra Aí Animais",editora:"—",cat:"Conhecimento",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"Cartas de animais com imagens e curiosidades, tabuleiro ou trilha.",obs:"",regras:"Preparação: coloque o tabuleiro de safari ao centro com os peões na largada. Embaralhe as cartas de animais em pilha. Defina a ordem dos turnos. Cada carta tem perguntas de 3 categorias: HABITAT (onde vive?), ALIMENTAÇÃO (o que come?) e CURIOSIDADES (fatos surpreendentes).\n\nObjetivo: percorrer o safari respondendo perguntas sobre o reino animal e chegar primeiro ao final da jornada pelo mundo selvagem.\n\nComo jogar: na sua vez, role o dado e avance pelo tabuleiro. A cor da casa indica a categoria da pergunta a responder. Outro jogador lê a pergunta da categoria indicada. Acertou: avance 1 casa extra como bônus. Errou: fique onde está, mas ouça a resposta correta e o fato curioso impresso no verso da carta — mesmo errando você aprende algo incrível! Casas especiais: PEGADA (avance 3 casas, mas responda uma pergunta difícil primeiro), BURAÇO (recue 2 casas — o animal entrou na toca!). Dificuldade progressiva: casas mais avançadas têm perguntas mais complexas.\n\nFim e vitória: o primeiro a chegar ao final do percurso safari vence a grande jornada pelo reino animal!"},
  {id:"990.141",nome:"Geobrasil",editora:"—",cat:"Conhecimento",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Tabuleiro do mapa do Brasil, cartas de perguntas por regiao, dados, peons.",obs:"",regras:"Preparação: coloque o tabuleiro com o mapa do Brasil ao centro com os peões na largada. Separe as cartas de perguntas por região: Norte, Nordeste, Centro-Oeste, Sudeste e Sul. Distribua fichas de conhecimento ao lado. Defina a ordem dos turnos.\n\nObjetivo: percorrer as 5 regiões brasileiras respondendo perguntas geográficas e culturais para acumular o maior número de fichas de conhecimento.\n\nComo jogar: na sua vez, role o dado e avance pelo mapa em direção à próxima região. Ao chegar em uma região, um adversário lê uma pergunta da pilha daquela área: pode ser sobre estados (capitais, siglas, localização), rios (nomes, extensão), biomas (Amazônia, Cerrado, Caatinga, Mata Atlântica, Pampa, Pantanal), culinária regional ou tradições culturais. Acertou: ganhe 1 ficha de conhecimento (mais difícil = 2 fichas). Errou: ouça a resposta e avance 1 casa sem ficha. Casas especiais exigem completar um desafio extra (citar 3 estados de uma região, por exemplo) para ganhar ficha bônus.\n\nFim e vitória: quando todos os jogadores tiverem visitado todas as 5 regiões, some as fichas de conhecimento acumuladas. Quem tiver mais fichas vence a aventura pelo Brasil gigante!"},
  {id:"990.142",nome:"Abalone",editora:"Abalone S.A.",cat:"Estratégia",idade:"8+",jog:"2",anos:"Y4-Y5",comp:"Tabuleiro hexagonal, 14 bolinhas brancas, 14 bolinhas pretas.",obs:"",regras:"Preparação: posicione as 14 bolinhas brancas e 14 pretas no tabuleiro hexagonal conforme a formação inicial padrão (ou escolha entre as 3 variações de setup). O jogador com as pretas começa.\n\nObjetivo: empurrar 6 bolinhas adversárias para fora do tabuleiro hexagonal usando movimentos estratégicos de grupo.\n\nComo jogar: na sua vez, mova 1, 2 ou 3 das suas bolinhas em linha contínua em QUALQUER uma das 6 direções do hexágono. REGRA DO SUMÔ: você só pode empurrar bolinhas adversárias se seu grupo for NUMERICAMENTE MAIOR — 2 contra 1 (empurra) ou 3 contra 2 (empurra), mas 2 contra 2 ou 2 contra 3 não pode empurrar. Bolinhas empurradas para fora do hexágono são eliminadas e contadas. ESTRATÉGIA BÁSICA: forme grupos de 3 no centro para ter máximo poder de empurrão e proteção simultânea. Evite deixar bolinhas isoladas — ficam vulneráveis. O controle do centro do tabuleiro é vital.\n\nFim e vitória: o primeiro a eliminar 6 bolinhas adversárias (empurrando para fora do tabuleiro) vence o duelo de sumo hexagonal! Uma partida dura entre 10 e 30 minutos dependendo da experiência dos jogadores."},
  {id:"990.143",nome:"Senha I",editora:"—",cat:"Estratégia",idade:"8+",jog:"2",anos:"Y4-Y5",comp:"Tabuleiro de mastermind, pinos coloridos (6 cores), pinos de feedback (preto e branco).",obs:"",regras:"Preparação: um jogador (o CODIFICADOR) cria secretamente uma sequência de 4 pinos coloridos atrás do escudo — cores podem se repetir. Há 6 cores disponíveis, então existem 1.296 combinações possíveis! O outro jogador (o DECODIFICADOR) tem até 10 tentativas para descobrir a sequência exata.\n\nObjetivo: descobrir a sequência secreta de 4 cores na ordem correta usando o mínimo de tentativas possível, interpretando os pinos de feedback a cada jogada.\n\nComo jogar: o Decodificador monta uma tentativa de 4 pinos coloridos na primeira linha. O Codificador responde com pinos de feedback: pino PRETO = cor correta na posição correta; pino BRANCO = cor correta mas na posição errada. Os pinos de feedback não revelam QUAL cor está correta — só a quantidade! Exemplo: tentativa tem 1 preto e 1 branco = 1 cor na posição certa e 1 cor errada de posição. Use lógica dedutiva pura: elimine cores e posições impossíveis com cada rodada de feedback.\n\nFim e vitória: se o Decodificador descobrir o código em até 10 tentativas, ganha a rodada. Se não conseguir, o Codificador vence. Pontue pelo número de tentativas usadas — menos tentativas = mais pontos. Alterne os papéis e some os pontos totais."},
  {id:"990.144",nome:"Mancala",editora:"—",cat:"Clássico",idade:"6+",jog:"2",anos:"Todos",comp:"Tabuleiro com 12 covas e 2 mancalas (grandes), 48 sementes.",obs:"",regras:"Preparação: posicione o tabuleiro de Mancala com as 2 fileiras de 6 covas e as 2 mancalas grandes nas extremidades. Coloque 4 sementes em cada uma das 12 covas (48 sementes no total). As 2 mancalas ficam vazias — serão o banco de pontos de cada jogador.\n\nObjetivo: acumular o maior número de sementes na sua mancala (o banco grande do seu lado) ao final do jogo.\n\nComo jogar: na sua vez, escolha qualquer uma das suas 6 covas que tenha sementes. Pegue TODAS as sementes daquela cova e distribua-as uma por uma no sentido horário pelas covas seguintes, incluindo a SUA mancala mas PULANDO a mancala do adversário. REGRAS ESPECIAIS: (1) Se a última semente cair na SUA mancala, você joga novamente! Encadeie turnos estrategicamente. (2) Se a última semente cair em uma COVA VAZIA do seu lado, capture essa semente MAIS todas as sementes da cova do adversário diretamente oposta — vão direto para sua mancala. Planejamento de encadeamento de turnos é a chave da estratégia.\n\nFim e vitória: quando todas as covas de um lado ficarem vazias, o jogo termina. O adversário pega todas as sementes restantes do próprio lado. Quem tiver mais sementes na mancala vence o jogo milenar!"},
  {id:"990.145",nome:"Hash Toy",editora:"—",cat:"Clássico",idade:"5+",jog:"2",anos:"Y1-Y3",comp:"Grade 3x3 com pecas tridimensionais de duas cores.",obs:"",regras:"Preparação: coloque o tabuleiro 3x3 no centro com todas as 9 posições vazias. Distribua as peças tridimensionais de cada cor para os dois jogadores (geralmente X e O em formatos físicos distintos). Decida quem começa com um sorteio ou a pedra-papel-tesoura.\n\nObjetivo: ser o primeiro a completar 3 peças da sua cor em linha antes do adversário, seja horizontalmente, verticalmente ou na diagonal.\n\nComo jogar: os jogadores se alternam posicionando UMA peça por turno em qualquer espaço vazio da grade 3x3. A cada jogada, você deve pensar em DUAS coisas simultaneamente: criar a sua própria linha de 3 E bloquear a linha de 3 do adversário. Se o adversário tiver 2 peças alinhadas com um espaço vazio, BLOQUEIE imediatamente — a menos que você também tenha uma ameaça imediata mais urgente. Com peças físicas e tridimensionais, o jogo ganha uma sensação tátil especial que o diferencia do jogo no papel.\n\nFim e vitória: quem completar 3 em linha primeiro vence a rodada! Se todas as 9 posições forem preenchidas sem vencedor — empate total. Jogue múltiplas rodadas e some os pontos: 1 ponto por vitória, 0 por empate. Em 5 rodadas, quem tiver mais pontos vence o hash!"},
  {id:"990.146",nome:"Enigma do Labirinto",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"1-4",anos:"Y4-Y5",comp:"Tabuleiro de labirinto, cartas de enigma, peons, timer.",obs:"",regras:"Preparação: monte o tabuleiro de labirinto com as salas conectadas por passagens. Posicione os peões na entrada externa. Coloque o tesouro no centro do labirinto. Separe as cartas de enigma por tipo (lógico, matemático, raciocínio espacial). Vire o timer para cada enigma (geralmente 2 minutos).\n\nObjetivo: navegar pelo labirinto resolvendo enigmas em cada sala para ser o primeiro a alcançar o tesouro no centro.\n\nComo jogar: para avançar de uma sala para a próxima, o jogador deve resolver o enigma da sala atual antes do tempo acabar. ENIGMAS LÓGICOS: sequências de padrões, analogias (A está para B assim como C está para ___). ENIGMAS MATEMÁTICOS: cálculos, sequências numéricas, problemas de lógica matemática. ENIGMAS DE RACIOCÍNIO: charadas, perspectivas espaciais, problemas de dedução. Errar um enigma: você permanece na sala atual e perde 1 turno (voltou pelo caminho). Pode-se jogar cooperativamente com todos debatendo as soluções coletivamente — nesse caso, celebre cada enigma resolvido como vitória do grupo.\n\nFim e vitória: o primeiro jogador a chegar à sala central com o tesouro vence! No modo cooperativo, todos vencem se o grupo resolver todos os enigmas e chegar ao centro antes do tempo global acabar."},
  {id:"990.147",nome:"Beaver Creek",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Tabuleiro do rio, pecas de castores e barragens, cartas de recursos, dados.",obs:"",regras:"Preparação: monte o tabuleiro do rio com as trilhas de recursos ao longo das margens. Coloque os recursos (madeira, pedra, lama) nos locais indicados. Distribua os castores de cada cor na margem inicial. Embaralhe as cartas de eventos (cheias e secas) e coloque em pilha separada.\n\nObjetivo: construir a barragem mais eficiente no rio coletando os recursos certos e posicionando segmentos estrategicamente antes que adversários bloqueiem os melhores pontos.\n\nComo jogar: na sua vez, mova seu castor pelo tabuleiro do rio para coletar recursos das margens (madeira, pedra, lama em quantidades variadas). Com os recursos coletados, construa segmentos de barragem em pontos estratégicos do rio. ESTRATÉGIA: posicione segmentos que desviem a corrente favorecendo sua barragem e complicando a dos adversários. Outros castores podem tentar ocupar os mesmos pontos, criando disputa por posição. CARTAS DE EVENTO: cada 3 turnos, vire uma carta de evento — CHEIA aumenta o fluxo e pode destruir barragens fracas; SECA reduz recursos disponíveis e valoriza os armazenados.\n\nFim e vitória: ao final das 4 estações (rodadas), avalie as barragens construídas — tamanho, solidez (materiais usados) e posicionamento estratégico. Quem tiver a barragem mais completa e resistente vence o território do rio!"},
  {id:"990.148",nome:"Hidden Leaders",editora:"Pegasus Spiele",cat:"Estratégia",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas de herois, cartas de lider secreto, tokens de poder das 3 fracoes, manual.",obs:"",regras:"Preparação: distribua secretamente 1 carta de líder para cada jogador — revela qual das 3 facções você apoia (Luz, Sombra ou Floresta) sem mostrar a ninguém. Coloque as 3 fichas de poder (uma por facção) no valor inicial no tabuleiro de equilíbrio. Embaralhe as cartas de heróis e distribua 5 para cada jogador.\n\nObjetivo: ser um dos jogadores apoiando a facção dominante ao final do jogo, manipulando o equilíbrio de poder entre as 3 facções enquanto esconde sua própria lealdade.\n\nComo jogar: na sua vez, jogue 1 ou 2 cartas de heróis da mão. Cada herói pertence a uma facção e, ao ser jogado, altera o marcador de poder daquela facção (sobe) enquanto pode enfraquecer outra. Você pode jogar heróis de QUALQUER facção — mesmo que não seja a sua — para confundir os adversários sobre a sua lealdade. A arte do jogo é fortalecer sua facção sem revelar que é a sua. Observe os outros: quem está constantemente fortalecendo a mesma facção provavelmente é aliado dela.\n\nFim e vitória: quando o baralho se esgotar, a facção com mais poder vence. TODOS os jogadores que apoiavam secretamente a facção vencedora ganham! Os traidores (que apoiavam outra) perdem, mesmo que tenham ajudado a vencer por engano."},
  {id:"990.149",nome:"Identidade Secreta",editora:"—",cat:"Comunicação",idade:"10+",jog:"4+",anos:"Y4-Y5",comp:"Cartas de identidade (cidadao, mafioso, detetive, medico, etc.), fichas de dia e noite.",obs:"",regras:"Preparação: o mediador distribui 1 carta de identidade secreta para cada jogador: maioria recebe CIDADÃO, 2-3 recebem MAFIOSO, 1 recebe DETETIVE, 1 recebe MÉDICO (adapte ao tamanho do grupo). Todos leem sua carta e a guardam em segredo. O mediador conduz o jogo.\n\nObjetivo: cidadãos vencem eliminando todos os mafiosos por votação; mafiosos vencem quando igualarem ou superarem o número de cidadãos restantes.\n\nComo jogar — FASE NOITE: o mediador pede que todos fechem os olhos. Mafiosos abrem os olhos, se reconhecem em silêncio e apontam para uma vítima — essa pessoa será eliminada ao amanhecer. O Médico abre os olhos e aponta para 1 pessoa a salvar (pode ser a si mesmo). O Detetive abre os olhos e aponta para 1 suspeito — o mediador indica sim ou não se é mafioso. Todos abrem os olhos. FASE DIA: o mediador anuncia a vítima da noite (a menos que o Médico a tenha salvo). Todos debatem livremente por 3-5 minutos: acusações, defesas, argumentações e blefe são permitidos. Ao final, todos votam para eliminar 1 suspeito — maioria decide. Eliminados revelam sua identidade.\n\nFim e vitória: cidadãos vencem quando eliminarem todos os mafiosos. Mafiosos vencem quando igualarem cidadãos (controle da votação diurna)."},
  {id:"990.150",nome:"Boom",editora:"—",cat:"Habilidade Motora",idade:"6+",jog:"2+",anos:"Todos",comp:"Dispositivo de passa-a-bomba, cartas de desafio.",obs:"",regras:"Preparação: distribua as cartas de desafio em uma pilha no centro. Um jogador pressiona o botão da bomba ativando o timer com conta regressiva aleatória — ninguém sabe quando vai explodir! A bomba passa entre os jogadores em roda.\n\nObjetivo: não estar segurando a bomba quando ela explodir, completando os desafios das cartas rápido o suficiente para passar adiante.\n\nComo jogar: quem receber a bomba deve imediatamente virar uma carta de desafio e completá-lo antes de passar: VERBAL (citar 3 frutas vermelhas, dizer 5 capitais de países, contar de 10 em 10 até 100), FÍSICO (fazer 5 polichinelos, tocar o nariz com a língua, ficar em pé numa perna), ou CRIATIVO (fazer uma careta específica, inventar 1 verso de uma música). Completou o desafio? Passe a bomba imediatamente para o próximo! Pode-se pular 1 carta por rodada pagando 1 ficha de penalidade — mas a bomba fica com você enquanto tenta a próxima. A detonação é aleatória entre 30 e 90 segundos.\n\nFim e vitória: quem estiver segurando a bomba quando ela explodir perde 1 ponto. Jogue um número definido de rodadas; quem tiver mais pontos (menos explosões) vence o duelo da bomba-relógio!"},
  {id:"990.151",nome:"Hamburgueria Maluca",editora:"—",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Pecas de ingredientes de hamburguer, carta de pedido, base de hamburguer.",obs:"",regras:"Preparação: distribua para cada jogador um conjunto idêntico de peças de ingredientes de hambúrguer (base de pão, alface, carne, queijo, tomate, cebola, pickle e topo de pão). Embaralhe as cartas de pedido e coloque em pilha virada. Todos posicionam seus ingredientes espalhados na mesa à frente, prontos para montar.\n\nObjetivo: ser o primeiro a montar o hambúrguer na ORDEM EXATA indicada pela carta de pedido sem deixar a pilha cair.\n\nComo jogar: vire a carta do topo revelando a sequência de ingredientes do pedido (ex.: pão → carne → queijo → alface → tomate → pão). No momento da revelação, TODOS competem simultaneamente para empilhar seus ingredientes na ordem correta de baixo para cima. Os ingredientes devem ser encaixados ou equilibrados conforme o design das peças. O primeiro a completar a pilha na ordem correta grita PRONTO! Os demais verificam se a sequência está correta. Se correto: ponto! Se algum ingrediente estiver fora de ordem: perde o ponto da rodada e a disputa continua. Se a pilha cair durante a verificação, não conta.\n\nFim e vitória: após um número definido de pedidos, quem acumulou mais pontos vence o campeonato da hamburgueria mais rápida da cidade!"},
  {id:"990.152",nome:"Torre Maluca Patrulha Canina",editora:"—",cat:"Habilidade Motora",idade:"4+",jog:"2+",anos:"Y1-Y3",comp:"Blocos coloridos temáticos da Patrulha Canina.",obs:"",regras:"Preparação: monte a torre empilhando os blocos temáticos da Patrulha Canina em camadas de 3 (cada camada com a orientação alternada em relação à anterior). Blocos com Chase, Skye, Marshall, Rocky, Rubble, Zuma e Ryder aparecem em destaque.\n\nObjetivo: retirar blocos da torre sem derrubá-la, colocando-os no topo para mantê-la cada vez mais alta e instável — e não ser o responsável pelo desabamento!\n\nComo jogar: na sua vez, usando apenas UMA mão e somente 3 dedos, empurre ou puxe UM bloco de qualquer nível da torre (exceto o nível do topo). Toque antes de decidir — sinta quais estão soltos. Coloque o bloco retirado na última camada do topo, formando uma nova camada de 3. REGRAS: não pode retirar o último bloco de um nível que está suportando blocos acima. Pode tocar outros blocos para testar a estabilidade, mas deve parar de mexer se qualquer bloco acima se mover. É permitido usar os dedos para estabilizar enquanto retira — mas com uma mão só!\n\nFim e vitória: quem causar o desmoronamento da torre perde a rodada! Nos modos com múltiplas rodadas, quem perder menos rodadas vence. A Patrulha Canina está em missão de equilíbrio — e desta vez você também!"},
  {id:"990.153",nome:"Torre Maluca Gabby's Dollhouse",editora:"—",cat:"Habilidade Motora",idade:"4+",jog:"2+",anos:"Y1-Y3",comp:"Blocos coloridos temáticos da Gabby's Dollhouse.",obs:"",regras:"Preparação: monte a torre empilhando os blocos temáticos de Gabby's Dollhouse em camadas de 3, com orientação alternada entre camadas. Blocos com Gabby, Pandy Paws, Cakey Cat, Kitty Fairy e outros personagens adorados da série.\n\nObjetivo: retirar blocos sem derrubar a torre temática, colocando-os no topo para criar uma torre cada vez mais alta e instável.\n\nComo jogar: na sua vez, usando apenas UMA mão (3 dedos), escolha e retire UM bloco de qualquer nível da torre — exceto o nível mais alto atual. Antes de tirar, você pode tocar os blocos para testar a estabilidade. Coloque o bloco retirado no topo, formando uma nova camada. Não é permitido retirar o último bloco de um nível que ainda suporta camadas acima. Não é permitido usar duas mãos (exceto ao colocar no topo). Se a torre oscilar durante a retirada, tente se recuperar com a mesma mão — se cair, perdeu!\n\nFim e vitória: o jogador que causar o desmoronamento da torre perde a rodada da Dollhouse! Em partidas de múltiplas rodadas, quem perder menos vezes vence e é coroado o melhor construtor da mansão da Gabby!"},
  {id:"990.154",nome:"Tira Troféu",editora:"—",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Torre de trofeus empilhados, instrucoes.",obs:"",regras:"Preparação: monte a pilha de troféus empilhando todas as peças de diferentes formatos e cores no centro da mesa. A pilha pode ter ordenação aleatória ou específica conforme variante escolhida.\n\nObjetivo: retirar o troféu indicado sem derrubara pilha para acumular o maior número de troféus ao longo de todas as rodadas.\n\nComo jogar: na sua vez, uma carta ou dado indica qual troféu você deve retirar — identificado por COR (amarelo, vermelho, azul), FORMATO (estrela, círculo, taça) ou NÚMERO (o impresso no troféu). Com cuidado e precisão, puxe apenas aquele troféu sem tocar nos outros. SUCESSO: guarde o troféu como ponto e passe a vez. FALHA (qualquer outro troféu cair ou se mover): devolva o troféu e também perca 1 troféu que já coletou! Em alguns turnos, a carta indica um troféu muito enterrado na pilha — é quando requer mais precisão e paciência.\n\nFim e vitória: quando a pilha de troféus acabar (todos retirados com sucesso ou a pilha colapsar), some os troféus coletados por cada jogador. Quem tiver mais vence o grande campeonato de equilíbrio e precisão!"},
  {id:"990.155",nome:"Bate Marshmallow",editora:"—",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Todos",comp:"Marshmallow central, cartas de combinacao, instrucoes.",obs:"",regras:"Preparação: coloque o marshmallow (objeto macio central) no centro da mesa ao alcance de todos. Embaralhe as cartas e distribua igualmente entre os jogadores, viradas para baixo. Defina as condições de bater conforme o nível de jogo escolhido (básico, médio ou avançado).\n\nObjetivo: ser o mais rápido a bater no marshmallow quando as condições certas aparecerem, acumulando cartas — sem cometer falsos alarmes que custam caro.\n\nComo jogar: os jogadores se revezam virar 1 carta do topo da própria pilha para uma pilha central. Quando as condições certas aparecerem — que dependem da variante: mesma cor que a anterior, mesmo animal, par de números, ou combinação específica de 2 cartas — QUALQUER jogador pode bater no marshmallow imediatamente. O MAIS RÁPIDO ganha toda a pilha central de cartas (ponto!). FALSO ALARME (bater quando a condição não estava presente): o jogador que bateu por engano deve dar 2 cartas da própria pilha para a central — punição imediata. Nivéis avançados têm condições mais complexas (ex.: quando a soma das duas últimas cartas for 10).\n\nFim e vitória: quando um jogador ficar sem cartas para virar, conte as cartas de cada jogador. Quem tiver mais cartas vence o duelo de reflexos e atenção do Bate Marshmallow!"},
  {id:"990.156",nome:"Food Truck Express",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"2-4",anos:"Todos",comp:"Tabuleiro de cidade, miniaturas de food trucks, cartas de pedido, ingredientes.",obs:"",regras:"Preparação: monte o tabuleiro de cidade com os pontos de ingredientes (mercado de vegetais, açougue, laticínios, etc.) distribuídos no mapa. Posicione os food trucks na garagem inicial. Distribua as cartas de pedido de clientes: pilha pública com pedidos regulares e uma reserva de pedidos VIP. Distribua moedas iniciais para cada jogador.\n\nObjetivo: ser o food truck com mais lucro ao final do dia de trabalho, atendendo pedidos inteligentemente e gerenciando rotas e estoques.\n\nComo jogar: na sua vez, mova seu food truck pelo tabuleiro (número de casas definido pelo dado ou por cartas de ação). Ao parar em um ponto de ingrediente, colete o recurso indicado (capacidade máxima de estoque limitada). Ao parar próximo de um cliente, sirva-o se tiver os ingredientes do pedido — receba o pagamento imediatamente. Pedidos REGULARES: ingredientes comuns, pagamento médio. Pedidos VIP: ingredientes raros ou em combinações específicas, pagamento muito alto. Adversários podem chegar ao mesmo cliente primeiro — quem chegar antes atende. Gerencie sua rota eficientemente para minimizar viagens desnecessárias.\n\nFim e vitória: ao anoitecer (quando a pilha de pedidos acabar ou num número definido de turnos), some o lucro acumulado. O food truck com mais dinheiro vence o campeonato culinário urbano!"},
  {id:"990.157",nome:"Rummikub Palavras Joy",editora:"Grow",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Fichas com letras coloridas, 4 suportes, saco, manual.",obs:"",regras:"Preparação: coloque todas as fichas de letras no saco e misture bem. Cada jogador retira 14 fichas e as posiciona no suporte (sem mostrar aos outros). Deixe o restante no saco como banco de fichas. O primeiro jogador a fazer uma jogada válida de 30 pontos (calculados pelo valor das letras) começa.\n\nObjetivo: ser o primeiro a jogar todas as fichas do suporte, formando ou expandindo palavras válidas na mesa compartilhada.\n\nComo jogar: na sua vez, forme uma ou mais palavras novas com fichas do seu suporte (mínimo 3 letras), ou adicione letras a palavras já na mesa, ou reorganize completamente as palavras existentes para encaixar suas fichas — desde que ao final do seu turno TODAS as palavras na mesa sejam válidas. Curingas substituem qualquer letra (mas guardam o valor da letra que representam). Se não conseguir jogar nada, retire 1 ficha do banco e passe a vez. Estratégia: observe as palavras na mesa que podem ser estendidas ou combinadas de formas criativas.\n\nFim e vitória: o primeiro a jogar TODAS as fichas do suporte anuncia RUMMIKUB e vence! Se o banco acabar, quem tiver menos pontos totais nas fichas restantes vence. Versão com palavras torna o jogo educativo e linguístico!"},
  {id:"990.158",nome:"Kit de Mágicas",editora:"—",cat:"Habilidade Motora",idade:"8+",jog:"1+",anos:"Todos",comp:"Adereços de mágica (cartolas, varinha, lenços, cartas), manual com instrucoes passo a passo.",obs:"",regras:"Preparação: leia as instruções de cada truque antes de apresentar para entender o segredo. Pratique cada truque sozinho várias vezes antes de mostrar a alguém — a repetição e a confiança são a chave! Organize os adereços necessários para o truque escolhido.\n\nObjetivo: aprender, praticar e apresentar truques de mágica reais para surpreender o público com ilusões convincentes.\n\nComo jogar — APRENDIZADO: cada truque tem instruções passo a passo com o SEGREDO revelado (para os olhos do mago apenas!), o MÉTODO (sequência de movimentos ou preparações ocultas), o PATTER (o que falar durante a apresentação para distrair o público) e DICAS DE APRESENTAÇÃO (como olhar, onde posicionar-se, como criar suspense). Truques incluem: desaparecimento de objetos (ilusão visual e mãos rápidas), previsão de cartas (matemática oculta), moeda através da mesa (técnica de dedilhado), levitação de lenços (fio invisível) e outros. SHOW COMPLETO: depois de praticar 3-4 truques, apresente um mini show para o grupo ou a turma.\n\nFim da atividade: mágica é ciência disfarçada! Após o show, pode-se revelar como cada truque funciona para conectar com temas de ótica, física e percepção cognitiva."},
  {id:"990.159",nome:"Pizzaria Maluca",editora:"—",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Pecas de ingredientes de pizza (massa, molho, queijo, ingredientes), cartas de pedido.",obs:"",regras:"Preparação: distribua para cada jogador um conjunto idêntico de peças de ingredientes de pizza: base de massa, molho de tomate, queijo, e os ingredientes de cobertura (pepperoni, cogumelo, pimentão, azeitona, etc.). Embaralhe as cartas de pedido e coloque em pilha virada no centro.\n\nObjetivo: ser o pizzaiolo mais rápido a montar a pizza na ordem exata do pedido para acumular o maior número de pontos e comandar a pizzaria.\n\nComo jogar: vire a carta do topo revelando o pedido: mostra a pizza já montada com os ingredientes em camadas específicas (ex.: massa → molho → queijo → pepperoni → cogumelo). No momento da revelação, TODOS competem simultaneamente para empilhar os ingredientes de baixo para cima na ordem exata. O primeiro a completar corretamente grita PRONTO! Os demais conferem a sequência. Correto: 1 ponto! Se algum ingrediente estiver fora de ordem ou ausente: sem ponto, continue tentando. Pedidos mais complexos (mais camadas) são mais difíceis e valem 2 pontos.\n\nFim e vitória: após um número definido de pedidos (geralmente 10-15), some os pontos. Quem atendeu mais pedidos corretamente vence o campeonato da pizzaria mais agitada!"},
  {id:"990.160",nome:"Uno",editora:"—",cat:"Cartas",idade:"7+",jog:"2-10",anos:"Todos",comp:"108 cartas.",obs:"",regras:"Mesmas regras do Uno classico (990.061). Grite UNO com 1 carta! 3a copia disponivel para grupos grandes."},
  {id:"990.161",nome:"Uno Flip",editora:"Mattel",cat:"Cartas",idade:"7+",jog:"2-10",anos:"Todos",comp:"112 cartas com lado claro e lado escuro.",obs:"",regras:"Preparação: embaralhe o baralho de 112 cartas com dois lados — o lado CLARO (cores e números normais, cartas especiais padrão) e o lado ESCURO (bordas escuras, cartas muito mais severas). Comece com todas as cartas voltadas para o lado Claro. Distribua 7 cartas para cada jogador.\n\nObjetivo: ser o primeiro a se livrar de todas as cartas da mão, gerenciando a transição caótica entre os lados Claro e Escuro.\n\nComo jogar — LADO CLARO: regras normais do Uno. Combine cor ou número da carta no topo. Cartas especiais normais (+2, Pula, Inverter, Coringa). Quando a carta FLIP for jogada, todos VIRAM imediatamente suas cartas para o lado ESCURO. — LADO ESCURO: cartas muito mais brutais! +5 (próximo compra 5 cartas), Pula Todos (todos os outros perdem um turno, não apenas o próximo), Troca de Mão com Todos (redistribuição circular das mãos!), +Color (próximo compra até encontrar a cor indicada no baralho). Outro FLIP vira de volta para o Claro. A alternância cria caos estratégico.\n\nFim e vitória: o primeiro a jogar a última carta grita UNO! depois FLIP OUT! e vence a rodada! Em múltiplas rodadas, pontue as cartas restantes dos adversários — menor pontuação acumulada vence."},
  {id:"990.162",nome:"Can Can",editora:"Grow",cat:"Matemática",idade:"7+",jog:"2-4",anos:"Y1-Y3",comp:"Cartas com operacoes matemáticas e números, instrucoes.",obs:"",regras:"Preparação: separe as cartas por nível de tabuada (1 ao 10). Para iniciantes, use apenas as tabuadas do 1, 2 e 5. Para intermediários, inclua 3, 4 e 6. Para avançados, o baralho completo. Embaralhe o nível escolhido e coloque no centro.\n\nObjetivo: ser o mais rápido a calcular e responder as operações de multiplicação para acumular o maior número de cartas ao longo das rodadas.\n\nComo jogar — MODO COMPETITIVO: vire 2 cartas do baralho central — uma com o multiplicando e outra com o multiplicador (ou um número e uma operação). Todos calculam o resultado simultaneamente. O primeiro a gritar o resultado correto ganha as 2 cartas como ponto. Resultado errado: o jogador que errou devolve 1 carta já acumulada. — MODO COOPERATIVO: um jogador vira as cartas, os demais têm 5 segundos para responder juntos, debatendo o cálculo. Se acertarem, o grupo avança 1 casa num tabuleiro compartilhado. MODO FLASH: 1 carta é virada por vez e quem responder mais rápido de qualquer combinação vence aquela rodada.\n\nFim e vitória: após todas as cartas, some os pontos. Quem acumulou mais cartas vence o torneio matemático!"},
  {id:"990.163",nome:"Can Can Matemático",editora:"Grow",cat:"Matemática",idade:"8+",jog:"2-4",anos:"Todos",comp:"Cartas com operacoes de todas as 4 operacoes basicas.",obs:"",regras:"Preparação: separe as cartas de OPERAÇÕES (com adição, subtração, multiplicação e divisão) das cartas de RESPOSTA (com números resultantes). Embaralhe cada pilha separadamente. Ajuste o nível usando subconjuntos: Y1-Y2 usam apenas + e -; Y3-Y4 adicionam × e ÷ simples; Y4-Y5 usam o baralho completo com todas as operações.\n\nObjetivo: ser o mais rápido a resolver operações matemáticas mentalmente para acumular o maior número de cartas ou avançar mais no tabuleiro.\n\nComo jogar — MODO DISPUTA: vire 1 carta de operação. Todos calculam o resultado mentalmente. O primeiro a gritar o resultado correto ganha a carta. Errar desconta 1 carta já acumulada. — MODO COOPERATIVO: vire a carta de operação e ligue o timer de 10 segundos. Todos trabalham juntos em voz alta para chegar ao resultado antes do tempo. Acertaram: avançam no tabuleiro. Erraram: ficam parados. — MODO MEMÓRIA MATEMÁTICA: distribua cartas de operação e resposta aleatoriamente viradas; encontre pares (operação + resultado correto) como jogo da memória clássico.\n\nFim e vitória: quem acumular mais cartas no modo disputa, ou quem completar o percurso no modo cooperativo, vence o campeonato matemático do Can Can!"},
  {id:"990.164",nome:"Coup",editora:"Indie Boards & Cards",cat:"Estratégia",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"15 cartas de personagens (3 de cada: Duque, Assassino, Capitao, Embaixador, Condessa), moedas.",obs:"",regras:"Preparação: embaralhe as 15 cartas de personagens (3 de cada: Duque, Assassino, Capitão, Embaixador, Condessa) e distribua 2 cartas viradas para cada jogador — estas são sua influência secreta. Distribua 2 moedas para cada. As 2 cartas do jogador nunca são mostradas, exceto quando uma é eliminada.\n\nObjetivo: ser o último jogador com pelo menos 1 influência (carta) restante — eliminando todos os outros pelo blefe, negação e golpe de estado.\n\nComo jogar: na sua vez, execute UMA ação. AÇÕES GERAIS (não podem ser bloqueadas ou contestadas): Renda (ganhe 1 moeda), Ajuda Externa (ganhe 2 moedas — mas pode ser bloqueada pelo Duque), Golpe de Estado (gaste 7 moedas para eliminar 1 influência de qualquer adversário — garantido). AÇÕES DE PERSONAGEM (podem ser contestadas): Duque cobra impostos (+3 moedas), Assassino elimina influência adversária (custa 3 moedas), Capitão rouba 2 moedas de adversário, Embaixador troca suas cartas, Condessa bloqueia assassinato. O truque: você pode MENTIR sobre que personagem tem! Se contestado e mentiu: perde 1 influência. Se contestado e era verdade: o contestador perde 1 influência. Com 10+ moedas, deve fazer o Golpe de Estado imediatamente.\n\nFim e vitória: quando perder as 2 influências, você é eliminado. O último sobrevivente governa o palácio!"},
  {id:"990.165",nome:"Perfil Express: Harry Potter",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"100 cartas com personagens, feiticos, criaturas e locais de Harry Potter, 1 marcador de pontos.",obs:"",regras:"Preparação: embaralhe as 100 cartas do universo de Harry Potter cobrindo personagens (Dumbledore, Snape, Draco, Luna, Neville...), feitiços (Expelliarmus, Lumos, Avada Kedavra...), criaturas mágicas (Hipogrifo, Basilisco, Patrono...) e locais (Hogwarts, Hogsmeade, Ministério da Magia...). Defina individual ou equipes.\n\nObjetivo: adivinhar o elemento do mundo bruxo com o menor número de dicas possível para acumular mais pontos de Prestígio que os adversários.\n\nComo jogar: um jogador (ou mediador) pega a carta e lê as dicas numeradas — dica 1 é o detalhe mais obscuro e difícil; dica 10 é quase uma revelação direta. Após cada dica, qualquer jogador pode tentar responder. PONTUAÇÃO: acertar na dica 1 = 10 pts de Prestígio; dica 2 = 9 pts; ... dica 10 = 1 pt. Primeira resposta errada em uma rodada não desconta, mas as seguintes sim. Para Potterheads de diferentes níveis, os fãs mais experientes naturalmente acertarão nas primeiras dicas; iniciantes aprenderão curiosidades novas a cada rodada.\n\nFim e vitória: após um número igual de cartas para todos, some os pontos de Prestígio acumulados. Quem tiver mais Prestígio é o maior Potterhead da sala!"},
  {id:"990.166",nome:"Perfil Express: Filmes e Séries",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"100 cartas de filmes e series populares com dicas progressivas.",obs:"",regras:"Preparação: embaralhe as 100 cartas de filmes e séries populares de diferentes décadas e gêneros (ação, comédia, drama, animação, terror, suspense). Defina individual ou equipes. Escolha 1 leitor para começar (pode rotacionar).\n\nObjetivo: adivinhar o título do filme ou série com o menor número de dicas progressivas possível para acumular mais pontos que os adversários.\n\nComo jogar: o leitor pega a carta e lê as dicas numeradas do mais difícil ao mais fácil. Dica 1: um detalhe técnico ou de cena muito obscuro (ex.: 'Neste filme, o personagem principal usa um anel específico na cena do jantar'). Dica 10: quase revela o título diretamente (ex.: 'Esta série tem 8 temporadas e se passa em uma cidade fictícia'). Após cada dica, os jogadores podem tentar responder. PONTUAÇÃO: dica 1 = 10 pts; ... dica 10 = 1 pt. Primeira resposta errada não desconta; as seguintes sim. O conhecimento de filmes clássicos e séries populares é testado profundamente.\n\nFim e vitória: após equal número de cartas por jogador/equipe, some os pontos. O cinéfilo com mais pontos, aquele que adivinhou mais cedo mais vezes, vence o torneio do entretenimento!"},
  {id:"990.167",nome:"Perfil Express: Personalidades",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"100 cartas de personalidades históricas e contemporâneas.",obs:"",regras:"Preparação: embaralhe as 100 cartas de personalidades históricas e contemporâneas: cientistas (Einstein, Marie Curie, Darwin), esportistas (Pelé, Serena Williams), artistas (Frida Kahlo, Picasso), líderes (Mandela, Gandhi) e contemporâneos (Elon Musk, Malala). Defina individual ou equipes.\n\nObjetivo: identificar personalidades famosas com o menor número de dicas possível para acumular mais pontos e provar o seu conhecimento cultural.\n\nComo jogar: o leitor pega a carta e lê as dicas numeradas do mais obscuro ao mais revelador. Dica 1: um detalhe pouco conhecido da vida da personalidade. Dica 10: quase diz o nome ou menciona a obra mais famosa. Após cada dica, jogadores podem tentar responder. PONTUAÇÃO: dica 1 = 10 pts; ... dica 10 = 1 pt. Primeira resposta errada em uma rodada não desconta; as seguintes sim. CONEXÃO ESCOLAR: as cartas cobrem conteúdos de história, ciências, artes e educação física — excelente para revisar personalidades estudadas em sala.\n\nFim e vitória: após equal número de cartas, some os pontos acumulados. Quem tem mais conhecimento histórico e cultural (e adivinhou mais cedo mais vezes) vence o torneio das personalidades!"},
  {id:"990.168",nome:"Perfil Express: Música",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"100 cartas de artistas, bandas, musicas e estilos musicais.",obs:"",regras:"Preparação: embaralhe as 100 cartas cobrindo artistas (Cazuza, Michael Jackson, Beethoven, Beyoncé), bandas (Beatles, Metallica, Paralamas), álbuns históricos, músicas icônicas e gêneros musicais (jazz, samba, rock, MPB, forró, sertanejo). Defina individual ou equipes.\n\nObjetivo: adivinhar o artista, banda, música ou conceito musical com o menor número de dicas progressivas possível para acumular a maior pontuação.\n\nComo jogar: o leitor pega a carta e lê as dicas numeradas progressivamente. Dica 1: um detalhe técnico ou histórico muito específico (ex.: 'Este artista ganhou 3 Grammys em 1992 e tocou guitarra sinistrada ao contrário'). Dica 10: quase revela diretamente (ex.: 'Cantor americano conhecido pelo thriller e Moonwalk'). Após cada dica, os jogadores podem tentar responder. PONTUAÇÃO: dica 1 = 10 pts; ... dica 10 = 1 pt. Primeira resposta errada não desconta; seguintes sim. Para grupos com gostos musicais variados, as diferentes décadas e gêneros equilibram o jogo.\n\nFim e vitória: após equal número de cartas, some os pontos. O ouvido mais atento e mente mais musical, que adivinhou mais vezes com menos dicas, vence o torneio musical!"},
  {id:"990.169",nome:"Master Express: Entretenimento",editora:"Grow",cat:"Conhecimento",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas de entretenimento com perguntas de múltipla escolha, tabuleiro de pontuacao.",obs:"",regras:"Preparação: posicione o tabuleiro de corrida no centro com os peões na largada. Embaralhe as cartas de entretenimento em pilha. Defina a ordem dos turnos. Cada carta tem 1 pergunta de múltipla escolha (3-4 opções) sobre filmes, séries, música, jogos e cultura pop.\n\nObjetivo: avançar pelo percurso respondendo perguntas de cultura pop e entretenimento, chegando primeiro ao final para responder a pergunta decisiva.\n\nComo jogar: na sua vez, vire uma carta e leia a pergunta em voz alta para todos. Você tem 15 segundos para escolher uma das opções de resposta. Acertou: avance o número de casas indicado no dado (ou na carta). Errou: fique no lugar e passe a vez. CASAS ESPECIAIS: DESTAQUE (avance 3 casas extras se responder uma pergunta bônus difícil), SPOILER (retroceda 2 casas — você spoilou um filme), MARATONA (role novamente e avance o total). Ao chegar perto do final, responda uma pergunta de alto nível de dificuldade para cruzar a linha.\n\nFim e vitória: o primeiro a cruzar o final do percurso e responder corretamente a pergunta grand finale vence o Grand Prix do Entretenimento! Se errar a pergunta final, volta 5 casas e aguarda nova chance."},
  {id:"990.170",nome:"Master Júnior Express: Mundo Animal",editora:"Grow",cat:"Conhecimento",idade:"6+",jog:"2-6",anos:"Y1-Y3",comp:"Cartas de animais com perguntas e curiosidades, tabuleiro de pontuacao.",obs:"",regras:"Preparação: posicione o tabuleiro de percurso animal no centro com os peões na largada. Embaralhe as cartas de animais em pilha. Defina a ordem dos turnos — crianças podem jogar individualmente ou em duplas.\n\nObjetivo: percorrer o tabuleiro respondendo perguntas sobre animais de todo o mundo, chegando primeiro ao final da jornada selvagem.\n\nComo jogar: na sua vez, vire uma carta de animal e leia a pergunta de múltipla escolha (sempre 3 opções) sobre o animal retratado. Exemplos: 'O golfinho é um mamífero ou peixe?', 'O leão é carnívoro, herbívoro ou onívoro?', 'Onde vivem os ursos polares?'. Acertou: avance 2 casas. Errou: avance 1 casa mesmo assim (o aprendizado continua!) e ouça o fato curioso sobre o animal. CASAS BÔNUS: ao parar em casas com pata impressa, faça o som do animal da sua última carta — acertando, avance 1 casa extra! Crianças de Y1-Y3 adoram as ilustrações dos animais em cada carta.\n\nFim e vitória: o primeiro a chegar ao final do percurso vence a grande jornada pelo mundo animal! Para equilibrar com idades diferentes, Y1-Y2 avançam 3 casas por acerto."},
  {id:"990.171",nome:"The Mind",editora:"Nurnberger Spielkarten Verlag",cat:"Cooperativo",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"100 cartas numeradas, 12 cartas de nivel, 5 vidas, 3 estrelas (habilidades).",obs:"",regras:"Preparação: coloque as 12 cartas de nível numeradas, as 5 fichas de VIDA (forma de estrela com coração) e as 3 fichas de ESTRELA (habilidade especial) ao centro. No nível 1, distribua 1 carta numerada (1-100) para cada jogador. No nível 2, 2 cartas cada. E assim por diante — o número de cartas aumenta a cada nível.\n\nObjetivo: cooperar para jogar TODAS as cartas em ordem crescente sem comunicação verbal, sincronizando intuitivamente com o grupo.\n\nComo jogar: REGRA ABSOLUTA — é proibido falar, dar sinais, mostrar cartas ou gesticular. Apenas observar os rostos e linguagem corporal dos parceiros. Quando alguém sentir que é o momento certo para jogar sua menor carta, joga-a na pilha central. Se a carta jogada não for a menor de todas as mãos (ou seja, outro jogador tinha um número menor): todos perdem 1 VIDA e revelam as cartas menores. FICHAS DE ESTRELA: qualquer jogador pode propor usar uma estrela (levanta o punho fechado) — se todos concordarem, cada um descarta sua carta mais baixa de fora da partida. Passam de nível ao jogar todas as cartas da rodada na ordem correta.\n\nFim e vitória: completar todos os níveis sem perder as últimas vidas é a vitória cooperativa! Perder as 5 vidas antes de completar todos os níveis = derrota do grupo."},
  {id:"990.172",nome:"Hanabi",editora:"R&R Games",cat:"Cooperativo",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"60 cartas (5 cores, numeros 1-5 com multiplas copias), 8 tokens de informacao, 3 tokens de erro.",obs:"",regras:"Preparação: embaralhe as 60 cartas (5 cores — vermelho, amarelo, verde, azul, branco — números 1 a 5 em múltiplas cópias) e distribua 4-5 para cada jogador. CRUCIAL: cada jogador segura suas cartas VIRADAS PARA FORA — todos veem as suas cartas EXCETO você mesmo! Coloque os 8 tokens azuis de informação e 3 tokens vermelhos de erro ao centro.\n\nObjetivo: construir em conjunto as 5 sequências coloridas (uma por cor) de 1 a 5 na mesa, sem deixar explodir fogos de artifício fora de ordem.\n\nComo jogar: na sua vez, execute UMA ação: (A) DAR DICA: use 1 token azul para dar informação a outro jogador — diga a COR ou o NÚMERO de uma ou mais cartas daquele jogador (não as duas coisas ao mesmo tempo; não pode mentir). Aponte TODAS as cartas que se encaixam na dica. (B) JOGAR UMA CARTA: jogue 1 carta da própria mão na sequência correspondente da mesa (deve ser o número seguinte de uma cor). Erro de sequência = 1 token vermelho + descarte. (C) DESCARTAR: descarte 1 carta e recupere 1 token azul. Compre carta após jogar ou descartar. 3 erros (tokens vermelhos todos usados) = derrota imediata!\n\nFim e vitória: construir os 5 conjuntos completos (1-2-3-4-5 em cada cor) = pontuação máxima 25 = vitória perfeita! Jogue o baralho todo sem completar todos = pontuação parcial (objetivo é maximizar pontos)."},
  {id:"990.173",nome:"Fake Artist",editora:"Oink Games",cat:"Comunicação",idade:"8+",jog:"5-10",anos:"Y4-Y5",comp:"Baralho de cartas com categorias e palavras, 1 carta especial X, canetas e papel para rascunho.",obs:"",regras:"Preparação: o Game Master (que não joga ou participa rotativamente) escolhe uma categoria (ex.: animais, objetos de cozinha) e escreve a mesma palavra nas cartas de TODOS os jogadores — exceto num, que recebe a carta especial X (o Impostor). Ninguém mostra sua carta.\n\nObjetivo: os Artistas querem identificar e votar para eliminar o Impostor; o Impostor quer passar despercebido ou, se descoberto, adivinhar a palavra secreta para virar o jogo.\n\nComo jogar: o papel de desenho coletivo é colocado ao centro. Em ordem, cada jogador contribui com EXATAMENTE UM TRAÇO contínuo sem levantar a caneta do papel — tentando representar a palavra sem torná-la óbvia demais (para não ajudar o Impostor). O Impostor desenha sem saber a palavra, tentando imitar o estilo dos outros. Após 2 voltas completas (cada jogador traça 2 vezes), todos observam o desenho coletivo e VOTAM simultaneamente em quem acreditam ser o Impostor. RESULTADO: maioria de votos = esse jogador é revelado. Se for Impostor: ele tenta uma última chance de adivinhar a palavra — se acertar, VENCE mesmo assim!\n\nFim e vitória: Artistas vencem se o Impostor for identificado E não adivinhar a palavra. Impostor vence se não for identificado ou se adivinhar a palavra após ser revelado!"},
  {id:"990.174",nome:"Scout",editora:"Oink Games",cat:"Cartas",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"45 cartas numeradas dupla-face (orientacao importa), fichas de scout.",obs:"",regras:"Preparação: distribua as 45 cartas de Scout igualmente entre os jogadores — cada carta é dupla-face e pode ser orientada de 2 formas (cada orientação mostra um número diferente nas extremidades). Sem olhar, organize suas cartas em mão SEM mudar a orientação de nenhuma delas. A pista central começa vazia.\n\nObjetivo: pontuar recrutando artistas (fichas) da pista e minimizar as cartas que ficam na mão dos adversários ao final.\n\nComo jogar: na sua vez, escolha 1 de 2 ações. MOSTRAR: jogue 1 ou mais cartas da sua mão formando uma combinação MELHOR que a atual na pista — mesmo número em todas (ex.: três 7s) OU sequência crescente (ex.: 5-6-7). Uma combinação é melhor se tiver mais cartas, ou se tiver o mesmo número de cartas mas com valores maiores. Ao mostrar, pague a cada adversário que tinha carta na pista 1 ficha Scout (token), e recolha as cartas descartadas pelos adversários. RECRUTAR: pegue 1 carta da pista central para sua mão e pague 1 ficha Scout. Importante: pode inserir a carta em qualquer posição da mão, mas não pode girar as cartas.\n\nFim e vitória: quando alguém ficar sem cartas, o round termina. Pontue: 1 ponto por ficha Scout + 1 ponto por carta restante na mão dos adversários. Melhor pontuação após múltiplos rounds vence!"},
  {id:"990.175",nome:"Embates da Física",editora:"—",cat:"Conhecimento",idade:"10+",jog:"2-4",anos:"Y4-Y5",comp:"Cartas de conceitos e fenomenos fisicos, tokens de combate, manual.",obs:"",regras:"Preparação: distribua as cartas de fenômenos físicos igualmente entre os jogadores. Cartas cobrem conceitos como Força, Velocidade, Eletricidade, Gravitação, Energia Cinética, Pressão, Ondas Sonoras, Temperatura, Magnetismo e outros. Coloque os tokens de combate ao centro. Designe um mediador (pode ser o professor ou um jogador rotacionando).\n\nObjetivo: vencer duelos de conceitos físicos usando o raciocínio científico para argumentar por que seu fenômeno é mais poderoso ou relevante no contexto dado.\n\nComo jogar: dois jogadores selecionam 1 carta cada e revelam simultaneamente. O mediador lê o CONTEXTO DA RODADA (ex.: 'Qual fenômeno seria mais relevante para mover um carro?'). Cada jogador tem 60 segundos para argumentar por que seu fenômeno vence naquele contexto usando conceitos físicos reais. O mediador (ou grupo) decide o vencedor com base na qualidade do argumento e precisão científica — o manual traz os conceitos corretos para referência. Vencedor ganha 1 token de combate.\n\nFim e vitória: após todas as rodadas de duelo, quem tiver mais tokens de combate vence! Excelente ferramenta para revisar e discutir conceitos de física de forma engajante e memorável."},
  {id:"990.176",nome:"Passei de Ano",editora:"—",cat:"Conhecimento",idade:"8+",jog:"2-6",anos:"Todos",comp:"Tabuleiro com series escolares, cartas de perguntas por disciplina, peons.",obs:"",regras:"Preparação: posicione o tabuleiro com as séries escolares numeradas da 1ª ao Ensino Médio. Cada jogador começa no 1º ano do Ensino Fundamental. Separe as cartas de perguntas por série e disciplina: Português, Matemática, Ciências, História e Geografia. Distribua fichas de aprovação ao lado.\n\nObjetivo: progredir do 1º ano do Ensino Fundamental ao Ensino Médio respondendo perguntas de cada disciplina para acumular os pontos necessários para ser 'aprovado' em cada série.\n\nComo jogar: na sua vez, role o dado que indica a disciplina e pesque a carta correspondente ao seu nível atual. Outro jogador lê a pergunta. Acertou: ganhe 1 ponto de aprovação. Acumulou os pontos necessários para aprovação (ex.: 5 pontos) na série atual: avance para a próxima! Errou: ouça a resposta correta e permaneça na série atual. MATÉRIAS ESPECIAIS: cartas de Redação (crie uma frase criativa sobre o tema dado), Operação Matemática (calcule mentalmente) e Curiosidade Cultural (resposta de múltipla escolha).\n\nFim e vitória: o primeiro a concluir o Ensino Médio com pontuação mínima vence e é aprovado com louvor! Ótimo para revisão curricular interdisciplinar de forma gamificada."},
  {id:"990.177",nome:"Tá na Memória: Biomas",editora:"—",cat:"Memória",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"Pares de cartas sobre biomas brasileiros com ilustracoes e nomes.",obs:"",regras:"Preparação: distribua todas as cartas de biomas brasileiros viradas para baixo em grade no centro. Os pares podem ser: animal + seu bioma, planta característica + bioma, ou característica do bioma (ex.: 'maior floresta tropical do mundo') + nome (ex.: 'Amazônia'). Defina a ordem de turnos.\n\nObjetivo: encontrar o maior número de pares de cartas relacionadas aos 6 biomas brasileiros treinando memória e aprendendo sobre a biodiversidade nacional.\n\nComo jogar: na sua vez, vire 2 cartas. Se formarem um par válido relacionado aos biomas (ex.: onça-pintada + Amazônia, ou tatu-bola + Cerrado), mantenha o par e jogue novamente! Se não formarem par, vire de volta e passe a vez. Lembre onde estão as cartas para usar nas próximas jogadas. Cartas com curiosidades imprevistas ensinam mesmo nas tentativas erradas: 'Sabia que 70% das espécies de plantas medicinais do Brasil vivem no Cerrado?'\n\nFim e vitória: quando todos os pares forem encontrados, some as cartas de cada jogador. Quem encontrou mais pares vence e é coroado o maior especialista em biomas brasileiros! Excelente atividade complementar para aulas de ciências e geografia do Brasil."},
  {id:"990.178",nome:"Tá na História: Cientistas",editora:"—",cat:"Conhecimento",idade:"8+",jog:"2-4",anos:"Todos",comp:"40 cartas de cientistas, 3 cartas de tarefas, 1 manual.",obs:"",regras:"Preparação: separe as 40 cartas de cientistas das cartas de descobertas e invenções correspondentes. Embaralhe cada grupo em pilhas separadas. Coloque as 3 cartas de tarefa ao lado (usadas para desafios extras). Distribua igualmente as cartas de cientistas entre os jogadores.\n\nObjetivo: conectar corretamente cada cientista à sua descoberta ou invenção mais importante, desenvolvendo conhecimento sobre a história da ciência.\n\nComo jogar — MODO CONEXÃO: espalhe as cartas de descobertas viradas para cima no centro. Cada jogador olha suas cartas de cientistas e tenta colocar ao lado da descoberta correta. Ao final, confira com o gabarito do manual. Cada par correto = 1 ponto. CARTAS DE TAREFA: cartas especiais criam desafios extras: ordenar 5 descobertas cronologicamente, identificar a nationalidade do cientista, ou agrupar por área (física, química, biologia, matemática). MODO MEMÓRIA: espalhe ambos os grupos virados para baixo e encontre os pares virando 2 cartas por vez.\n\nFim e aprendizado: após o jogo, percorra cada par e leia a história de cada cientista no manual — destaque especialmente os cientistas de origens diversas e as mulheres cientistas representadas. A ciência sempre foi construída por vozes de todo o mundo!"},
  {id:"990.179",nome:"Stop",editora:"—",cat:"Palavras",idade:"8+",jog:"2+",anos:"Todos",comp:"Papel e canetas (jogo livre).",obs:"",regras:"Preparação: defina com o grupo as categorias que serão usadas (geralmente 5-8): Nome, Animal, Cidade, Comida, Fruta, País, Profissão, Objeto, Cor, Time de futebol — pode personalizar! Cada jogador tem papel e caneta. Sorteie a primeira letra (pode usar dados de letras ou escolha aleatória).\n\nObjetivo: ser o mais rápido a preencher TODAS as categorias com palavras começando pela letra sorteada para acumular mais pontos ao longo de 10 rodadas.\n\nComo jogar: quando a letra for anunciada (ex.: 'M'), todos começam simultaneamente a preencher cada categoria com uma palavra válida começando com M (ex.: Nome: Marcelo, Animal: Macaco, Cidade: Manaus, Comida: Macarrão...). O PRIMEIRO a preencher todas as categorias grita STOP! e todos param imediatamente. PONTUAÇÃO: palavra válida que ninguém mais escreveu = 10 pts; palavra que pelo menos outro escreveu = 5 pts; célula vazia = 0 pts; palavra inválida = 0 pts. Debate rápido valida ou descarta palavras contestadas.\n\nFim e vitória: após 10 rodadas com letras diferentes, some os pontos de todas as rodadas. O vocabularista mais rápido, variado e criativo com mais pontos vence o torneio do Stop!"},
  {id:"990.180",nome:"Memória Casa Batlló",editora:"—",cat:"Memória",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Pares de cartas com elementos arquitetonicos e artisticos da Casa Batllo de Antoni Gaudi.",obs:"",regras:"Preparação: embaralhe todas as cartas de elementos da Casa Batlló e distribua viradas para baixo em grade no centro da mesa. Cartas representam janelas orgânicas, detalhes de azulejo colorido, a fachada escalonada, elementos de dragão na cobertura, colunas em formato de osso e outros elementos arquitetônicos únicos da obra de Antoni Gaudí.\n\nObjetivo: encontrar o maior número de pares de cartas com elementos idênticos da Casa Batlló treinando memória enquanto se aprecia arte e arquitetura modernista.\n\nComo jogar: na sua vez, vire 2 cartas quaisquer da grade. Se mostrarem o mesmo elemento arquitetônico (par!), guarde-as como ponto e jogue novamente — encadeie quantos pares conseguir! Se forem elementos diferentes, vire de volta na posição original e passe a vez. Memorize onde cada elemento está para usar nas próximas jogadas. As ilustrações detalhadas tornam cada carta uma peça artística: azulejos iridescentes, janelas em forma de caveiras marinhas, o telhado em escamas de dragão.\n\nFim e vitória: quando todos os pares forem encontrados, some as cartas. Quem encontrou mais pares vence! Após o jogo, mostre fotos reais da Casa Batlló em Barcelona para conectar o jogo com a obra real de Gaudí."},
  {id:"990.181",nome:"Ladders",editora:"—",cat:"Clássico",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Tabuleiro com escadas e obstaculos, dados, peons.",obs:"",regras:"Preparação: posicione o tabuleiro numerado de 1 a 100 no centro. Cada jogador coloca seu peão na posição de largada (fora do tabuleiro ou na casa 1, conforme a variante). Decida a ordem dos turnos com o dado.\n\nObjetivo: ser o primeiro a alcançar exatamente a casa 100, usando a sorte das escadas para avançar rapidamente e evitando cair nos obstáculos que puxam para trás.\n\nComo jogar: na sua vez, role o dado de 6 faces e avance o número correspondente de casas. AO PARAR NA BASE DE UMA ESCADA: comemore! Sobe imediatamente pelo comprimento da escada até o topo — podendo avançar 15, 20 ou até 30 casas de uma vez! AO PARAR NO TOPO DE UM OBSTÁCULO (buraco, escorregador, fissura): oi! Desce automaticamente pelo obstáculo até a base — podendo cair 10, 20 ou 30 casas. Pura sorte! REGRA DA CHEGADA: para chegar na casa 100, você precisa tirar EXATAMENTE o número que falta. Se tirar mais do que precisa, fique no lugar e espere a próxima vez.\n\nFim e vitória: o primeiro a chegar exatamente na casa 100 vence a corrida das escadas! Uma virada inesperada pode acontecer até o último momento."},
  {id:"990.182",nome:"Ladders",editora:"—",cat:"Clássico",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Tabuleiro com escadas e obstaculos, dados, peons.",obs:"2ª cópia",regras:"Mesmas regras do Ladders (990.181). 2a copia disponivel."},
  {id:"990.183",nome:"Cobras e Escadas",editora:"—",cat:"Clássico",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Tabuleiro 10x10 com cobras e escadas, dados, peons.",obs:"",regras:"O classico de todos os tempos! Role o dado e avance pelo tabuleiro de 1 a 100. Parou na base de uma escada? Sobe rapido ate o topo! Parou na cabeca de uma cobra? Desce ate a cauda! Primeira a chegar ao quadrado 100 vence. Para chegar ao final, precisa tirar o numero exato. Pura sorte, muita tensao e risadas garantidas para todas as idades!"},
  {id:"990.184",nome:"Dog Pile",editora:"—",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Cadeira de pelúcia, cachorrinhos de plastico, dados.",obs:"",regras:"Preparação: posicione a cadeira de pelúcia no centro da mesa ao alcance de todos. Separe os cachorrinhos de plástico por cor ou número, conforme indicado no dado. O primeiro jogador está pronto para começar.\n\nObjetivo: ser o jogador que empilha mais cachorrinhos com sucesso na cadeira ao longo de todas as rodadas, sem causar o desmoronamento da pilha.\n\nComo jogar: na sua vez, role o dado especial que indica quantos e quais cachorrinhos você deve adicionar à pilha (ex.: '2 cachorrinhos marrons' ou '1 cachorrinho sentado'). Com CUIDADO e PRECISÃO, posicione os cachorrinhos na cadeira de forma que a pilha não desmorone. Cada cachorrinho adicionado com sucesso vale 1 ponto para você. SE A PILHA CAIR: o jogador que causou o queda perde todos os pontos acumulados naquela rodada (não os das rodadas anteriores). Monte a pilha novamente do zero para a próxima rodada. Formas variadas de cachorrinhos (sentados, em pé, deitados) criam diferentes desafios de equilíbrio.\n\nFim e vitória: após um número definido de rodadas, some os cachorrinhos corretamente empilhados por cada jogador. Quem acumulou mais cachorrinhos vence o troféu de melhor arquiteto canino!"},
  {id:"990.185",nome:"Amigos da Ludus Baralho",editora:"Ludus Spirit",cat:"Cartas",idade:"6+",jog:"2+",anos:"Todos",comp:"Baralho padrao com personagens e arte da Ludus Spirit.",obs:"",regras:"Preparação: o baralho versatil da Ludus Spirit pode ser usado em dezenas de jogos diferentes. Identifique o jogo que o grupo quer jogar e siga as regras específicas de cada um.\n\nJogos disponíveis com este baralho: GUERRA — distribua igualmente; jogadores viram 1 carta por turno; o maior valor vence as cartas; empate = guerra (mais 3 cartas viradas e 1 revelada). MICO — retire 1 carta secreta antes de distribuir; faça todos os pares e descarte; ofereça a mão ao vizinho; quem ficar com o Mico (carta sem par) perde. MEMÓRIA — espalhe viradas; vire 2 por turno; pares ficam; mais pares vence. PESCA — distribua 5 cartas; pergunte a um adversário por um valor que você já tem; acertou: ganhe; errou: compre do monte (Go Fish!). PACIÊNCIA — modo individual; organize 4 colunas de Ás a Rei em naipes no campo.\n\nFim e vitória: varia conforme o jogo escolhido. As ilustrações diversas da Ludus Spirit tornam qualquer versão mais envolvente para crianças!"},
