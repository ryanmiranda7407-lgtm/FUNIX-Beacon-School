<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>FUNIX – Acervo de Jogos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f0f0;color:#1a1a1a;min-height:100vh}
header{background:#1a1a1a;color:white;padding:22px 32px}
.hdr{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.hdr-left{display:flex;flex-direction:column;gap:1px}
.hdr-school{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:#e58635;margin-bottom:2px}
header h1{font-size:2.5rem;font-weight:900;letter-spacing:-2px;line-height:1}
header p{opacity:.45;font-size:.82rem;margin-top:4px;font-weight:400;letter-spacing:.02em}
.total-badge{background:#e58635;color:white;border-radius:999px;padding:8px 20px;font-size:.85rem;font-weight:700;white-space:nowrap}
.jds{background:#e58635;color:white;padding:12px 32px}
.jds-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.jds-pill{background:rgba(0,0,0,.2);padding:3px 12px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.jds-nome{font-size:1.05rem;font-weight:700}
.jds-cat{opacity:.85;font-size:.88rem}
.controls{max-width:1440px;margin:24px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:240px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none}
input[type=text]{width:100%;padding:12px 14px 12px 42px;border:2px solid #e0e0e0;border-radius:14px;font-size:.93rem;background:white;transition:border-color .2s}
input[type=text]:focus{outline:none;border-color:#e58635}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-row label{font-size:.7rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.chip{padding:6px 14px;border:2px solid #e0e0e0;border-radius:999px;background:white;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s;white-space:nowrap;color:#666}
.chip:hover{border-color:#e58635;color:#e58635}
.chip.on{background:#e58635;border-color:#e58635;color:white}
.chip.obs-chip.on{background:#d97706;border-color:#d97706;color:white}
.stats{color:#aaa;font-size:.83rem;margin-left:auto;white-space:nowrap}
.grid{max-width:1440px;margin:20px auto 52px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:white;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s,outline-color .15s;position:relative;display:flex;flex-direction:column;overflow:hidden;outline:2px solid transparent}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.15);outline-color:#e58635}
.card-img{aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;font-size:3.2rem;flex-shrink:0;position:relative}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px}
.card-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.card-id{display:none}
.card-name{font-size:.8rem;font-weight:700;color:#111;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-pub{display:none}
.card-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.tag{padding:2px 7px;border-radius:999px;font-size:.62rem;font-weight:700}
.tc{background:#fff3e0;color:#c44d07}
.ta4{background:#d1fae5;color:#065f46}
.ta6{background:#dbeafe;color:#1e40af}
.ta8{background:#fef9c3;color:#713f12}
.ta10{background:#ffedd5;color:#7c2d12}
.ta12{background:#fee2e2;color:#7f1d1d}
.tp{background:#f3e8ff;color:#6b21a8}
.ty1{background:#dcfce7;color:#15803d}
.ty4{background:#ede9fe;color:#5b21b6}
.tyt{background:#e0f2fe;color:#0369a1}
.obs-dot{position:absolute;top:8px;right:8px;background:#fef3c7;color:#92400e;border-radius:999px;padding:2px 8px;font-size:.63rem;font-weight:700;z-index:1}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:#bbb}
.empty h3{font-size:1.2rem;margin-bottom:8px;color:#999}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:white;border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-hero{width:100%;height:195px;background:linear-gradient(135deg,#e58635 0%,#c4702a 100%);border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:center;font-size:5rem;flex-shrink:0;overflow:hidden}
.modal-hero img{width:100%;height:100%;object-fit:contain;display:block;padding:8px}
.modal-body{padding:26px}
.mclose{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);border:none;border-radius:50%;width:34px;height:34px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;z-index:10}
.mclose:hover{background:rgba(0,0,0,.65)}
.mid{font-size:.75rem;font-family:monospace;color:#ccc;margin-bottom:5px}
.mname{font-size:1.7rem;font-weight:900;color:#111;line-height:1.2;margin-bottom:3px;letter-spacing:-.5px}
.mpub{color:#aaa;margin-bottom:14px;font-size:.88rem}
.mtags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.msec{margin-bottom:20px}
.msec h3{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#bbb;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.msec h3::before{content:'';display:inline-block;width:3px;height:12px;background:#e58635;border-radius:2px;flex-shrink:0}
.msec p{color:#444;line-height:1.75;font-size:.91rem}
.mobs{background:#fef3c7;border-radius:10px;padding:12px 14px;color:#92400e;font-size:.88rem;line-height:1.6;margin-bottom:18px}
.mobs strong{font-weight:700}
.mrules{background:#fafafa;border-radius:12px;padding:16px;color:#333;font-size:.9rem;line-height:1.85;white-space:pre-wrap;border-left:4px solid #e58635}
.mrules.empty-rules{color:#bbb;font-style:italic;border-left-color:#e0e0e0}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:640px){header h1{font-size:1.8rem}.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:6px}}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="hdr-left">
      <span class="hdr-school">Beacon School · Vila Leopoldina</span>
      <h1>FUNIX</h1>
      <p>Acervo de jogos do espaço criativo</p>
    </div>
    <span class="total-badge" id="total-badge"></span>
  </div>
</header>
<div class="jds">
  <div class="jds-inner">
    <span class="jds-pill">⭐ Jogo da Semana</span>
    <span class="jds-nome" id="jds-nome">—</span>
    <span class="jds-cat" id="jds-cat"></span>
  </div>
</div>
<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Buscar por nome, editora, categoria…" oninput="render()">
  </div>
  <div class="filter-row">
    <label>Categoria</label>
    <div id="cat-filters"></div>
  </div>
  <div class="filter-row">
    <label>Turma</label>
    <div id="year-filters"></div>
  </div>
  <div class="filter-row">
    <button class="chip obs-chip" id="obs-btn" onclick="toggleObs()">⚠ Peças faltando</button>
  </div>
  <span class="stats" id="stats"></span>
</div>
<div class="grid" id="grid"></div>
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="mclose" onclick="closeModal()">✕</button>
    <div id="mbody"></div>
  </div>
</div>

<script>
// ── Configuração ──────────────────────────────────────────
// Para definir o Jogo da Semana, coloque o ID aqui (ex: "990.005")
const JOGO_DA_SEMANA = null;

// ── Dados ─────────────────────────────────────────────────
const jogos = [
  {id:"990.001",nome:"Duelo",editora:"Universo Uia",cat:"Comunicação",idade:"10+",jog:"2+",anos:"Y4-Y5",comp:"40 cartas de personagens, 25 cartas de ações.",obs:"",regras:"Preparacao: embaralhe as 40 cartas de personagens e as 25 cartas de acoes separadamente. Distribua 3 cartas de personagem e 2 cartas de acao para cada jogador; o restante forma dois baralhos de compra no centro.\n\nObjetivo: acumular o maior numero de pontos ao longo das rodadas, vencendo duelos com argumentos criativos.\n\nComo jogar: a cada rodada, dois jogadores (ou todos, em modo livre) escolhem secretamente uma carta de personagem da mao e a revelam simultaneamente. Cada um apresenta em voz alta um argumento criativo justificando por que seu personagem venceria o duelo - use a imaginacao, o humor e as caracteristicas impressas na carta. Cartas de acao podem ser jogadas antes ou durante o argumento para adicionar uma reviravolta (ex.: mudar o cenario, enfraquecer o oponente, ganhar habilidade extra). O grupo inteiro vota no argumento mais convincente levantando a mao; empates sao resolvidos por nova rodada de argumentos. O vencedor do duelo fica com a carta do adversario como ponto. Ao fim de cada rodada, cada jogador compra cartas ate ter 3 de personagem e 2 de acao na mao.\n\nFim de jogo e vitoria: quando o baralho de personagens se esgotar, termine a rodada atual. Cada carta conquistada vale 1 ponto. Quem acumular mais pontos vence o torneio de duelos!"},
  {id:"990.002",nome:"7 Famílias Diversas Como a Gente",editora:"Universo Uia",cat:"Cartas",idade:"6+",jog:"2-6",anos:"Todos",comp:"Cartas de 7 famílias diversas. 4 modos de jogo possíveis.",obs:"",regras:"Preparacao: embaralhe todas as cartas das 7 familias diversas e distribua igualmente entre os jogadores (2 a 6 pessoas). O jogo oferece 4 modos com o mesmo baralho; escolha um antes de comecar.\n\nObjetivo: dependendo do modo escolhido, o objetivo muda - coletar familias completas, ser o mais rapido a reagir, ou criar suas proprias regras.\n\nComo jogar - Modo Familias: na sua vez, pergunte a outro jogador se ele tem uma carta especifica de uma familia que voce esta coleccionando. Se tiver, ele entrega; se nao, voce passa a vez. Quem completar uma familia inteira de 4 cartas coloca-a na mesa e pontua. Modo Rouba-Monte: vire cartas ao centro; quando completar uma familia, quem bater primeiro leva o monte. Modo Porco Tapao: vire cartas continuamente; quando uma familia estiver completa na mesa, todos devem colocar o dedo no centro - o ultimo fica com uma penalidade. Modo Livre (4o modo): o grupo cria suas proprias regras de como usar as 7 familias diversas.\n\nFim de jogo e vitoria: o jogo termina quando todas as familias forem completadas. Nos modos pontuados, quem tiver mais familias ou menos penalidades vence. No modo livre, o grupo define a condicao de vitoria!"},
  {id:"990.003",nome:"Memorelas",editora:"Cecerelê",cat:"Memória",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"32 peças de madeira com pares de mulheres brasileiras.",obs:"",regras:"Preparação: espalhe as 32 peças de madeira viradas para baixo em uma grade sobre a mesa. Escolha quem começa por sorteio.\n\nObjetivo: encontrar o maior número de pares de mulheres brasileiras históricas ao longo da partida.\n\nComo jogar: na sua vez, vire 2 peças quaisquer. Se as duas mostrarem a mesma mulher (par!), guarde-as à sua frente e jogue novamente — é possível encadear vários pares seguidos. Se forem diferentes, vire-as de volta na mesma posição e passe a vez. Preste atenção nas peças que os adversários viram para memorizar posições e aproveitar na próxima jogada!\n\nFim e vitória: o jogo termina quando todas as peças forem coletadas. Quem tiver mais pares vence. Como bônus, tente lembrar e compartilhar algo sobre cada uma das 16 mulheres representadas!"},
  {id:"990.004",nome:"Timeline: Eventos Históricos",editora:"Galápagos",cat:"Conhecimento",idade:"10+",jog:"2-8",anos:"Y4-Y5",comp:"Cartas dupla-face com eventos históricos. A data está escondida no verso de cada carta.",obs:"",regras:"Preparação: coloque 1 carta com a data visível no centro da mesa para iniciar a linha do tempo. Distribua 4 cartas (datas viradas para baixo) para cada jogador. O restante forma o baralho de compra.\n\nObjetivo: ser o primeiro jogador a colocar todas as suas cartas corretamente na linha do tempo cronológica.\n\nComo jogar: na sua vez, escolha uma das suas cartas e decida onde ela se encaixa na linha já formada — antes, entre ou depois das cartas existentes. Coloque-a nessa posição ainda com a data escondida e então vire: se a data estiver na ordem correta em relação às vizinhas, a carta fica! Se estiver errada, descarte-a e compre uma nova do baralho (sua mão não diminui quando erra). A linha do tempo cresce a cada rodada, tornando o jogo progressivamente mais difícil.\n\nFim e vitória: o primeiro jogador a se livrar de todas as suas cartas (colocando-as corretamente) vence. Atenção: com uma linha longa, há muito mais posições possíveis — e muito mais lugares para errar!"},
  {id:"990.005",nome:"Concept",editora:"Galápagos",cat:"Comunicação",idade:"10+",jog:"4-12",anos:"Y4-Y5",comp:"Tabuleiro com ícones universais, cartas de conceito, fichas de lâmpada simples e dupla, tokens verdes (interrogação e cubos), token exclamação, cubos coloridos, tigela.",obs:"",regras:"Preparação: abra o tabuleiro de ícones no centro. Separe os tokens por tipo: pino de interrogação (conceito principal), pino de exclamação (sub-conceito), cubos coloridos (detalhes), fichas de lâmpada para pontuação. Forme duplas ou jogue em modo livre.\n\nObjetivo: fazer o grupo adivinhar uma palavra, frase ou personagem famoso usando SOMENTE os ícones do tabuleiro — sem falar, escrever, gesticular ou fazer mímica.\n\nComo jogar: a dupla da vez escolhe uma carta e decide quem comunica. O comunicador coloca o pino de interrogação no ícone que representa o conceito principal (ex.: pessoa, animal, objeto, lugar, ação). Em seguida, usa cubos coloridos para adicionar detalhes: cor, tamanho, quantidade, sub-conceitos. Os outros jogadores tentam adivinhar em voz alta a qualquer momento — o comunicador pode acenar (sim/não) e continuar refinando os tokens. Quando alguém acertar, a dupla ganha fichas de lâmpada como ponto.\n\nFim e vitória: jogue quantas rodadas o grupo quiser. A dupla com mais fichas de lâmpada ao final vence o torneio de comunicação por ícones!"},
  {id:"990.006",nome:"O Universo Lexis das Letras",editora:"Ludens Spirit",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Todos",comp:"Cartas de letras, cartas curinga, tabuleiros dupla-face, ampulheta.",obs:"",regras:"Preparação: cada jogador recebe um conjunto de cartas de letras. Vire o tabuleiro para o lado escolhido (iniciante ou avançado). A primeira palavra deve ser colocada na posição central do tabuleiro.\n\nObjetivo: acumular mais pontos que os adversários formando palavras no tabuleiro, encaixando letras como em palavras cruzadas.\n\nComo jogar: na sua vez, vire a ampulheta e forme palavras com suas letras, conectando-as em letras já existentes no tabuleiro (horizontal ou vertical). Cada letra tem valor impresso; palavras mais longas e com letras raras valem mais. Curingas valem qualquer letra mas não somam pontos. Quando a ampulheta esvaziar, passe a vez. Se não conseguir formar nenhuma palavra, troque cartas com o baralho e passe a vez sem pontuar.\n\nFim e vitória: o jogo termina quando o baralho se esgotar e ninguém mais conseguir formar palavras. Some os pontos de todas as letras jogadas por cada jogador — o maior total vence!"},
  {id:"990.007",nome:"Color Addict",editora:"Copag",cat:"Cartas",idade:"7+",jog:"2-8",anos:"Todos",comp:"110 cartas coloridas com palavras de cores.",obs:"",regras:"Preparação: embaralhe as 110 cartas e distribua igualmente entre todos os jogadores. Cada um mantém sua pilha virada para baixo.\n\nObjetivo: ser o primeiro a descartar todas as cartas da sua pilha dizendo a COR DA TINTA de cada carta, não a palavra escrita.\n\nComo jogar: em sentido horário, cada jogador vira a carta do topo da sua pilha para uma pilha central e diz em voz alta a COR DAS LETRAS (não o que a palavra diz). Exemplo: se a carta diz AZUL escrito em vermelho, você deve falar 'vermelho'. Se errar, hesitar demais ou dizer a palavra em vez da cor, você pega toda a pilha central. O truque está no conflito cognitivo: o cérebro quer automaticamente ler a palavra, dificultando identificar a cor. Algumas cartas têm ações especiais: inverter sentido, pular jogador, trocar pilhas.\n\nFim e vitória: o primeiro jogador a descartar sua última carta vence! Para variar, tente cronometrar a turma inteira e ver quem completa mais rápido."},
  {id:"990.008",nome:"Palavras Cruzadas",editora:"Xalingo Brinquedos",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"1 tabuleiro dobrável, 120 pedras de madeira com letras, 4 suportes de madeira, regra básica.",obs:"",regras:"Preparação: coloque as 120 pedras de letras em um saco e misture bem. Cada jogador retira 7 pedras para iniciar — veja suas pedras em segredo. O tabuleiro fica no centro; a primeira palavra DEVE passar pela estrela central.\n\nObjetivo: acumular o maior número de pontos formando palavras que se entrecruzam no tabuleiro, como em um palavras-cruzadas ao vivo.\n\nComo jogar: na sua vez, forme uma palavra no tabuleiro usando ao menos uma letra já existente (horizontal ou verticalmente). Some os pontos de cada letra usada; casas especiais multiplicam letras (×2, ×3) ou palavras inteiras (×2, ×3). Após jogar, compre pedras do saco até ter 7. Se não conseguir jogar, passe a vez. Pode trocar pedras pelo saco perdendo a vez. Apenas palavras válidas em português são aceitas — desafie palavras duvidosas consultando o dicionário.\n\nFim e vitória: o jogo termina quando o saco esvaziar e um jogador usar todas as pedras (bônus: pontos das pedras restantes dos adversários são subtraídos e adicionados ao vencedor). Maior pontuação total vence!"},
  {id:"990.009",nome:"Animais do Mundo",editora:"Grow",cat:"Quebra-Cabeça",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"150 peças.",obs:"",regras:"Preparação: espalhe as 150 peças com a imagem para cima sobre uma superfície ampla. Pode ser montado individualmente ou em grupo.\n\nObjetivo: montar o quebra-cabeça completo revelando a ilustração com animais de diversas partes do mundo.\n\nComo montar: comece separando as peças de borda (cantos com dois lados retos, bordas com um lado reto) e monte o contorno primeiro para definir o limite. Em seguida, separe o interior por cor ou região — animais da savana, floresta, oceano, etc. Trabalhe de áreas mais distintas e coloridas em direção ao centro. Em grupo, divida o tabuleiro em seções e cada pessoa cuida de uma área.\n\nFinalização: o quebra-cabeça está completo quando todas as 150 peças estiverem encaixadas sem espaços. Desafio extra: identifique cada animal, descubra de qual continente ele vem e pesquise uma curiosidade sobre ele!"},
  {id:"990.010",nome:"Dominó",editora:"Livon",cat:"Clássico",idade:"6+",jog:"2-4",anos:"Todos",comp:"28 peças duplas.",obs:"",regras:"Preparação: vire todas as 28 peças duplas para baixo e misture bem (o 'dorme'). Com 2 jogadores, cada um pega 7 peças; com 3-4, cada um pega 5. As peças restantes ficam no estoque (podem ser compradas).\n\nObjetivo: ser o primeiro a jogar todas as peças da mão, ou ter a menor soma de pontos se o jogo travar.\n\nComo jogar: quem tiver o duplo-seis (ou o maior duplo) abre o jogo colocando-o no centro. Em sentido horário, cada jogador encosta uma peça em uma das extremidades abertas, combinando o número. Não pode jogar? Compre uma peça do estoque e tente; se o estoque estiver vazio, passe a vez. Peças duplas são colocadas transversalmente e abrem dois novos lados.\n\nFim e vitória: vence quem jogar todas as peças primeiro (bato!). Se o jogo travar (ninguém consegue jogar e o estoque está vazio), vence quem tiver a menor soma de pontos nas peças ainda na mão. Os pontos das mãos perdedoras somam ao vencedor para a contagem geral de rodadas."},
  {id:"990.011",nome:"Sushi Go!",editora:"Devir Livraria",cat:"Cartas",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"106 cartas (de 108 originais).",obs:"Faltam: 1 nigiri salmão e 1 nigiri ovo",regras:"Preparação: embaralhe as 106 cartas. Distribua mãos conforme o número de jogadores: 7 cartas (2 jog.), 6 cartas (3 jog.), 5 cartas (4-5 jog.). O jogo tem 3 rodadas.\n\nObjetivo: acumular a maior pontuação ao longo das 3 rodadas colecionando combinações de pratos de sushi.\n\nComo jogar — draft: simultaneamente, cada jogador escolhe 1 carta da mão e a coloca virada para baixo na mesa. Todos revelam ao mesmo tempo. Em seguida, passam o restante da mão para o jogador à esquerda. Repita até as mãos se esgotarem. Pontuação: Maki Rolls (o jogador com mais = 6 pts, segundo mais = 3 pts); Sashimi (trio completo = 10 pts, incompleto = 0); Tempura (par = 5 pts, ímpar = 0); Nigiri (ovo=1, salmão=2, lula=3); Wasabi triplica o próximo Nigiri; Varinha permite pegar 1 carta descartada.\n\nFim e vitória: some os pontos após cada rodada. Pudim conta APENAS na rodada final (+6 para mais pudins, -6 para menos, com 3+ jogadores). Após 3 rodadas, o maior total vence o torneio de sushi!"},
  {id:"990.012",nome:"Azul",editora:"Next Move",cat:"Estratégia",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"100 azulejos de resina, 4 tabuleiros de jogador, 9 expositores de fábrica, 4 marcadores de pontuação, 1 marcador de primeiro jogador, 1 saco de tecido, livro de regras.",obs:"",regras:"Preparação: preencha os 9 expositores de fábrica com 4 azulejos aleatórios cada (retirados do saco). Cada jogador pega seu tabuleiro pessoal com 5 linhas de preparação e a parede colorida à direita.\n\nObjetivo: pontuar o máximo decorando sua parede com azulejos, seguindo as regras de padrões do tabuleiro.\n\nComo jogar: na sua vez, pegue TODOS os azulejos de UMA cor de UM expositor de fábrica (os que sobram vão para o centro) OU todos os azulejos de uma cor do centro da mesa. Coloque-os da direita para a esquerda em uma linha de preparação — todas as casas da linha devem ter a mesma cor, e a cor não pode já estar na posição correspondente da sua parede. Ao fim de cada rodada, linhas completas transferem seu azulejo para a parede e pontuam pelas adjacências; azulejos excedentes vão para o chão e rendem pontos negativos.\n\nFim e vitória: quando qualquer jogador completar uma linha horizontal completa na parede, termine a rodada atual. Some bônus: +2 por linha completa, +7 por coluna completa, +10 por ter os 5 azulejos de uma cor. O maior total vence!"},
  {id:"990.013",nome:"CATAN Junior",editora:"Devir Livraria",cat:"Estratégia",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"1 tabuleiro dupla-face, 1 dado, 28 covis de piratas, 28 barcos, 90 marcadores de recursos, 16 cocôs, 4 tabelas de custos, 1 figura do Pirata Rapina, manual.",obs:"",regras:"Preparação: monte o tabuleiro com as 8 ilhas circulares no lado escolhido. Cada jogador começa com 1 covi e 1 barco posicionados conforme o manual, e recebe recursos iniciais (1 ouro + 1 espada cada). Coloque o Pirata Rapina na ilha da caveira.\n\nObjetivo: ser o primeiro a construir 7 covis de piratas no tabuleiro.\n\nComo jogar: role o dado — cada número corresponde a uma ilha; todas as ilhas com aquele número produzem o recurso impresso para jogadores com covis adjacentes. Se cair no crânio do pirata, todos recebem 1 recurso do mercado e o Pirata Rapina move para uma ilha sem covi. Construa novos covis (custo: 1 ouro + 1 madeira + 1 cabra) ou barcos (1 ouro + 1 espada) para expandir pelo mapa. Troque recursos no mercado (3 iguais = 1 qualquer). O Pirata Rapina bloqueia a produção da ilha onde está.\n\nFim e vitória: assim que um jogador colocar seu 7º covi no tabuleiro, a partida termina imediatamente — esse jogador vence! Não espere o fim da rodada."},
  {id:"990.014",nome:"Ubongo",editora:"Devir Livraria",cat:"Quebra-Cabeça",idade:"8+",jog:"2-4",anos:"Todos",comp:"36 cartelas de desafio, 1 dado especial, 1 ampulheta, 1 bolsa de gemas, 58 gemas.",obs:"",regras:"Preparação: distribua uma cartela de desafio e o conjunto de peças geométricas para cada jogador. Coloque as gemas no saco central e vire a ampulheta.\n\nObjetivo: resolver o quebra-cabeça da sua cartela mais rápido que os outros para coletar as melhores gemas.\n\nComo jogar: role o dado especial — o resultado determina se todos usarão 3 ou 4 peças nessa rodada. Todos solucionam simultaneamente, sem esperar vez: encaixe as peças geométricas exatamente nos espaços da sua cartela (sem sobras nem buracos). Quando resolver, grite 'Ubongo!' e escolha gemas do saco: 1º a terminar pega 3 gemas, 2º pega 2, 3º pega 1. Quando a ampulheta esvaziar, quem não terminou não recebe gemas. Vire para a próxima cartela e repita.\n\nFim e vitória: ao fim de todas as cartelas, cada jogador conta APENAS as gemas da cor mais frequente na sua coleção. O maior número nessa cor dominante vence — estratégia: tente colecionar uma cor específica em vez de misturar!"},
  {id:"990.015",nome:"Que Bicho é Esse?",editora:"Algazarra",cat:"Tabuleiro",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"125 cartas de animais, 4 peões, 1 tabuleiro, 1 roleta de dicas, 1 roleta-dado, manual.",obs:"",regras:"Preparação: monte o tabuleiro e posicione todos os peões na casa de largada. Separe as cartas de animais em sua pilha. Deixe as duas roletas acessíveis no centro.\n\nObjetivo: ser o primeiro jogador a chegar ao final do percurso respondendo perguntas sobre o reino animal.\n\nComo jogar: na sua vez, gire a roleta-dado para determinar quantas casas avançar. A casa em que parar tem uma cor que define a categoria da pergunta. Gire a roleta de dicas para saber qual aspecto do animal perguntar: habitat (onde vive?), alimentação (o que come?), característica física (como é seu corpo?) ou curiosidade. Um adversário retira uma carta de animal e faz a pergunta correspondente. Resposta correta: ganhe casas bônus conforme indicado. Resposta errada: fique onde está. Casas especiais podem teleportar, fazer perguntas bônus ou penalizar.\n\nFim e vitória: o primeiro jogador a chegar ao espaço final do safari vence a aventura animal!"},
  {id:"990.016",nome:"Ludo Dama Trilha",editora:"Pais & Filhos",cat:"Clássico",idade:"6+",jog:"2-4",anos:"Todos",comp:"3 tabuleiros reversíveis, 16 peões para ludo, 1 dado, 24 peças para dama, 18 peças para trilha.",obs:"",regras:"LUDO: cada jogador tem 4 peões na base. Precisa de 6 no dado para tirar um peão. Percorra todo o circuito externo e leve os 4 peões ao centro (casa final). Cair exatamente sobre um peão adversário envia-o de volta à base (casas marcadas são seguras). Primeiro a chegar com todos os 4 peões vence!\n\nDAMA: cada jogador tem 12 peças no lado do tabuleiro 8×8. Mova peças diagonalmente uma casa por vez (só para frente). Captura é obrigatória: salte por cima da peça adversária. Ao chegar na última linha, vira DAMA e pode mover-se livremente nas diagonais. Capture todas as peças do adversário para vencer!\n\nTRILHA: cada jogador tem 9 peças. Fase 1 — alternadamente posicione peças nas interseções do tabuleiro. Fase 2 — mova uma peça por turno para um espaço adjacente vazio. Sempre que formar uma linha de 3 (MOINHO), remova 1 peça adversária. Com 2 peças restantes, o adversário perde!"},
  {id:"990.017",nome:"Mico",editora:"Copag",cat:"Cartas",idade:"4+",jog:"2-6",anos:"Y1-Y3",comp:"49 cartas (de 55 originais). Todos os pares estão presentes.",obs:"Faltam 6 cartas (mas há pares para todos)",regras:"Preparação: o baralho tem 49 cartas com pares de imagens e 1 carta do Mico (sem par). Distribua todas as cartas igualmente entre os jogadores (2 a 6). Número ímpar de cartas por jogador é normal.\n\nObjetivo: descartar todos os seus pares e evitar ficar com a carta do Mico ao final.\n\nComo jogar: cada jogador olha suas cartas em segredo e descarta imediatamente todos os pares que tiver, colocando-os virados sobre a mesa. Em sentido horário, estique sua mão em leque virado para o jogador à sua esquerda — ele retira 1 carta aleatória sem ver. Se a carta retirada formar um par com alguma da mão, descarte o par. Continue o ciclo: sempre que uma mão ficar vazia, esse jogador está fora (com segurança!). O jogo continua até só restar 1 carta no jogo — o Mico.\n\nFim e vitória: o jogador que sobrar segurando o Mico perde a rodada. Jogue múltiplas rodadas e some as derrotas para um torneio completo — ou simplesmente: quem não ficar com o Mico ganha!"},
  {id:"990.018",nome:"Mico",editora:"Copag",cat:"Cartas",idade:"4+",jog:"2-6",anos:"Y1-Y3",comp:"49 cartas (de 55 originais). Todos os pares estão presentes.",obs:"Faltam 6 cartas (mas há pares para todos) · 2ª cópia",regras:"Mesmas regras do Mico (990.017). 2a copia disponivel para turmas maiores."},
  {id:"990.019",nome:"Quebra Muro",editora:"Ark Toys",cat:"Habilidade Motora",idade:"4+",jog:"2",anos:"Y1-Y3",comp:"32 tijolos, 2 muros laterais, 2 pás, 1 boneco no suporte, 1 chão.",obs:"",regras:"Preparação: monte o muro encaixando os 32 tijolos coloridos entre os dois muros laterais e posicione o boneco no suporte no centro do muro. Cada jogador pega sua pá.\n\nObjetivo: derrubar o maior número de tijolos com sua pá sem fazer o boneco cair.\n\nComo jogar: na sua vez, use a pá para bater nos tijolos e tente derrubá-los para fora do muro. Cada tijolo derrubado com sucesso vale 1 ponto — guarde-o à sua frente. PORÉM, se o boneco cair durante sua jogada, você perde todos os pontos acumulados na rodada e o boneco é reposicionado para o próximo jogador. Você decide quando parar: tente mais tijolos por mais pontos, mas quanto mais o muro enfraquece, maior o risco!\n\nFim e vitória: o jogo termina quando todos os tijolos forem derrubados (ou ninguém quiser mais arriscar). O jogador com mais tijolos acumulados vence o duelo de destreza!"},
  {id:"990.020",nome:"Explorando o Brasil",editora:"Grow",cat:"Conhecimento",idade:"8+",jog:"2-4",anos:"Todos",comp:"1 tabuleiro dupla-face com mapa do Brasil, 1 dado, 26 cartas de Capitais, 27 cartas de Estados, 27 cartas de Conhecimentos Gerais, 4 conjuntos de fichas.",obs:"Falta 1 carta de Capitais",regras:"Preparação: monte o tabuleiro com o mapa do Brasil. Cada jogador coloca seu peão na largada e pega seu conjunto de fichas coloridas. Embaralhe cada pilha de cartas separadamente: Capitais, Estados e Conhecimentos Gerais.\n\nObjetivo: acumular o maior número de fichas de conhecimento atravessando as regiões do Brasil.\n\nComo jogar: lance o dado e avance pelo mapa. A região em que parar determina a categoria da pergunta: casas AZUIS = Capitais (qual a capital de...?), casas VERDES = Estados (em qual estado fica...?), casas AMARELAS = Conhecimentos Gerais (qual rio, bioma, clima ou cultura...). Um adversário retira a carta e faz a pergunta. Resposta correta: ganhe fichas conforme o nível de dificuldade indicado na casa. Resposta errada: não recebe fichas. Atenção: falta 1 carta de Capitais — se cair nessa, passe a vez sem pergunta.\n\nFim e vitória: quando o baralho de alguma categoria acabar, some as fichas de todos. Quem tiver mais fichas conhece melhor o Brasil e vence!"},
  {id:"990.021",nome:"Vira Letras",editora:"Estrela",cat:"Palavras",idade:"7+",jog:"2-4",anos:"Todos",comp:"64 discos de letras, 1 tabuleiro, 1 dado.",obs:"",regras:"Preparação: posicione todos os 64 discos de letras no tabuleiro com as letras viradas para baixo. Determine a ordem dos jogadores por sorteio.\n\nObjetivo: ser o jogador que acumular mais pontos formando palavras com as letras que forem sendo reveladas.\n\nComo jogar: na sua vez, role o dado — o resultado indica quantas letras você pode virar (nos discos que escolher). Após virar, observe TODAS as letras visíveis no tabuleiro (suas e das rodadas anteriores) e tente anunciar uma palavra válida em português usando essas letras. Se conseguir, marque os pontos equivalentes ao número de letras da palavra e aqueles discos são removidos do tabuleiro. Se não conseguir formar nenhuma palavra, passe a vez sem pontuar. Curingas (★) valem por qualquer letra mas não somam pontos extras.\n\nFim e vitória: o jogo termina quando todos os discos forem usados ou ninguém mais conseguir formar palavras. Some os pontos — o maior total vence!"},
  {id:"990.022",nome:"Vira Letras",editora:"Estrela",cat:"Palavras",idade:"7+",jog:"2-4",anos:"Todos",comp:"63 discos de letras (falta 1), 1 tabuleiro, 2 dados.",obs:"Falta 1 letra; tem 2 dados em vez de 1 · 2ª cópia",regras:"Mesmas regras do Vira Letras (990.021). 2a copia; usar apenas 1 dado para manter as regras originais."},
  {id:"990.023",nome:"Ticket to Ride: New York",editora:"Days of Wonder",cat:"Estratégia",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Mapa de Nova York, 62 cartas (44 cartas de transporte + 18 Tickets de destino), 68 taxis coloridos, 1 marcador de pontuação.",obs:"",regras:"Preparação: abra o mapa de Nova York no centro. Distribua 8 Taxis (na cor de cada jogador), 1 Ticket de destino e mão inicial de cartas de transporte. Compre 2 Tickets de destino secretos e descarte 1 (fica com o que for mais fácil/rentável).\n\nObjetivo: acumular mais pontos que todos conectando rotas pelo mapa de NYC, completando Tickets de destino secretos.\n\nComo jogar: na sua vez, faça UMA das 3 ações: (1) compre 2 cartas de transporte (do baralho ou das 5 viradas) — cada rota no mapa exige um conjunto de cartas da mesma cor; (2) reivindique uma rota: descarte o número correto de cartas da cor da rota e coloque seus Taxis nela — pontua imediatamente pelo tamanho; (3) compre Tickets de destino: pegue 3, fique com pelo menos 1. Completar um Ticket (conectar os dois pontos turísticos) soma os pontos impressos; não completar subtrai.\n\nFim e vitória: quando um jogador ficar com 0 ou 1 Taxi, cada um joga mais 1 rodada. Revele os Tickets, aplique bônus e penalidades. O maior total vence Manhattan!"},
  {id:"990.024",nome:"5-Minute Dungeon",editora:"Wiggles 3D",cat:"Cooperativo",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"10 baralhos de herois, 5 baralhos de boss, 200 cartas de jogador, 40 Door Cards, 10 Challenge Cards. Timer de 5 minutos.",obs:"",regras:"Preparação: cada jogador escolhe um herói (baralhos de 10 cartas cada) e embaralha-o. Escolha um Boss final (5 níveis de dificuldade). Empilhe as Door Cards para criar o dungeon. LIGUE O TIMER DE 5 MINUTOS!\n\nObjetivo: derrotar cooperativamente todas as portas do dungeon e o Boss final antes que o timer chegue a zero.\n\nComo jogar: todos jogam SIMULTANEAMENTE — não há turnos! Revele uma Door Card: ela mostra monstros ou obstáculos que exigem combinações específicas de ícones (espadas, flechas, escudos, magias, âncoras). Cada jogador descarta cartas da mão para contribuir com os ícones necessários. Comunique-se em voz alta para combinar recursos: 'Tenho 2 espadas, faltam 3!'. Use habilidades especiais dos heróis para acelerar. Quando uma porta for derrotada, revele a próxima.\n\nFim e vitória: derrotem o Boss dentro de 5 minutos para vencer. Timer zerou? Todos perdem. O jogo tem 5 bosses de dificuldade crescente — dominem todos!"},
  {id:"990.025",nome:"Adsumudi Math Game",editora:"Adsumudi",cat:"Matemática",idade:"8+",jog:"2-5",anos:"Todos",comp:"52 cartas dupla-face com 416 desafios matemáticos únicos adaptáveis a diferentes níveis.",obs:"",regras:"Preparação: as 52 cartas são dupla-face, com 416 desafios matemáticos únicos. Antes de começar, o grupo decide o nível de dificuldade (há vários graduados na carta) e o modo de jogo.\n\nObjetivo: resolver operações matemáticas mais rápido (modo competitivo) ou colaborativamente dentro do tempo (modo cooperativo).\n\nComo jogar — Modo Competitivo: revele uma carta e todos correm para resolver a operação do nível combinado em voz alta ou no papel. Quem responder primeiro e corretamente ganha a carta como ponto. Continue com a próxima carta. Modo Cooperativo: defina um timer e veja quantas cartas o grupo consegue resolver corretamente juntos. Tente bater o próprio recorde. Modo Dupla: forme times e compare resultados — cada time resolve no papel antes de revelar. Cobre adição, subtração, multiplicação e divisão em diferentes combinações e dificuldades.\n\nFim e vitória: no modo competitivo, quem tiver mais cartas ao esgotar o baralho vence. No cooperativo, tentem superar a pontuação anterior a cada sessão!"},
  {id:"990.026",nome:"Sleeping Queens",editora:"Gamewright",cat:"Cartas",idade:"8+",jog:"2-5",anos:"Y1-Y3",comp:"79 cartas: 12 Queen Cards, 27 cartas especiais (dragões, varinhas, cavaleiros, poções, bobos, reis), 40 cartas numeradas.",obs:"",regras:"Preparação: embaralhe todas as 79 cartas juntas e distribua 5 para cada jogador (mão). As 12 Rainhas ficam 'adormecidas' embaralhadas no baralho — não são separadas. Escolha quem começa.\n\nObjetivo: ser o primeiro a despertar 5 Rainhas (ou acumular 50 pontos em Rainhas) colocando-as à sua frente.\n\nComo jogar: na sua vez, descarte 1 carta da mão para o centro e compre 1 carta nova. Se jogar um REI, desperte 1 Rainha do baralho e coloque-a à sua frente! Se jogar um DRAGÃO, escolha um adversário — ele deve adormecer 1 de suas Rainhas de volta no baralho! Um CAVALEIRO rouba 1 Rainha de um adversário — a menos que ele use uma VARINHA DE MAGIA para bloqueá-lo! Cartas numéricas podem ser somadas e descartadas em grupos quando a soma delas aparecer em outra carta (ex.: 3+5=8).\n\nFim e vitória: o primeiro a ter 5 Rainhas despertas (ou 50+ pontos em Rainhas) ganha imediatamente. Rainhas valem pontos diferentes — calcule bem quais despertar!"},
  {id:"990.027",nome:"Taco Cat Goat Cheese Pizza",editora:"Dolphin Hat Games",cat:"Cartas",idade:"8+",jog:"2-8",anos:"Todos",comp:"66 cartas (Taco, Cat, Goat, Cheese, Pizza, Narwhal, Gorilla, Groundhog) + instruções.",obs:"",regras:"Preparação: embaralhe as 66 cartas e distribua igualmente entre todos os jogadores (2 a 8 pessoas). Cada um mantém sua pilha virada para baixo sem ver.\n\nObjetivo: ser o primeiro a descartar todas as suas cartas sendo rápido nos reflexos e preciso nos gestos especiais.\n\nComo jogar: em sentido horário, cada jogador vira a carta do topo da sua pilha para uma pilha central enquanto o grupo diz em sequência repetitiva: 'Taco, Cat, Goat, Cheese, Pizza, Taco, Cat...' (um jogador, uma palavra por vez). Quando a palavra dita COINCIDIR com a imagem da carta revelada, todos devem bater na pilha central o mais rápido possível. O MAIS LENTO a bater recebe toda a pilha do centro. Cartas especiais exigem gesto antes de bater: Narval = faça um chifre com o dedo na cabeça; Gorila = bata no peito; Marmota = tape os olhos. Quem fizer o gesto errado ou bater sem o gesto pega a pilha.\n\nFim e vitória: o primeiro a descartar sua última carta vence!"},
  {id:"990.028",nome:"Taco Cat Goat Cheese Pizza",editora:"Dolphin Hat Games",cat:"Cartas",idade:"8+",jog:"2-8",anos:"Todos",comp:"66 cartas + instruções.",obs:"2ª cópia",regras:"Mesmas regras do Taco Cat Goat Cheese Pizza (990.027). 2a copia para turmas maiores."},
  {id:"990.029",nome:"Match 5",editora:"Synapses Games",cat:"Palavras",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"1 livro de regras, 1 bloco de pontuação, 1 ampulheta de 3 minutos, 10 dados únicos (2 de cada cor), 10 cartelas de palavras.",obs:"",regras:"Preparação: distribua uma cartela de palavras e uma caneta para cada jogador. Coloque os 10 dados coloridos no centro e a ampulheta de 3 minutos ao lado.\n\nObjetivo: escrever palavras únicas para cada categoria dentro do tempo, acumulando mais pontos que os adversários ao longo das rodadas.\n\nComo jogar: role todos os 10 dados simultaneamente — cada dado tem uma cor e corresponde a uma categoria específica na cartela (animais, países, comidas, objetos, etc.). Vire a ampulheta e todos escrevem ao mesmo tempo, em silêncio: para cada categoria, escreva 1 palavra que comece com a letra indicada pelo dado daquela cor. Quando a ampulheta esvaziar, todos param. Pontuação: palavra que NINGUÉM MAIS escreveu = 2 pontos; palavra que outros também escreveram = 1 ponto; sem resposta = 0 pontos.\n\nFim e vitória: jogue várias rodadas (ou até o bloco de pontuação acabar). Some os pontos totais — quem acumular mais vence! Estratégia: pense em respostas incomuns para garantir os 2 pontos únicos."},
  {id:"990.030",nome:"What Next?",editora:"Big Potato",cat:"Cooperativo",idade:"8+",jog:"1-5",anos:"Y4-Y5",comp:"3 cenários inclusos. Cartas de localização, evento e item; 12 Peril Pieces, 16 Item Pieces, 12 Shape Pieces, 3 Sundials, puck, bolsa.",obs:"",regras:"Preparação: escolha um dos 3 cenários inclusos e organize as cartas conforme as instruções do cenário. Distribua as cartas de item entre os jogadores. Leia em voz alta o início da história.\n\nObjetivo: sobreviver cooperativamente às 14 etapas do cenário tomando as melhores decisões em grupo, buscando o melhor final possível.\n\nComo jogar: a cada etapa, o narrador descreve uma situação de perigo. Os jogadores discutem e votam: qual item usar para superar o desafio? Cada escolha revela cartas específicas de evento e localização que avançam a história em direções diferentes. Algumas escolhas custam recursos (vida, comida, itens); outras abrem atalhos. O Puck (dado de destino) é rolado em situações críticas para determinar resultados aleatórios. A Sundial registra o progresso e o nível de perigo do grupo.\n\nFim e vitória: o grupo vence se sobreviver às 14 etapas e chegar a um final positivo. O jogo tem múltiplos finais possíveis — explore todos os cenários para descobrir todos os desfechos!"},
  {id:"990.031",nome:"Trekking The National Parks (2ª Ed.)",editora:"Underdog Games",cat:"Tabuleiro",idade:"10+",jog:"2-5",anos:"Y4-Y5",comp:"1 mapa dos EUA, 45 pedras coloridas, 1 bolsa, 5 Trekkers, 15 Campsites, 6 Major Park Cards, 39 Park Cards, 96 Trek Cards, 10 Stone Bonus Cards, 5 Player Aid Cards.",obs:"",regras:"Preparação: abra o mapa dos EUA no centro. Cada jogador pega seu Trekker, 3 Campsites e seu baralho pessoal de Trek Cards embaralhado. Coloque as pedras coloridas no saco. Embaralhe os Park Cards e Major Park Cards em pilhas separadas.\n\nObjetivo: acumular mais pontos que os adversários visitando parques nacionais, coletando pedras e ocupando campsites estratégicos.\n\nComo jogar: na sua vez, use cartas Trek da sua mão para mover seu Trekker pelo mapa — cada carta tem um valor de passos. Ao visitar um parque pela primeira vez, pegue o Park Card correspondente (vale pontos e bônus únicos). Coloque um Campsite em parques estratégicos (antes que outros o façam — campsites ocupados bloqueiam outros jogadores). Pedras coloridas coletadas em regiões somam bônus em grupos. Compre cartas Trek ao final de cada turno.\n\nFim e vitória: o jogo termina quando os Park Cards se esgotarem. Some pontos de Park Cards, Major Parks (bônus especiais), grupos de pedras coloridas e Campsites. O maior total vence a grande trilha americana!"},
  {id:"990.032",nome:"Jabuka",editora:"Jabuka Games",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Todos",comp:"Mais de 100 peças em forma de grão de café com letras em todas as faces.",obs:"",regras:"Preparação: espalhe todas as peças em formato de grão de café com todas as letras visíveis no centro da mesa, criando um pool acessível a todos.\n\nObjetivo: acumular o maior número de peças formando e expandindo palavras válidas em português.\n\nComo jogar: todos jogam simultaneamente — não há turnos! Observe as letras no pool e, quando identificar uma palavra de 3+ letras, declare-a em voz alta e pegue as peças correspondentes colocando a palavra à sua frente. REGRA ESPECIAL: você pode adicionar letras do pool a uma palavra já formada por QUALQUER jogador para criar uma palavra maior, levando TODAS as peças daquela palavra + as novas (ex.: 'GATO' vira 'GATOS' ou 'AGATO' ou 'GATONÊS'). Anagramas completos também são válidos. Disputas simultâneas: quem tocar a peça primeiro na mesa vence.\n\nFim e vitória: o jogo termina quando não houver mais letras no pool e ninguém conseguir expandir palavras. Quem tiver mais peças ao final vence o duelo de vocabulário!"},
  {id:"990.033",nome:"Jabuka",editora:"Jabuka Games",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Todos",comp:"Mais de 100 peças em forma de grão de café.",obs:"2ª cópia",regras:"Mesmas regras do Jabuka (990.032). 2a copia disponivel."},
  {id:"990.034",nome:"Once Upon A Time (3ª Ed.)",editora:"Atlas Games",cat:"Comunicação",idade:"8+",jog:"2-6",anos:"Todos",comp:"110 cartas de história, 55 cartas de final, livro de regras.",obs:"",regras:"Preparação: embaralhe as 110 cartas de história e distribua 7 para cada jogador (ajuste conforme o número de pessoas). Distribua 1 carta de Final secreto para cada um — não mostrem a ninguém. Escolha quem narra primeiro.\n\nObjetivo: usar TODAS as suas cartas de elementos narrativos e concluir a história com sua carta de Final secreto — o primeiro a fazer isso vence.\n\nComo jogar: o narrador conta uma história em voz alta usando suas cartas como elementos (personagens, lugares, objetos, aspectos, eventos). Ao mencionar um elemento que corresponda a uma carta na mão, coloque-a virada na mesa. INTERRUPÇÃO: qualquer outro jogador pode jogar imediatamente uma carta que se encaixe naturalmente na narrativa e assumir o controle da história — sem interromper abruptamente, mas de forma coerente. O narrador atual perde o controle mas mantém suas cartas. Quando a história se aproximar do seu Final secreto, o narrador pode tentar concluí-la jogando a carta de Final.\n\nFim e vitória: quem jogar todas as suas cartas de elementos e encerrar com a carta de Final secreto vence o torneio de narrativa criativa!"},
  {id:"990.035",nome:"Qwirkle",editora:"MindWare",cat:"Estratégia",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"108 peças (6 cores × 6 formas × 3 de cada), 1 bolsa, livreto de regras.",obs:"",regras:"Preparação: coloque as 108 peças em um saco e misture. Cada jogador retira 6 peças e vê em segredo. Quem tiver a maior sequência de peças iguais abre o jogo.\n\nObjetivo: acumular mais pontos que todos formando linhas onde peças compartilham COR ou FORMA.\n\nComo jogar: na sua vez, coloque de 1 a 6 peças formando ou estendendo uma linha no tabuleiro. Regra de linha: todas as peças devem compartilhar a mesma COR (mesmas cores, formas todas diferentes) OU a mesma FORMA (mesmas formas, cores todas diferentes) — nunca repita peças idênticas na mesma linha. Pontue pelo número total de peças em CADA linha que sua jogada tocou ou criou. QWIRKLE: completar uma linha de 6 vale 12 pontos (bônus duplo)! Após jogar, compre do saco até ter 6 peças.\n\nFim e vitória: o jogo termina quando o saco esvaziar e um jogador usar todas as peças (+6 pontos de bônus). Maior pontuação total vence — bloqueie adversários enquanto maximiza seus próprios pontos!"},
  {id:"990.036",nome:"Spy Alley",editora:"Damm / Egmont",cat:"Estratégia",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro, 40 Free Gift Cards, 36 Move Cards, 6 Scorecards, 6 marcadores, 144 pegs, 6 Identification Cards, 1 dado, Spy Money.",obs:"",regras:"Preparação: distribua para cada jogador uma Identification Card secreta (sua nação e os 4 itens que precisa coletar) e uma quantia inicial de Spy Money. Monte o tabuleiro e posicione os marcadores.\n\nObjetivo: coletar secretamente os 4 itens da sua nação (código, passaporte, disfarce e arma) e atravessar a Spy Alley antes dos adversários — sem revelar sua identidade!\n\nComo jogar: role o dado e mova pelo tabuleiro. Ao parar em casas de itens, você PODE comprá-los — mas comprar sistematicamente apenas os itens de uma nação revela sua identidade! Compre itens de outras nações como disfarce. Move Cards permitem movimentos extras; Free Gift Cards dão itens gratuitamente. ACUSAÇÃO: a qualquer momento no seu turno, você pode acusar um adversário de ser espião de uma nação específica. Acertou? Você vence imediatamente. Errou? Você é eliminado!\n\nFim e vitória: o primeiro a ter os 4 itens corretos da sua nação E atravessar a Spy Alley vence. Ou acuse corretamente um adversário para vitória instantânea!"},
  {id:"990.037",nome:"Codenames: Disney Family Edition",editora:"USAopoly",cat:"Comunicação",idade:"8+",jog:"4+",anos:"Todos",comp:"25 Team Cards, 200 Code Name Cards, 20 Easy Key Cards, 40 Key Cards, suporte Mickey Ear.",obs:"",regras:"Preparação: espalhe 25 cards com nomes de personagens Disney em uma grade 5×5. Os dois líderes (um por time) olham juntos o mapa-chave secreto que mostra quais personagens pertencem a cada time — e qual é o Vilão Assassino. O time com mais personagens começa.\n\nObjetivo: ser o primeiro time a identificar corretamente todos os seus personagens Disney usando as pistas codificadas do líder.\n\nComo jogar: o líder do time ativo dá uma dica de UMA palavra + um número (ex.: 'Magia, 3' pode apontar para 3 personagens ligados à magia). Os agentes debatem em voz alta e tocam os personagens que acreditam serem do time. Toque correto = o líder confirma e podem continuar tentando. Toque em personagem adversário = a vez passa para o outro time. Toque no Vilão Assassino = esse time perde imediatamente! Modo Easy: mapa simplificado com menos personagens para crianças menores.\n\nFim e vitória: o time que identificar todos os seus personagens primeiro vence. Líderes precisam criar dicas criativas que conectem vários personagens de uma vez para agilizar a vitória!"},
  {id:"990.038",nome:"Dimension",editora:"KOSMOS",cat:"Estratégia",idade:"8+",jog:"1-4",anos:"Y4-Y5",comp:"60 esferas coloridas (5 cores, 12 de cada), 60 cartas de tarefas, 90 tokens de ponto, 30 tokens bônus, 4 bandejas.",obs:"",regras:"Preparação: coloque as 60 esferas coloridas (5 cores: laranja, azul, verde, amarelo, branco) no centro acessível a todos. Distribua 1 bandeja por jogador. Embaralhe as cartas de tarefas.\n\nObjetivo: cumprir o maior número de tarefas empilhando esferas na bandeja conforme as restrições das cartas reveladas.\n\nComo jogar: revele 5 cartas de tarefas simultaneamente no centro — cada carta define uma relação de cores (ex.: 'laranja deve estar sobre azul', 'verde não pode tocar amarelo', 'pelo menos 1 branca no topo'). Vire a ampulheta e todos empilham SIMULTANEAMENTE suas esferas tentando cumprir o máximo de tarefas ao mesmo tempo. Quando o tempo acabar, pare imediatamente. Verifique cada tarefa: cumprida = 1 ponto; usar exatamente as 5 cores diferentes = 1 token bônus. Tarefas contraditórias não precisam ser todas cumpridas — escolha quais priorizar.\n\nFim e vitória: após todas as rodadas, some pontos e tokens bônus. O maior total vence o desafio de lógica espacial 3D!"},
  {id:"990.039",nome:"Metro",editora:"Queen Games",cat:"Estratégia",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro 8x8, 60 peças de trilhos, 61 vagões, 6 marcadores coloridos. Expansão inclui estações extras e tabuleiro de ações.",obs:"",regras:"Preparação: posicione o tabuleiro 8×8 com as saídas nas bordas. Cada jogador posiciona seus vagões nas saídas definidas no início. Embaralhe as peças de trilhos e distribua 3 para cada jogador (mão inicial). As saídas do centro do tabuleiro são os terminais finais.\n\nObjetivo: criar linhas de metrô mais longas que as dos adversários, maximizando o percurso dos seus vagões até o centro.\n\nComo jogar: na sua vez, coloque 1 peça de trilho no tabuleiro conectando-a à rede existente. Em seguida, compre 1 nova peça. Os vagões se movem automaticamente pelos trilhos conforme são construídos — você não os controla diretamente. Construir trilhos que desviem os vagões adversários para percursos mais curtos e os seus para percursos mais longos é a estratégia central. PROIBIDO: nunca crie linhas circulares (que voltem ao ponto de saída) — valem zero pontos.\n\nFim e vitória: quando todas as linhas chegarem às bordas ou ao centro, some o comprimento percorrido pelos vagões de cada jogador. O maior total vence!"},
  {id:"990.040",nome:"Kodama 3D",editora:"Indie Boards",cat:"Estratégia",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"38 Goal Cards, 64 Branch Tiles, 8 Kodama Meeples (2 de cada cor), 8 troncos conectáveis.",obs:"",regras:"Preparação: distribua 2 troncos conectáveis para cada jogador e monte-os como base da árvore. Coloque os Branch Tiles e Kodama Meeples no centro. Cada jogador recebe 3 Goal Cards: escolha 1 para revelar (objetivo público) e 1 para guardar em segredo (descarte a 3ª).\n\nObjetivo: construir a árvore com mais pontos de Kodama, atendendo às condições das Goal Cards que seus espíritos da floresta habitam.\n\nComo jogar: na sua vez, (1) escolha 1 Branch Tile do centro e adicione-o à árvore de OUTRO jogador (não à sua!); (2) opcionalmente, mova 1 dos seus Kodama Meeples para qualquer galho de qualquer árvore. No final do jogo, cada Kodama pontua se a árvore onde está satisfizer as condições da Goal Card correspondente (ex.: '3+ galhos verdes', 'mais de 2 andares de altura', 'galho em direção específica'). Quanto mais você diversificar seus Kodamas em árvores diferentes, mais chances de pontuar.\n\nFim e vitória: revelar Goal Cards secretas e pontuar todos os Kodamas. Quem acumular mais pontos vence a floresta encantada!"},
  {id:"990.041",nome:"Forbidden Island",editora:"Gamewright",cat:"Cooperativo",idade:"10+",jog:"2-4",anos:"Y4-Y5",comp:"Marcador de nível de água, 58 cartas, 24 tiles de ilha, 6 peões, 4 figuras de tesouro, regras.",obs:"",regras:"Preparação: forme a ilha com os 24 tiles embaralhados em formato de diamante (4-3-4-3-4-3-4). Distribua 1 carta de Aventureiro para cada jogador (personagem com habilidade única: Explorador move na diagonal, Mergulhador nada, Engenheiro drena 2 tiles por ação, etc.). Ajuste o nível de água inicial (Novice = fácil, Legendary = muito difícil).\n\nObjetivo: coletar os 4 tesouros (Terra, Fogo, Vento, Oceano) e resgatar TODA a equipe no Heliporto antes que a ilha afunde.\n\nComo jogar: cada turno tem 3 fases — (1) execute 3 ações à sua escolha: mover para tile adjacente, drenar um tile alagado (vira-o de volta), passar cartas de tesouro a aliados no mesmo tile, coletar tesouro (com 4 cartas idênticas no mesmo local especial); (2) compre 2 cartas de Aventureiro (cartas Águas Crescentes sobem imediatamente o nível de inundação — mais cartas de inundação serão reveladas!); (3) revele cartas de inundação — tiles indicados alagam (1ª vez = alagado, 2ª vez = afundou para sempre). Cartas especiais: Sandbag, Helicopter Lift e Waters Rise são ferramentas de emergência.\n\nFim e vitória: todos no Heliporto com os 4 tesouros + 1 carta Helicopter Lift = vitória coletiva! Qualquer Heliporto afundado, tesouro perdido ou jogador sem escape = derrota total."},
  {id:"990.042",nome:"Anomia",editora:"Anomia Press",cat:"Comunicação",idade:"10+",jog:"3-6",anos:"Y4-Y5",comp:"2 baralhos (azul e laranja), cada com 92 cartas Anomia + 8 cartas curinga.",obs:"",regras:"Preparação: embaralhe os 2 baralhos juntos e distribua igualmente entre os jogadores. Cada um empilha suas cartas viradas para baixo na sua frente.\n\nObjetivo: ter o menor número de cartas ao final, nunca sendo o mais lento a gritar o exemplo de categoria.\n\nComo jogar: em sentido horário, cada jogador vira a carta do topo da sua pilha e coloca sobre a sua pilha pessoal, deixando o símbolo central visível. Após cada virada, compare os símbolos do topo de TODAS as pilhas: quando o símbolo da sua carta do topo BATER com o símbolo da carta de outro jogador, AMBOS devem imediatamente gritar um exemplo da categoria escrita na carta DO ADVERSÁRIO (não da sua!). O mais lento a gritar o exemplo correto fica com a pilha inteira do adversário. Curingas (Wild Cards) criam correspondências simultâneas com TODOS os jogadores à sua volta — caos total!\n\nFim e vitória: o jogo termina quando o baralho de compra acabar. Quem tiver MENOS cartas vence — velocidade de raciocínio e atenção simultânea são essenciais!"},
  {id:"990.043",nome:"Anomia",editora:"Anomia Press",cat:"Comunicação",idade:"10+",jog:"3-6",anos:"Y4-Y5",comp:"2 baralhos + 8 curingas.",obs:"2ª cópia",regras:"Mesmas regras do Anomia (990.042)."},
  {id:"990.044",nome:"Anomia",editora:"Anomia Press",cat:"Comunicação",idade:"10+",jog:"3-6",anos:"Y4-Y5",comp:"2 baralhos + 8 curingas.",obs:"3ª cópia",regras:"Mesmas regras do Anomia (990.042)."},
  {id:"990.045",nome:"Codenames: Pictures XXL",editora:"Czech Games Edition",cat:"Comunicação",idade:"10+",jog:"4+",anos:"Y4-Y5",comp:"14 cartas de agente (2 cores), 1 agente duplo, 4 inocentes, 1 assassino, 60 cartas-chave, 140 cartas com 280 imagens surreais, 1 suporte.",obs:"",regras:"Preparação: espalhe 20 imagens surreais em uma grade 5×4 (ou 25 em 5×5). Os líderes dos dois times olham juntos o mapa-chave secreto mostrando quais imagens pertencem a cada time — e qual é o Assassino. O time com mais imagens começa.\n\nObjetivo: ser o primeiro time a identificar todas as suas imagens usando dicas de uma única palavra dadas pelo líder.\n\nComo jogar: o líder do time ativo diz UMA palavra + um número (ex.: 'circular, 2' — mas com imagens surreais, 'circular' pode se conectar a coisas inesperadas). A ambiguidade intencional das imagens torna as dicas mais criativas e perigosas — uma imagem pode parecer se encaixar em múltiplos contextos. Os agentes debatem e tocam imagens: correto = continue; adversário = perde a vez; Assassino = derrota instantânea do time!\n\nFim e vitória: o time que identificar todas as suas imagens primeiro vence. Versão XXL tem cartas maiores para melhor visualização em grupos."},
  {id:"990.046",nome:"Jenga Maker",editora:"Hasbro",cat:"Habilidade Motora",idade:"8+",jog:"2+",anos:"Todos",comp:"28 blocos de madeira, 1 coroa de madeira, 200 cartas de desafio (metade iniciante, metade expert).",obs:"",regras:"Preparação: monte a torre de 54 blocos de madeira em 18 andares de 3 blocos cada, alternando a orientação (horizontal/vertical a cada andar). Embaralhe as 200 cartas de desafio em dois baralhos: iniciante (mais fáceis) e expert (muito difíceis).\n\nObjetivo: completar mais desafios que os adversários sem derrubar a torre.\n\nComo jogar: na sua vez, retire uma carta do baralho escolhido (iniciante ou expert, você decide) e leia em voz alta. Execute o desafio ao retirar o bloco: olhos fechados, apenas polegar e indicador de uma mão, mão não dominante, enquanto equilibra a coroa na cabeça, ou outros desafios criativos. Após retirar o bloco (de qualquer andar, exceto o topo), coloque-o no topo da torre conforme indicado. Cartas expert valem mais pontos se completadas com sucesso.\n\nFim e vitória: o jogo termina quando a torre cair. O jogador que derrubou é eliminado. Entre os restantes, vence quem completou mais desafios com sucesso!"},
  {id:"990.047",nome:"Ishtar: Gardens of Babylon",editora:"IELLO",cat:"Estratégia",idade:"10+",jog:"2-4",anos:"Y4-Y5",comp:"6 tabuleiros hexagonais, 42 Vegetation Tiles, 8 Blooming Tokens, 26 Tree Cards, 20 árvores, 6 fontes, 114 gemas, 16 assistentes, 1 regador, regras.",obs:"",regras:"Preparação: monte os 6 tabuleiros hexagonais conectados formando o jardim da Babilônia. Posicione as fontes nos espaços centrais. Distribua 4 gemas iniciais a cada jogador. Embaralhe os Vegetation Tiles e Tree Cards em pilhas separadas.\n\nObjetivo: marcar mais pontos que os adversários cultivando o jardim com árvores posicionadas estrategicamente perto de fontes.\n\nComo jogar: na sua vez, execute 1 das 2 ações disponíveis: (A) Coloque 1 Vegetation Tile no jardim — pague 1 gema da cor correspondente e colete TODAS as gemas já posicionadas nos espaços que o tile cobre (quanto mais gemas acumuladas, melhor o timing!); (B) Plante 1 Árvore em um espaço de vegetation tile existente — pague gemas conforme indicado e coloque a miniatura. Árvores adjacentes a fontes pontuam mais. Assistentes fornecem habilidades únicas (plantar duas vezes, bônus de gemas, etc.).\n\nFim e vitória: quando os Vegetation Tiles acabarem, pontue as árvores: cada árvore vale pontos base + multiplicador por fontes adjacentes. Blooming Tokens dão bônus extras. Maior pontuação total vence os Jardins Suspensos!"},
  {id:"990.048",nome:"Who Knows Where?",editora:"Wild Card Games",cat:"Conhecimento",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro dupla-face com 2 mapas-múndi, 101 cartas de perguntas, 4 cartas de dica, 12 peças, 1 dado.",obs:"",regras:"Preparação: abra o tabuleiro com o mapa-múndi escolhido (lado A = mapa geral com todos os países; lado B = desafio regional específico). Distribua as peças de localização para cada jogador. Embaralhe as cartas de perguntas e separe as cartas de dica.\n\nObjetivo: acumular pontos posicionando sua peça o mais próximo possível do local correto em cada pergunta geográfica.\n\nComo jogar: o jogador da vez lê uma pergunta geográfica em voz alta ('Onde fica o Monte Kilimanjaro?'). Simultaneamente, todos os outros jogadores posicionam secretamente sua peça no local que acreditam ser correto, sem mover depois. Todos revelam ao mesmo tempo. Pontuação por proximidade: posição exata = máximo de pontos; pontua-se proporcionalmente menos conforme mais distante. Antes de posicionar, você pode usar 1 Carta de Dica que revela uma dica sobre o continente — mas custa pontos.\n\nFim e vitória: após todas as cartas, some os pontos acumulados. Quem pontuar mais tem o melhor conhecimento geográfico e vence!"},
  {id:"990.049",nome:"Taboo",editora:"Hasbro Gaming",cat:"Comunicação",idade:"10+",jog:"4+",anos:"Y4-Y5",comp:"450 cartas de palavras com palavras proibidas, 1 buzzer, 1 timer, instruções.",obs:"",regras:"Preparação: divida os jogadores em 2 times iguais. Coloque as baterias no buzzer. Embaralhe as 450 cartas. Defina o número de rodadas (recomendado: 3 por time).\n\nObjetivo: fazer seu time adivinhar o maior número de palavras antes que o timer esgote, sem usar as palavras proibidas.\n\nComo jogar: um jogador do time ativo pega uma carta e tenta explicar a palavra no TOPO usando qualquer estratégia verbal (sinônimos, exemplos, gestos se permitido) — mas SEM usar as 5 palavras proibidas listadas abaixo. Um membro do time adversário fica de vigia com o buzzer. Se ouvir uma palavra proibida, clique! — o ponto é perdido e a carta vai para o descarte. Acertou? Próxima carta. Não sabe ou difícil demais? Pode pular (a carta vai para a pilha de descarte do time adversário como penalidade). O timer corre continuamente durante o turno.\n\nFim e vitória: some as cartas adivinhadas menos as penalidades de pulo ao final das rodadas. O time com mais pontos vence o torneio do tabu!"},
  {id:"990.050",nome:"Codenames: Disney Family Edition",editora:"USAopoly",cat:"Comunicação",idade:"8+",jog:"4+",anos:"Todos",comp:"25 Team Cards, 200 Code Name Cards, 20 Easy Key Cards, 40 Key Cards, suporte Mickey Ear.",obs:"2ª cópia",regras:"Mesmas regras do Codenames Disney (990.037). 2a copia para grupos maiores."},
  {id:"990.051",nome:"Otrio Deluxe",editora:"Marbles Brain Workshop",cat:"Estratégia",idade:"6+",jog:"2-4",anos:"Y1-Y3",comp:"3 peças de cada cor (vermelho, verde, azul, roxo) nos tamanhos P/M/G, 1 tabuleiro de madeira.",obs:"",regras:"Preparação: posicione o tabuleiro de madeira 4×4 no centro. Distribua as 9 peças de cada cor (3 pequenas, 3 médias, 3 grandes) para cada jogador — com 2 jogadores, 2 cores; com 4 jogadores, 1 cor cada.\n\nObjetivo: ser o primeiro a alinhar 4 peças da sua cor em sequência (horizontal, vertical ou diagonal).\n\nComo jogar: alternadamente, cada jogador coloca 1 peça em qualquer posição do tabuleiro 4×4. Regras especiais de empilhamento: cada posição pode conter até 3 peças (1 de cada tamanho: P, M e G). Uma peça MENOR pode ser colocada SOBRE uma peça MAIOR de qualquer cor — isso permite cobrir e bloquear peças adversárias estrategicamente! Mas atenção: a peça de cima é a que conta para os alinhamentos. Com 2 jogadores, cada um tem 2 cores e precisa alinhar 4 peças de UMA das suas cores.\n\nFim e vitória: o primeiro a conseguir 4 peças da mesma cor em linha reta (horizontal, vertical ou diagonal), em qualquer combinação de tamanhos, vence imediatamente!"},
  {id:"990.052",nome:"Carcassonne",editora:"Devir",cat:"Estratégia",idade:"8+",jog:"2-5",anos:"Y4-Y5",comp:"72 tiles de terreno, 40 seguidores de madeira (meeples), 5 abades, 12 tiles de rio, 1 marcador de pontos, manual.",obs:"",regras:"Preparação: coloque o tile inicial (lado reto voltado para cima) no centro. Embaralhe os 72 tiles restantes em pilhas. Cada jogador pega 7 meeples de madeira na sua cor. O tile inicial tem uma cidade no topo e estrada passando pelo centro.\n\nObjetivo: acumular mais pontos construindo e completando features (cidades, estradas, mosteiros e campos) no mapa medieval em expansão.\n\nComo jogar: na sua vez, compre 1 tile e conecte-o ao tabuleiro — as bordas DEVEM combinar (cidade com cidade, campo com campo, estrada com estrada). Depois, OPCIONALMENTE coloque 1 meeple em alguma feature do tile: na cidade (cavaleiro), na estrada (viajante), no campo (fazendeiro), no mosteiro (monge) — mas SÓ se não houver outro meeple nessa mesma feature. Quando uma feature for completada (cidade fechada, estrada com dois terminais, mosteiro rodeado), pontue IMEDIATAMENTE e recupere o meeple. Fazendeiros ficam no campo até o final.\n\nFim e vitória: ao colocar o último tile, pontue features incompletas (metade dos pontos) e fazendeires (pontuam por cidades completas adjacentes). Maior pontuação total vence Carcassonne!"},
  {id:"990.053",nome:"Dou Shou Qi",editora:"Mitra",cat:"Estratégia",idade:"8+",jog:"2",anos:"Todos",comp:"8 peças redondas de madeira clara (animais brancos), 8 peças de madeira escura (animais pretos), 1 manual.",obs:"",regras:"Preparação: posicione o tabuleiro com os rios no centro, armadilhas nos cantos e tocas (santuários) nas extremidades. Cada jogador posiciona suas 8 peças na própria metade (hierarquia impressa: 8=Elefante, 7=Leão, 6=Tigre, 5=Leopardo, 4=Cachorro, 3=Lobo, 2=Gato, 1=Rato).\n\nObjetivo: entrar com qualquer peça na Toca (santuário) do adversário, ou capturar todas as suas peças.\n\nComo jogar: alternadamente, mova 1 peça para uma casa adjacente (ortogonal — não diagonal). Captura: você só captura uma peça adversária se a sua tiver hierarquia IGUAL OU SUPERIOR. EXCEÇÃO crucial: o Rato (1) captura o Elefante (8)! Regras de terreno: Rio bloqueia a maioria dos animais — exceto Leão e Tigre que SALTAM o rio inteiro em linha reta; Rato NADA pelo rio (mas não pode atacar peças na margem de dentro do rio). Armadilhas: peças adversárias em armadilha podem ser capturadas por qualquer animal seu, independente da hierarquia.\n\nFim e vitória: entre na Toca do adversário com qualquer peça (não pode entrar na própria Toca), ou capture todas as peças adversárias para vencer!"},
  {id:"990.054",nome:"Geomundo",editora:"Grow",cat:"Conhecimento",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"1 tabuleiro, 90 cartas de geografia mundial, 1 dado, 4 cartelas passaporte.",obs:"",regras:"Preparação: monte o tabuleiro com o mapa-múndi. Cada jogador pega seu peão e sua cartela de passaporte em branco. Embaralhe as 90 cartas por região. Determine quem começa.\n\nObjetivo: viajar pelo mapa acumulando carimbos no passaporte respondendo perguntas de geografia mundial.\n\nComo jogar: role o dado e avance pelo tabuleiro seguindo o percurso pelos continentes. Ao parar em um continente/região, outro jogador retira a carta do topo da pilha daquela região e faz a pergunta correspondente: capitais, rios importantes, países, cadeias de montanhas, fauna/flora ou curiosidades culturais. Resposta correta: carimbe o passaporte com a cor do continente visitado. Resposta errada: não carimba, mas pode tentar de novo ao passar pela região novamente. Casas especiais dão perguntas bônus de múltipla escolha.\n\nFim e vitória: após uma volta completa ao mapa, compare os carimbos. Versão competitiva: quem tiver mais carimbos vence. Versão cooperativa: todos tentam completar o passaporte juntos antes de um número de rodadas limite!"},
  {id:"990.055",nome:"Rummikub Junior",editora:"Grow",cat:"Estratégia",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"4 suportes plásticos, 44 fichas cartonadas numeradas e coloridas, 50 fichas-ponto, manual.",obs:"",regras:"Preparação: coloque as 44 fichas coloridas no saco e misture. Cada jogador retira 7 fichas para a mão inicial. O restante é o estoque central.\n\nObjetivo: ser o primeiro a jogar todas as fichas da mão formando grupos e sequências no tabuleiro.\n\nComo jogar: na sua vez, forme grupos com suas fichas: GRUPO = 3 fichas do mesmo número em cores diferentes (ex.: 5 vermelho + 5 azul + 5 verde); SEQUÊNCIA = 3 fichas da mesma cor em números consecutivos (ex.: 3-4-5 azuis). Coloque os grupos válidos no tabuleiro central. Nos turnos seguintes, você também pode ADICIONAR fichas a grupos já existentes no tabuleiro (ex.: acrescentar 5 amarelo ao grupo acima). Se não conseguir jogar, compre 1 ficha do estoque e passe a vez. Fichas-ponto registram o placar entre rodadas.\n\nFim e vitória: o primeiro a jogar todas as fichas da mão vence a rodada. Os outros recebem pontos negativos pelo valor das fichas na mão. Jogue múltiplas rodadas — quem tiver menos pontos negativos ao final vence!"},
  {id:"990.056",nome:"Rummikub",editora:"Grow",cat:"Estratégia",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"104 pedras numeradas 1–13 (preto, laranja, azul e vermelho), 2 pedras-curinga, 4 suportes, manual.",obs:"",regras:"Preparação: coloque as 106 pedras no saco e misture. Cada jogador retira 14 pedras para a mão inicial. O restante é o estoque.\n\nObjetivo: ser o primeiro a jogar todas as pedras da mão no tabuleiro formando grupos e sequências válidos.\n\nComo jogar: para ABRIR o jogo (primeira vez que você coloca pedras no tabuleiro), seus conjuntos devem somar MÍNIMO 30 pontos usando apenas pedras da sua mão — não pode usar o tabuleiro existente. Nos turnos seguintes, adicione pedras aos conjuntos existentes no tabuleiro, crie novos grupos (3-4 pedras do mesmo número em cores diferentes) ou novas sequências (3+ pedras consecutivas da mesma cor). MANIPULAÇÃO: você pode reorganizar COMPLETAMENTE o tabuleiro para encaixar suas pedras — desde que tudo seja válido ao final da jogada. Se não conseguir, devolva tudo, compre 3 pedras de penalidade e passe a vez. Curingas substituem qualquer pedra, mas devem ser substituídos pelo valor correto se disponível.\n\nFim e vitória: o primeiro a jogar todas as pedras vence e recebe os pontos das pedras restantes dos adversários como positivo. Jogue múltiplas rodadas acumulando pontos!"},
  {id:"990.057",nome:"Jogo da Vida",editora:"Estrela",cat:"Tabuleiro",idade:"8+",jog:"2-6",anos:"Todos",comp:"1 tabuleiro, 6 carrinhos, 64 pinos (azuis e rosas), 24 cartões de riqueza, 24 apólices de seguro, 360 notas, 8 certificados de ações, 21 notas promissórias, 1 roleta, 1 régua numerada, manual.",obs:"",regras:"Preparação: monte o tabuleiro com o percurso da vida. Cada jogador pega um carrinho e decide: Faculdade (começa mais tarde mas com salário maior) ou Trabalho Direto (começa logo com salário menor). Separe as notas no banco central.\n\nObjetivo: ter a maior fortuna ao se aposentar, somando dinheiro, imóveis e prêmios.\n\nComo jogar: gire a roleta e avance pelo percurso de vida. Decisões em casas especiais: casamento (adicione peão), filhos (mais peões), carreira (escolha profissão com salário definido), imóveis (compra e venda), seguros (proteção contra eventos ruins), ações da bolsa (risco e recompensa), apostas e heranças. Cartas de Riqueza (azuis) trazem surpresas boas; eventos ruins custam dinheiro. Caminhos alternativos oferecem atalhos ou desvios mais lucrativos — mas com maior risco.\n\nFim e vitória: ao aposentar, escolha entre a Mansão dos Milionários (arriscada — pode dobrar ou perder) ou a Vila dos Serenos (garantida). Após todos aposentarem, some dinheiro + imóveis + seguros convertidos. Maior fortuna total vence a vida!"},
  {id:"990.058",nome:"Contra o Tempo",editora:"Grow",cat:"Palavras",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"300 cartas com palavras por categoria, 1 timer.",obs:"",regras:"Preparação: embaralhe as 300 cartas com categorias. Distribua papel e caneta para cada jogador (ou use o quadro branco do FUNIX). Coloque o timer visível ao grupo.\n\nObjetivo: escrever o maior número de palavras válidas e únicas dentro da categoria antes que o tempo acabe.\n\nComo jogar: o jogador da vez vira uma carta revelando a categoria (ex.: 'marcas de tênis', 'animais marinhos', 'instrumentos musicais de sopro'). Todos simultaneamente escrevem palavras da categoria — em silêncio, sem falar. Quando o timer tocar, todos param. Confira as listas: Modo Competitivo (1 jogador por rodada) — quem escreveu mais palavras válidas e diferentes das dos outros vence a rodada. Modo Simultâneo — todos jogam ao mesmo tempo na mesma rodada e quem tiver mais palavras ÚNICAS (que ninguém mais escreveu) vence.\n\nFim e vitória: some as vitórias de rodadas ao longo do jogo. Quem ganhar mais rodadas ao esgotar o baralho vence!"},
  {id:"990.059",nome:"Chess / Backgammon / Checkers",editora:"—",cat:"Clássico",idade:"8+",jog:"2",anos:"Todos",comp:"Tabuleiro triplo reversível com estojo. Peças de xadrez, peças de dama e peças de gamão incluídas.",obs:"",regras:"XADREZ: posicione as 32 peças na formação padrão. Mova cada tipo conforme suas regras únicas — Rei (1 casa, qualquer direção), Dama (livre em retas e diagonais), Torre (reta), Bispo (diagonal), Cavalo (L: 2+1, único a saltar peças), Peão (avança 1 casa, 2 na estreia, captura na diagonal; promove ao chegar na última fileira). Roque, en passant e promoção são movimentos especiais. Objetivo: xeque-mate no Rei adversário.\n\nDAMA/CHECKERS: 12 peças cada lado nas casas escuras. Move na diagonal para frente, 1 casa. Captura saltando (obrigatória!). Múltiplas capturas na mesma jogada são obrigatórias. Ao chegar na última fileira: DAMA, move livremente nas diagonais. Capture todas ou bloqueie para vencer.\n\nGAMÃO/BACKGAMMON: 15 peças cada lado. Role 2 dados e mova peças pelo circuito de 24 pontos. Empilhe 2+ para fechar um ponto (bloqueia adversário). Acerte 1 peça adversária solitária e mande-a para a barra. Primeiro a tirar todas as peças do tabuleiro vence!"},
  {id:"990.060",nome:"14 Days",editora:"PnP (Print and Play)",cat:"Cooperativo",idade:"8+",jog:"1-6",anos:"Y4-Y5",comp:"1 tabuleiro com espaços para 14 dias, 96 cartas divididas em 6 tipos (ação, saúde, infectados, comida, máscaras, dinheiro), 36 marcadores de jogador, 1 marcador de rodada.",obs:"Jogo Print and Play — componentes impressos e recortados",regras:"Preparação: posicione o tabuleiro com os 14 espaços de dias. Distribua as 96 cartas igualmente entre os jogadores (6 tipos: ação, saúde, infectados, comida, máscaras, dinheiro). Cada jogador olha sua mão em segredo. Este é um jogo Print & Play criado durante a pandemia de COVID-19.\n\nObjetivo: sobreviver cooperativamente os 14 dias gerenciando saúde, comida, dinheiro e máscaras — todos ganham ou perdem juntos.\n\nComo jogar: a cada dia (rodada), o grupo revela 1 carta de evento que define o desafio do dia (ex.: 'surto de infectados — precisam de 3 máscaras', 'queda de renda — gastem 2 dinheiros'). Os jogadores discutem livremente e coordenam quais cartas jogar: COMIDA nutre o grupo, DINHEIRO cobre gastos, MÁSCARAS protegem de infectados, SAÚDE cura jogadores adoecidos, INFECTADOS exigem ação imediata (ignore e a saúde cai). AÇÃO permite movimentos especiais e troca de cartas entre jogadores.\n\nFim e vitória: o grupo vence se todos sobreviverem os 14 dias com saúde acima de zero. Qualquer jogador chegando a 0 de saúde é derrota coletiva!"},
  {id:"990.061",nome:"Uno",editora:"Copag",cat:"Cartas",idade:"7+",jog:"2-10",anos:"Todos",comp:"108 cartas (19 de cada cor: vermelho, azul, verde e amarelo; mais 8 cartas de acao e 4 curingas).",obs:"",regras:"Preparação: embaralhe as 108 cartas e distribua 7 para cada jogador (2-10 pessoas). Vire 1 carta para iniciar a pilha de descarte (se for especial, aplique o efeito). Cada um vê suas cartas em segredo.\n\nObjetivo: ser o primeiro a descartar todas as cartas da mão, acumulando pontos nas rodadas ao longo do torneio.\n\nComo jogar: em sentido horário, jogue 1 carta que combine com a do topo por COR ou por NÚMERO/SÍMBOLO. Cartas especiais: Pula (próximo perde a vez), Inverter (sentido do jogo muda), +2 (próximo compra 2 e perde a vez), Curinga (você escolhe a nova cor), Curinga +4 (próximo compra 4, perde a vez, e você escolhe a cor — só pode usar se não tiver a cor pedida, sob risco de contestação). Sem carta compatível? Compre 1 do baralho; se não puder jogar a comprada, passe a vez. ATENÇÃO: ao ficar com apenas 1 carta, grite 'UNO!' imediatamente — se outro perceber primeiro, você compra 2!\n\nFim e vitória: o primeiro a descartar a última carta vence a rodada. Some as cartas restantes dos adversários (cartas especiais = 20 pts, curingas = 50 pts, numéricas = valor impresso). Primeiro a 500 pontos acumulados vence o torneio!"},
  {id:"91",nome:"Uno da Laranja",editora:"Copag",cat:"Cartas",idade:"7+",jog:"2-10",anos:"Todos",comp:"108 cartas — versão temática do UNO clássico.",obs:"",regras:"Mesmas regras do Uno classico. Jogue cartas que combinem com a cor ou numero da carta do topo. Grite UNO com 1 carta restante! Versao tematica com design diferenciado."},
  {id:"990.062",nome:"Abstratuse",editora:"Ludens Spirit",cat:"Comunicação",idade:"10+",jog:"2-4",anos:"Y4-Y5",comp:"16 marcadores, 4 cubos, 4 réguas de pontuação e votos, 1 ampulheta, 160 cartas, 4 kits de peças geométricas (acrílico e madeira).",obs:"",regras:"Preparação: distribua para cada jogador 1 kit de peças geométricas (formas de acrílico e madeira). Coloque as cartas de conceito em uma pilha embaralhada virada para baixo. Distribua os cartões de voto, réguas de pontuação e a ampulheta.\n\nObjetivo: comunicar conceitos abstratos usando APENAS composições de formas geométricas 3D — sem palavras, números, gestos ou sons.\n\nComo jogar: o artista da rodada retira secretamente 1 carta de conceito (ex.: 'equilíbrio', 'medo', 'liberdade', 'tempo') e tem 2 minutos (ampulheta) para criar uma composição tridimensional que represente aquele conceito usando as peças. Use posição (alto/baixo), direção, equilíbrio, relação entre formas e tamanhos para comunicar. Quando o tempo acabar, todos os outros jogadores escrevem silenciosamente em seus cartões qual conceito acreditam que foi representado (entre 4 opções mostradas). Os votos são revelados: artista ganha 1 ponto por acerto de cada votante; cada votante correto ganha 1 ponto.\n\nFim e vitória: após todos terem sido artistas igualmente, some os pontos — quem comunicou e interpretou mais com mais precisão vence!"},
  {id:"990.063",nome:"Certo ou Errado",editora:"Estrela",cat:"Conhecimento",idade:"8+",jog:"2-6",anos:"Todos",comp:"1 tabuleiro, 100 cartas de afirmações, 6 peões, 1 dado, manual.",obs:"",regras:"Preparação: monte o tabuleiro e posicione os peões na largada. Embaralhe as 100 cartas de afirmações. Escolha quem começa por sorteio.\n\nObjetivo: ser o primeiro a completar o percurso respondendo corretamente se as afirmações são CERTAS ou ERRADAS.\n\nComo jogar: role o dado e avance pelo tabuleiro. Na casa em que parar, o adversário à sua esquerda retira uma carta e lê uma afirmação em voz alta. Você responde CERTO (a afirmação é verdadeira) ou ERRADO (é falsa) — sem consultar ninguém. O adversário revela a resposta: correta = avance o número de casas bônus indicado na carta; errada = fique onde está. ATENÇÃO às pegadinhas: muitas afirmações parecem completamente óbvias mas são falsas, e algumas informações contraintuitivas são verdadeiras (ex.: 'Um avestruz consegue voar' — ERRADO; 'A língua do elefante é maior que a tromba' — ERRADO). Casas especiais trazem afirmações bônus valendo mais casas.\n\nFim e vitória: o primeiro a cruzar o espaço final do percurso vence!"},
