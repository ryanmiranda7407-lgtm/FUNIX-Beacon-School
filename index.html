  {id:"990.186",nome:"Stick Up!",editora:"—",cat:"Cartas",idade:"8+",jog:"2-5",anos:"Todos",comp:"Baralho com cartas de ladroes, policiais e acoes.",obs:"",regras:"Preparação: embaralhe o baralho de cartas de ladrões, policiais e ações especiais. Distribua 5 cartas para cada jogador como mão inicial. Coloque os tokens de dinheiro do banco no centro (tesouro comum). Defina o número de rodadas.\n\nObjetivo: acumular o maior valor em dinheiro roubado do banco, usando ataques, defesas e ações especiais para superar os adversários.\n\nComo jogar: na sua vez, jogue cartas da mão para executar ações: ATAQUE (tente roubar dinheiro do banco central — compare a força com a defesa dos outros); DEFESA (bloqueie um ataque inimigo contra você); AÇÃO ESPECIAL (roubar dinheiro de outro jogador em vez do banco, descartar cartas de adversário, ou repor a própria mão). Confrontos diretos são resolvidos somando os valores de força das cartas jogadas — maior total vence. O perdedor descarta as cartas usadas sem ganhar nada. Ao final da vez, compre cartas até completar a mão.\n\nFim e vitória: ao esgotar o banco ou após o número definido de rodadas, some o dinheiro acumulado por cada jogador. Quem fugiu com mais grana vence o grande assalto ao banco!"},
  {id:"990.187",nome:"Pics Bio+",editora:"—",cat:"Comunicação",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"112 cartas com imagens relacionadas a biologia.",obs:"",regras:"Preparação: embaralhe as 112 cartas com imagens biológicas e divida em grupos temáticos: Célula, Ecologia, Anatomia Humana, Genética, Evolução. Divida os jogadores em 2 equipes. Determine quem começa como comunicador (alterna a cada rodada). Deixe o timer visível para todos.\n\nObjetivo: comunicar conceitos biológicos complexos selecionando imagens de uma grade, sem usar palavras, para que a equipe adivinhe no menor tempo possível.\n\nComo jogar: o comunicador revela 1 carta-conceito secreta (ex.: 'Fotossíntese'). Em seguida, seleciona da grade disponível as imagens que, combinadas, representam o conceito. A equipe tem 60 segundos para identificar o conceito biológico a partir das imagens escolhidas. Sem palavras, apontar, letras no ar ou qualquer comunicação direta. Pontuação: adivinhar em menos de 20 segundos = 3 pts; até 40s = 2 pts; até 60s = 1 pt; não adivinhar = 0 pt. Equipe adversária pode tentar roubar o ponto se errar no último segundo.\n\nFim e vitória: após igual número de rodadas para cada equipe, some os pontos. A equipe com mais pontos vence! Ferramenta poderosa para revisar vocabulário biológico de forma visual e criativa."},
  {id:"990.188",nome:"Xadrez Padrão I",editora:"—",cat:"Clássico",idade:"6+",jog:"2",anos:"Todos",comp:"32 peças de xadrez (16 brancas, 16 pretas), tabuleiro 8x8, livro de regras.",obs:"",regras:"Preparação: posicione o tabuleiro com a casa branca no canto direito de cada jogador. Coloque as peças nas posições iniciais: Torres nos cantos, Cavalos ao lado, Bispos ao lado dos Cavalos, Rainha na casa da sua cor, Rei na restante. Peões ocupam toda a segunda fileira. Brancas começam.\n\nObjetivo: dar Xeque-Mate no Rei adversário — colocá-lo em posição de ataque sem que haja saída possível.\n\nComo jogar — MOVIMENTOS: Peão avança 1 casa (2 na primeira jogada), captura na diagonal (nunca em frente). Torre move qualquer número de casas em linha reta. Bispo na diagonal. Cavalo em L (2+1 casas) — ÚNICO que salta sobre outras peças. Rainha combina Torre + Bispo (qualquer direção). Rei 1 casa qualquer. SITUAÇÕES ESPECIAIS: XEQUE — Rei está sendo atacado; a jogada que deixa o Rei em xeque é ilegal. ROQUE — Rei e Torre se movem juntos (apenas se nunca se moveram e caminho livre). EN PASSANT — captura especial de peão. PROMOÇÃO — peão no final do tabuleiro vira qualquer peça. XEQUE-MATE — Rei sem saída = fim do jogo.\n\nFim e vitória: Xeque-Mate encerra o jogo — quem deu o mate vence! O livro incluído traz aberturas clássicas, táticas básicas (garfo, fila dupla, espeto) e finais fundamentais para quem quer evoluir."},
  {id:"990.189",nome:"Xadrez Padrão II",editora:"—",cat:"Clássico",idade:"6+",jog:"2",anos:"Todos",comp:"32 peças de xadrez (16 brancas, 16 pretas), tabuleiro 8x8.",obs:"",regras:"Mesmas regras do Xadrez Padrao I (990.188). 2a copia para praticar simultaneamente em duplas diferentes."},
  {id:"990.190",nome:"Quem Sou Eu?",editora:"—",cat:"Comunicação",idade:"8+",jog:"3-6",anos:"Todos",comp:"Cartas de personagens, tiras de cabeca ou post-its, instrucoes.",obs:"",regras:"Preparação: distribua 1 carta de personagem para cada jogador — cada um posiciona a carta na testa (usando tira de cabeça ou segurando) de forma que TODOS vejam, exceto o próprio portador. Personagens podem ser pessoas reais, personagens de ficção, animais, objetos ou conceitos dependendo do baralho.\n\nObjetivo: descobrir quem você é fazendo perguntas estratégicas de SIM ou NÃO com o menor número de perguntas possível.\n\nComo jogar: os jogadores se revezam fazendo 1 pergunta por turno que o grupo responde em coro (sim, não ou às vezes). Exemplos estratégicos de primeiras perguntas: 'Sou uma pessoa real?' → se sim: 'Sou uma pessoa viva?' → 'Sou famoso pelo esporte?' → afunilando progressivamente. A arte está em usar as respostas para eliminar categorias amplas antes de ir para detalhes. PONTUAÇÃO: descobrir a identidade em até 5 perguntas = 5 pts; 6-10 = 3 pts; 11-15 = 1 pt; mais de 15 = 0 pt.\n\nFim e vitória: após todos os jogadores descobrirem (ou desistirem de) suas identidades, some os pontos. Quem fez as perguntas mais eficientes e descobriu com menos tentativas vence o torneio de Quem Sou Eu?"},
  {id:"990.191",nome:"Jenga I",editora:"Hasbro",cat:"Habilidade Motora",idade:"6+",jog:"1+",anos:"Todos",comp:"54 blocos de madeira.",obs:"",regras:"Preparação: monte a torre empilhando os 54 blocos de madeira em 18 camadas de 3 blocos cada — alternando a orientação a cada camada (camadas ímpares na horizontal, pares na vertical). A torre deve estar reta e estável antes de começar.\n\nObjetivo: retirar blocos da torre sem derrubá-la e empilhar novos no topo — não ser o responsável pelo desabamento épico.\n\nComo jogar: na sua vez, usando apenas UMA mão (e somente 3 dedos), toque e empurre ou puxe UM único bloco de qualquer nível da torre — exceto o nível mais alto. Antes de retirar, você pode tocar levemente outros blocos para testar a estabilidade. Ao retirar o bloco, coloque-o no topo da torre, formando parte da nova camada (3 blocos = camada completa). REGRAS IMPORTANTES: não pode remover o último bloco de uma camada que está suportando peso acima; não pode usar as duas mãos (exceto para colocar no topo); se qualquer bloco do topo cair ao colocar, não conta como derrubada — reorganize com cuidado.\n\nFim e vitória: o jogador que causar o desmoronamento da torre — ou o bloco que virou a torre ao ser colocado no topo — perde a rodada! Em múltiplas rodadas, quem perder menos vezes vence o campeonato de Jenga."},
  {id:"990.192",nome:"Max Pega Vareta",editora:"—",cat:"Habilidade Motora",idade:"6+",jog:"2+",anos:"Y1-Y3",comp:"Conjunto de varetas coloridas, instrucoes com valores por cor.",obs:"",regras:"Preparação: segure todas as varetas coloridas verticalmente em um punho, eretas, e solte-as de uma vez — elas caem formando uma pilha embaralhada e entrelaçada no centro da mesa. Cada cor tem um valor de pontos: Preto (5 pts) — mais difícil e raro; Vermelho (4 pts); Azul (3 pts); Verde (2 pts); Amarelo (1 pt).\n\nObjetivo: acumular o maior valor de pontos retirando as varetas mais valiosas da pilha com precisão e paciência sem mexer nas outras.\n\nComo jogar: na sua vez, tente retirar UMA vareta da pilha usando apenas os dedos — sem ferramentas. Pode empurrar levemente apenas se conseguir movê-la sem que outras varetas se mexam visivelmente. SUCESSO: guarde a vareta (vale seus pontos) e jogue novamente enquanto continuar sem mover outras. FALHA (qualquer outra vareta se moveu): pare imediatamente, passe a vez, e a vareta que estava tentando retirar fica no lugar. Estratégia: comece pelas varetas mais acessíveis nas bordas da pilha e progrida para as mais enterradas.\n\nFim e vitória: quando todas as varetas forem retiradas (ou quando ninguém mais conseguir retirar), some os pontos de cada jogador. Quem acumular mais pontos vence o torneio de pega-vareta!"},
  {id:"990.193",nome:"Memor",editora:"—",cat:"Memória",idade:"5+",jog:"2-4",anos:"Y1-Y3",comp:"Cartas com pares de ilustracoes variadas.",obs:"",regras:"Preparação: embaralhe todas as cartas de ilustrações e distribua viradas para baixo em grade organizada no centro da mesa (ex.: 6x6 para 36 pares). Todos os jogadores devem conseguir alcançar o centro. Defina a ordem de turnos.\n\nObjetivo: encontrar o maior número de pares de cartas com ilustrações idênticas usando memória de curto prazo para lembrar onde estão as cartas já viradas.\n\nComo jogar: na sua vez, vire 2 cartas quaisquer da grade, mostrando a face para todos. SE FORMAREM PAR (mesma ilustração): guarde as 2 cartas como ponto e jogue NOVAMENTE — você pode encadear múltiplas jogadas enquanto acertar pares. SE NÃO FORMAREM PAR: vire ambas de volta na posição original, exatamente na mesma posição — passe a vez. Lembre mentalmente quais cartas foram reveladas e onde estão posicionadas para usar esse conhecimento em turnos futuros. Observar os turnos dos adversários é tão importante quanto o próprio turno!\n\nFim e vitória: quando todas as cartas forem emparelhadas, some os pares de cada jogador. Quem encontrou mais pares vence o campeonato de memória! Para crianças menores: use menos cartas (12-16 pares) para um jogo mais rápido."},
  {id:"990.194",nome:"Uno All Wild",editora:"Mattel",cat:"Cartas",idade:"7+",jog:"2-10",anos:"Todos",comp:"112 cartas — todas sao curingas!",obs:"",regras:"Preparação: embaralhe as 112 cartas — TODAS são curingas (Wild) de diferentes tipos. Distribua 7 cartas para cada jogador. Vire 1 carta para começar a pilha de descarte.\n\nObjetivo: ser o primeiro a se livrar de todas as cartas da mão, usando o poder único de cada carta curinga a seu favor.\n\nComo jogar: como TODAS as cartas são curingas, SEMPRE você pode jogar — não há restrição de cor ou número para combinar. Cada carta ao ser jogada permite ESCOLHER UMA COR para o jogo continuar. CARTAS ESPECIAIS: Wild Draw Two (próximo jogador compra 2 cartas e perde a vez), Wild Reverse (inverte o sentido), Wild Skip (próximo jogador perde a vez), Wild Forced Swap (troque sua mão com qualquer adversário), Wild Color Roulette (todos os jogadores passam sua mão para a direita simultaneamente!). A ausência de números torna o jogo mais caótico e imprevisível, mas também mais democrático — qualquer nível de experiência pode ganhar. Grite UNO ao ficar com apenas 1 carta!\n\nFim e vitória: o primeiro a jogar a última carta vence a rodada! Em múltiplas rodadas, pontue as cartas restantes dos outros (cada carta = 20 pts). Menor pontuação acumulada ao atingir 500 pts no total vence o campeonato."},
  {id:"990.195",nome:"Meeple Ataca",editora:"—",cat:"Estratégia",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Meeples de madeira, tabuleiro de castello, cartas de acao.",obs:"",regras:"Preparação: posicione o tabuleiro de castelo no centro com os territórios numerados. Cada jogador começa com seus meeples de madeira coloridos posicionados no próprio castelo (1 meeple por território inicial). Distribua 5 cartas de ação para cada jogador como mão inicial.\n\nObjetivo: invadir o castelo adversário posicionando meeples no território inimigo enquanto defende o próprio castelo com menos baixas possível.\n\nComo jogar: na sua vez, jogue 1 carta de ação da mão e execute o efeito: MOVER (mova 1-3 meeples para casas adjacentes, incluindo território inimigo), ATACAR (retire 1 meeple adversário de uma casa contestada, mas perca 1 próprio também), FORTALECER (adicione 1 meeple extra a uma posição defensiva — neutraliza 1 ataque futuro), ou EMBOSCADA (force adversário a recuar 1 meeple para a base). Meeples no território adversário marcam pontos continuamente; meeples no próprio território defendem. Ao final da vez, compre 1 carta.\n\nFim e vitória: quando o baralho de ações se esgotar completamente, conte o território controlado: meeples no castelo adversário valem 2 pts cada; meeples no próprio castelo valem 1 pt cada. Quem tiver mais pontos com menos baixas vence o cerco medieval!"},
  {id:"990.196",nome:"Axé",editora:"—",cat:"Tabuleiro",idade:"8+",jog:"2-4",anos:"Todos",comp:"Tabuleiro tematico, cartas de conhecimento afro-brasileiro, peons, dados.",obs:"",regras:"Preparação: posicione o tabuleiro temático no centro com os peões na largada. Separe as cartas por categoria: HISTÓRIA (história africana e afro-brasileira), MÚSICA E DANÇA (samba, candomblé, axé, capoeira), CULINÁRIA (acarajé, vatapá, caruru, moqueca), RELIGIOSIDADE E VALORES (tradições africanas, orixás, crenças) e SABEDORIA (provérbios e ensinamentos). Defina a ordem dos turnos.\n\nObjetivo: percorrer o tabuleiro respondendo perguntas e completando desafios culturais afro-brasileiros para aprender e valorizar esta rica herança.\n\nComo jogar: na sua vez, role o dado e avance pelo tabuleiro. A cor da casa indica a categoria da pergunta. Outro jogador lê a pergunta ou desafio cultural. Acertou ou completou: avance 1 casa extra como bônus. Errou: ouça a resposta e aprenda o conteúdo — este jogo privilegia o aprendizado sobre a punição. CARTAS DE SABEDORIA: quando parar numa casa especial, leia um provérbio africano ou ensinamento e compartilhe com o grupo o que ele significa para você. Esse momento de reflexão vale 2 casas de avanço.\n\nFim e vitória: o primeiro a chegar ao final vence! Mais importante que vencer é o conhecimento construído coletivamente sobre a riqueza da cultura afro-brasileira."},
  {id:"990.197",nome:"Slap It!",editora:"—",cat:"Habilidade Motora",idade:"8+",jog:"2-6",anos:"Todos",comp:"Baralho de cartas com simbolos sobrepostos.",obs:"",regras:"Preparação: embaralhe o baralho de cartas com símbolos sobrepostos. Distribua as cartas igualmente em pilhas voltadas para baixo, 1 pilha por jogador. No centro, 2 pilhas de descarte começam vazias.\n\nObjetivo: ser o mais rápido a bater na pilha de descarte correta quando as 2 cartas no topo tiverem um símbolo em comum, acumulando mais cartas que os adversários.\n\nComo jogar: cada jogador vira 1 carta do topo da própria pilha para a pilha de descarte correspondente. Quando as 2 cartas no topo das pilhas centrais tiverem pelo menos 1 símbolo IDÊNTICO (mesmo ícone, mesmo tamanho, mesma orientação): bata na pilha de descarte o mais rápido possível! O MAIS RÁPIDO coleta todas as cartas de ambas as pilhas de descarte para a própria pilha (pontos). FALSO ALARME (bateu sem correspondência real): dê 3 cartas da própria pilha para a pilha central. Cartas especiais criam combinações indiretas (ex.: símbolo de 1 carta combina com o reverso de outra).\n\nFim e vitória: quando alguém ficar sem cartas para virar, conte as cartas acumuladas por cada jogador. Quem tiver mais cartas vence o torneio de reflexos Slap It!"},
  {id:"990.198",nome:"Uno",editora:"—",cat:"Cartas",idade:"7+",jog:"2-10",anos:"Todos",comp:"108 cartas.",obs:"",regras:"Mesmas regras do Uno classico (990.061). 4a copia disponivel."},
  {id:"990.199",nome:"Duel",editora:"—",cat:"Estratégia",idade:"8+",jog:"2",anos:"Y4-Y5",comp:"Cartas de recursos e habilidades, tabuleiro de duelo.",obs:"",regras:"Preparação: coloque o tabuleiro de duelo no centro com as cartas distribuídas nos 3 eras (Idade Antiga, Medieval e Renascimento). Organize as fichas de recursos e moedas. Distribua os tokens de progresso científico, militar e comercial. Cada jogador começa com 7 moedas.\n\nObjetivo: superar o adversário acumulando pontos de vitória através de comércio, ciência e conquistas militares — ou vencer instantaneamente por domínio científico ou militar antes da contagem final.\n\nComo jogar: o tabuleiro de 6 cartas disponíveis fica entre os dois jogadores — quem pegar uma carta bloqueia o adversário de pegá-la. Na sua vez: CONSTRUIR uma carta pagando recursos ou moedas (ganha seus benefícios permanentes), DESCARTAR para ganhar 2 moedas, ou CONSTRUIR UM MONUMENTO reservado. Cartas de CIÊNCIA: coletar 6 símbolos científicos iguais = vitória instantânea. Cartas MILITARES: acumular mais escudos que o adversário em cada era = ele perde moedas ou cartas. Cartas COMERCIAIS: geram moedas e recursos passivos. A cada era, avalie o progresso militar — o lado mais fraco sofre consequências.\n\nFim e vitória: ao final da 3ª era, some pontos de cartas, moedas, monumentos e progresso. OU vença instantaneamente por supremacia científica ou militar durante o jogo!"},
  {id:"990.200",nome:"Quebra-cabeça Turismo pelo Mundo",editora:"—",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Todos",comp:"Peças de quebra-cabeça com pontos turísticos mundiais.",obs:"",regras:"Preparação: separe todas as peças do quebra-cabeça e espalhe sobre uma superfície plana com espaço suficiente. Estratégia para montar: comece pelas bordas (peças com pelo menos um lado reto), depois preencha por regiões de cor e padrão.\n\nObjetivo: montar o quebra-cabeça revelando pontos turísticos famosos do mundo e, após completar, identificar os locais representados.\n\nComo jogar: MONTAGEM INDIVIDUAL: trabalhe sozinho de forma relaxada e contemplativa — excelente para concentração e meditação ativa. MONTAGEM EM GRUPO: divida as peças por região ou cor entre os participantes; cada um monta sua porção e encaixam juntos ao final. Estratégias úteis: separe peças pelo tom de cor dominante (azul do céu, bege de areia), procure texturas específicas (azulejos do Taj Mahal, trepadeiras do Machu Picchu). DESAFIO GEOGRÁFICO: ao completar, identifique cada monumento e o país onde está: Torre Eiffel (França), Cristo Redentor (Brasil), Taj Mahal (Índia), etc. Pontue 1 pt por cada local identificado corretamente.\n\nFim da atividade: o quebra-cabeça montado pode ser exposto na sala como mural educativo temporário. Conecta com aulas de geografia e cultura global!"},
  {id:"990.201",nome:"Quebra-cabeça Bandeiras",editora:"—",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Todos",comp:"Peças de quebra-cabeça com bandeiras de países.",obs:"",regras:"Preparação: espalhe as peças com as faces coloridas visíveis. As bandeiras do mundo têm padrões geométricos e cores únicas que facilitam a montagem por região visual.\n\nObjetivo: montar o quebra-cabeça revelando bandeiras de países e, ao completar, identificar cada bandeira e o país correspondente.\n\nComo jogar: MONTAGEM: comece pelas bordas e pelas bandeiras mais reconhecíveis (Brasil — verde com losango amarelo; Japão — branco com círculo vermelho). Agrupe peças de bandeiras com cores similares. DESAFIO DE IDENTIFICAÇÃO após montagem: cobrir o nome abaixo de cada bandeira e ver quantas consegue nomear de memória. JOGO DE GEOGRAFIA: após montar, o professor aponta aleatoriamente para uma bandeira e os alunos competem para identificar o país. Dificuldade variada: bandeiras da África são desafiadores; Escandinávia compartilha o padrão de cruz.\n\nFim da atividade: anote quantas bandeiras foram identificadas corretamente e tente superar na próxima sessão! O quebra-cabeça montado serve como material visual de referência para a turma durante o trimestre de conteúdo de países e capitais."},
  {id:"990.202",nome:"Quebra-cabeça Corpo Humano",editora:"—",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Todos",comp:"Peças de quebra-cabeça com ilustração anatomica.",obs:"",regras:"Preparação: espalhe as peças e identifique as regiões: cabeça, tronco e membros têm texturas e cores diferentes na ilustração anatômica. Estratégia: comece pelo contorno do corpo (bordas) e monte por sistema (esquelético, muscular, circulatório).\n\nObjetivo: montar o quebra-cabeça revelando a ilustração anatômica do corpo humano e usar a imagem completa para aprendizado de ciências.\n\nComo jogar: MONTAGEM: trabalhe de forma colaborativa dividindo por regiões do corpo. O contorno externo do corpo é o mais fácil; os órgãos internos requerem mais atenção aos detalhes de cor. APÓS A MONTAGEM — JOGO EDUCATIVO: o professor aponta para diferentes partes e os alunos competem para nomear o órgão ou sistema correto. Sistemas identificáveis: digestório (estômago, intestinos), circulatório (coração, artérias), respiratório (pulmões, traqueia), nervoso (cérebro), esquelético (costelas, coluna). DESAFIO DE FUNÇÃO: além de nomear, descreva a função principal de cada órgão apontado.\n\nFim da atividade: o quebra-cabeça montado vira material pedagógico visual para a unidade de corpo humano! Atividade ideal para Y3-Y5 como revisão antes de provas ou como introdução a novos sistemas."},
  {id:"990.203",nome:"Quebra-cabeça Animais Extintos",editora:"—",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Todos",comp:"Peças com ilustrações de animais extintos.",obs:"",regras:"Preparação: espalhe as peças com as faces ilustradas visíveis. A cena mostra múltiplos animais extintos em seus habitats naturais — paisagens do Pleistoceno, florestas tropicais extintas e oceanos pré-históricos.\n\nObjetivo: montar o quebra-cabeça revelando uma cena com animais extintos e usar a ilustração para aprender sobre extinção, evolução e conservação da biodiversidade.\n\nComo jogar: MONTAGEM: comece pelo contorno e pelas áreas de cor uniforme (céu, terra). Os animais extintos têm formas únicas que facilitam localizar as peças correspondentes. IDENTIFICAÇÃO APÓS MONTAGEM: tente nomear cada animal visível na cena — Dodo (ilha Maurício, extinção por caça humana séc.XVII), Tigre-de-Tasmânia (Austrália), Mamute-Lanoso (Era do Gelo), Pássaro Elefante (Madagascar). DEBATE EDUCATIVO: 'Por que cada espécie foi extinta? O que os humanos poderiam ter feito diferente?' Conecte com espécies em risco de extinção hoje.\n\nFim da atividade: a imagem montada serve como ponto de partida para discussão sobre a 6ª Extinção em Massa atual e as ações humanas que podem preservar ou destruir espécies. Excelente para aulas de ciências, biologia e educação ambiental."},
  {id:"990.204",nome:"Quebra-cabeça Dinossauros",editora:"—",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Y1-Y3",comp:"Peças com ilustrações de dinossauros.",obs:"",regras:"Preparação: espalhe as peças e identifique as regiões por cor dominante: vegetação pré-histórica (verdes), dinossauros (cinzas, marrons e verdes), céu e vulcões ao fundo.\n\nObjetivo: montar o quebra-cabeça revelando uma cena do período Cretáceo/Jurássico e usar a ilustração para aprender sobre os diferentes tipos de dinossauros.\n\nComo jogar: MONTAGEM: comece pelas bordas e pelo céu, depois os dinossauros — cada espécie tem forma e textura únicos. IDENTIFICAÇÃO DOS DINOSSAUROS após montagem: Tiranosaurus Rex (dentes enormes, braços curtos), Triceratops (3 chifres, colarinho ósseo), Brontossauro (longo pescoço), Velociraptores (em bando, menores), Pterossauros (voadores, não são tecnicamente dinossauros). CURIOSIDADES: 'Qual era carnívoro? Qual herbívoro? Qual viveu no Jurássico e qual no Cretáceo?' DESAFIO DE TAMANHO: 'Qual o maior da cena? Qual o mais rápido?' Conecte com o Super Trunfo de Dinossauros também no acervo!\n\nFim da atividade: a cena montada pode ser exposta na sala durante a unidade de paleontologia em Y1-Y3. Desperta curiosidade natural das crianças por esta época fascinante da Terra."},
  {id:"990.205",nome:"Quebra-cabeça Capivara Club",editora:"—",cat:"Quebra-Cabeça",idade:"6+",jog:"1+",anos:"Y1-Y3",comp:"Peças com ilustrações temáticas de capivaras.",obs:"",regras:"Preparação: espalhe as peças do Capivara Club coloridas e divertidas. A cena é em estilo cartoon com cores vibrantes — mais fácil de montar que quebra-cabeças realistas.\n\nObjetivo: montar o quebra-cabeça da cena das capivaras e usar a imagem completa como ponto de partida para criatividade e narrativa colaborativa.\n\nComo jogar: MONTAGEM RELAXADA: esta é uma atividade de descanso mental e concentração leve — ideal para breaks entre atividades intensas. Trabalhe sozinho ou em grupo informalmente. Capivaras em estilo cartoon têm formas definidas que facilitam localizar as peças corretas. APÓS A MONTAGEM — NARRATIVA CRIATIVA: observe a cena completa e em grupo crie uma história: 'O que estão fazendo as capivaras? Onde estão? O que acontece depois?' Cada aluno acrescenta 1-2 frases à história coletiva. CONEXÃO CULTURAL: por que a capivara virou símbolo na internet brasileira? Explore o humor e a identidade cultural!\n\nFim da atividade: guarde o quebra-cabeça montado na caixa cuidadosamente para a próxima vez! A atividade serve como descompressão saudável entre blocos de estudo — alunos voltam mais focados após atividades lúdicas como esta."},
  {id:"990.206",nome:"Qual é a Regra?",editora:"—",cat:"Comunicação",idade:"8+",jog:"3+",anos:"Y4-Y5",comp:"Cartas com sequencias e padroes, instrucoes.",obs:"",regras:"Preparação: defina 1 jogador como CRIADOR DA REGRA para a rodada (rotaciona). Os demais são DESCOBRIDORES. O Criador pensa secretamente em uma regra simples mas não trivial e anota no papel sem mostrar — ex.: somente números pares; somente palavras com animais; somente coisas que existem no espaço sideral.\n\nObjetivo: descobrir a regra secreta do Criador propondo sequências e interpretando as respostas para refinar as hipóteses com pensamento lógico dedutivo.\n\nComo jogar: os Descobridores propõem sequências/exemplos um de cada vez. O Criador responde ACEITO (a proposição segue a regra) ou RECUSO (não segue). Após cada resposta, todos refinam suas hipóteses. Quando um Descobridor acreditar saber a regra, declara: 'Conheço a regra!' e a enuncia exatamente. O Criador confirma ou nega. VARIAÇÕES: o Criador pode criar regras gradualmente mais complexas (somente coisas vermelhas → somente coisas vermelhas comestíveis → somente coisas vermelhas comestíveis e redondas). O número de propostas antes de acertar define a pontuação (menos propostas = mais pontos).\n\nFim e vitória: Descobridor que acertar a regra com menos propostas ganha mais pontos. Após todos serem Criadores, some os pontos. Excelente exercício de pensamento lógico indutivo e dedutivo!"},
  {id:"990.207",nome:"Novo Master Júnior",editora:"Grow",cat:"Conhecimento",idade:"6+",jog:"2-6",anos:"Y1-Y3",comp:"155 cartas nível fácil, 45 cartas médio, 24 cartas de desafio, 4 peões, 1 tabuleiro, 12 fichas bônus verdes, 4 fichas bônus azuis.",obs:"",regras:"Preparação: posicione o tabuleiro no centro com os peões na largada. Separe as cartas nas 3 pilhas por nível: FÁCIL (verde — 155 cartas), MÉDIO (azul — 45 cartas) e DESAFIO (vermelho — 24 cartas). Distribua as fichas bônus verdes e azuis ao lado. Defina a ordem dos turnos.\n\nObjetivo: percorrer o tabuleiro respondendo perguntas de 3 níveis de dificuldade sobre temas do cotidiano infantil e completar o percurso com ao menos 1 pergunta de cada nível respondida corretamente.\n\nComo jogar: role o dado e avance pelo tabuleiro. A casa indica o nível da pergunta (cor correspondente). Outro jogador lê a pergunta no nível indicado. Temas: animais (habitat, alimentação), natureza (plantas, clima), espaço (planetas, estrelas), filmes animados (personagens, tramas), música (artistas, instrumentos) e cotidiano (profissões, objetos). Acertou: avance 1 casa extra + ganhe a ficha bônus correspondente se for nível médio ou desafio. Errou: ouça a resposta e fique no lugar. As perguntas têm linguagem adaptada para Y1-Y3 com vocabulário acessível.\n\nFim e vitória: o primeiro a completar o percurso tendo respondido corretamente ao menos 1 pergunta de cada nível (fácil, médio e desafio) vence o torneio de Novo Master Júnior!"},
  {id:"990.208",nome:"Lig 4",editora:"Hasbro",cat:"Estratégia",idade:"6+",jog:"2",anos:"Todos",comp:"Grade vertical colorida, 42 fichas (21 de cada cor), suporte.",obs:"",regras:"Preparação: posicione a grade vertical plástica no centro com o suporte estável. Distribua as 21 fichas vermelhas para um jogador e as 21 amarelas para o outro. As fichas entram pela parte superior de cada uma das 7 colunas e caem pela gravidade, empilhando-se de baixo para cima.\n\nObjetivo: ser o primeiro a conectar 4 fichas da sua cor em linha consecutiva — horizontal, vertical ou diagonal.\n\nComo jogar: os jogadores se alternam, soltando 1 ficha por turno em qualquer uma das 7 colunas. A ficha cai e se posiciona na primeira posição disponível de baixo para cima naquela coluna. PENSAMENTO DUAL: a cada jogada, considere simultaneamente CRIAR uma linha de 4 suas E BLOQUEAR uma linha de 4 do adversário. Se o adversário tiver 3 em linha com espaço aberto: bloqueie imediatamente. ARMADILHAS: criar 2 ameaças simultâneas (2 posições abertas que completariam 4) é a jogada mais poderosa — o adversário só pode bloquear uma. Colunas cheias (7 fichas) não podem mais receber fichas.\n\nFim e vitória: o primeiro a completar 4 em linha (horizontal, vertical ou diagonal) vence e anuncia as 4 fichas conectadas! Se o tabuleiro encher sem vencedor: empate. Jogue múltiplas partidas — alternando quem começa."},
  {id:"990.209",nome:"Pensando em Inglês",editora:"—",cat:"Palavras",idade:"8+",jog:"2+",anos:"Todos",comp:"Cartas de vocabulario e frases em inglês, instrucoes bilíngues.",obs:"",regras:"Preparação: o jogo é versátil — escolha um dos modos dependendo do nível e do objetivo. Separe as cartas por nível de vocabulário (básico, intermediário) se indicado. Decida o modo de jogo com o grupo.\n\nObjetivo: praticar e ampliar o vocabulário em inglês de forma divertida e dinâmica em múltiplos formatos de jogo.\n\nComo jogar — MODO MEMÓRIA (Inglês-Português): distribua cartas viradas com palavras em inglês e português; encontre os pares combinando os idiomas. — MODO ADIVINHAÇÃO: um jogador pega uma carta com uma palavra em inglês e descreve o significado em inglês simples (não pode falar português) enquanto os outros tentam adivinhar; quem adivinhar pontua. — MODO TRILHA: avance pelo tabuleiro de vocabulário respondendo perguntas (tradução, uso em frase, sinônimo) conforme a casa. — MODO FLASH: um jogador mostra a carta por 3 segundos; quem gritar a tradução correta ganha o ponto. — MODO PRODUÇÃO: use as palavras para criar frases em inglês — pontos por frases gramaticalmente corretas.\n\nFim e vitória: varia conforme o modo escolhido. Excelente recurso complementar para aulas de inglês em Y1-Y5, adaptável para qualquer nível linguístico!"},
  {id:"990.210",nome:"Pocket Mars I",editora:"—",cat:"Estratégia",idade:"10+",jog:"1-5",anos:"Y4-Y5",comp:"25 cartas de acao, tokens de recurso, marcadores de colonia.",obs:"",regras:"Preparação: distribua as 25 cartas de ação igualmente entre os jogadores (ou em pilha acessível a todos no modo solo). Posicione os tokens de recurso (oxigênio, água, energia) no banco central. Coloque os marcadores de colônia no ponto de partida de cada jogador.\n\nObjetivo: ser o primeiro a completar seu programa de colonização de Marte construindo os módulos de habitação exigidos com os recursos corretos.\n\nComo jogar: na sua vez, jogue 1 ou mais cartas de ação. Cada carta permite coletar recursos do banco central ou usar recursos para construir módulos. RECURSOS: Oxigênio (O₂), Água (H₂O) e Energia são os 3 tipos básicos — módulos diferentes exigem combinações específicas. AÇÕES ESPECIAIS: algumas cartas permitem copiar a ação de ação de outro jogador já executada naquele turno; outras bloqueiam temporariamente um recurso de outro jogador; uma permite reabastecer todos os recursos de uma vez. MODO SOLO: jogue contra um conjunto de regras do sistema que define a taxa de recursos disponíveis a cada turno.\n\nFim e vitória: o primeiro a construir todos os módulos necessários para seu programa de colonização (definidos na carta de missão inicial) vence e estabelece a primeira colônia humana em Marte!"},
  {id:"990.211",nome:"Pocket Mars II",editora:"—",cat:"Estratégia",idade:"10+",jog:"1-5",anos:"Y4-Y5",comp:"25 cartas de acao, tokens de recurso, marcadores de colonia.",obs:"2ª cópia",regras:"Mesmas regras do Pocket Mars I (990.210). 2a copia disponivel."},
  {id:"990.212",nome:"A Fake Artist Goes to New York",editora:"Oink Games",cat:"Comunicação",idade:"8+",jog:"5-10",anos:"Y4-Y5",comp:"Bloco de papel para desenho coletivo, canetas coloridas, cartas de categoria, carta X (impostor).",obs:"",regras:"Preparação: o Game Master escolhe uma categoria temática de Nova York (ex.: 'coisas em Manhattan', 'transporte nova-iorquino') e escreve uma palavra específica nas cartas de TODOS os jogadores — exceto 1, que recebe X (o Impostor). Coloque o bloco de papel coletivo ao centro.\n\nObjetivo: Artistas querem identificar o Impostor; o Impostor quer passar despercebido ou adivinhar a palavra após ser descoberto.\n\nComo jogar: o desenho coletivo se forma com temas nova-iorquinos: táxis amarelos, arranha-céus, Central Park, a Estátua da Liberdade, o metrô, etc. Em ordem, cada jogador contribui com EXATAMENTE 1 traço contínuo sem tirar a caneta do papel — representando a palavra secreta (ou fingindo saber qual é). O Impostor imita o estilo dos outros tentando parecer que conhece a palavra. Após 2 rodadas de traços, todos observam o desenho coletivo e votam simultaneamente em quem é o Impostor. RESULTADO: maioria identificou o Impostor → ele tenta adivinhar a palavra como última chance. Se acertar: Impostor vence! Se errar: Artistas vencem.\n\nFim e vitória: Artistas vencem se o Impostor for identificado E não adivinhar a palavra. Impostor vence se não for identificado ou se adivinhar corretamente a palavra na última chance!"},
  {id:"990.213",nome:"Pics Bio Normal",editora:"—",cat:"Comunicação",idade:"8+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas de imagens biologicas, instrucoes.",obs:"",regras:"Preparação: embaralhe as cartas de imagens biológicas. Divida em 2 equipes. O comunicador de cada rodada pega uma carta-conceito secreta. Grade de imagens disponíveis fica acessível a todos. Timer configurado para 60 segundos.\n\nObjetivo: comunicar conceitos de biologia geral selecionando imagens da grade sem palavras, para a equipe identificar o conceito no menor tempo possível.\n\nComo jogar: o comunicador vê o conceito-alvo (ex.: Cadeia Alimentar, Divisão Celular, Fotossíntese) e seleciona imagens da grade que, combinadas visualmente, representam aquele conceito. Sem falar, gesticular ou escrever — apenas apontar para as imagens escolhidas sequencialmente. A equipe debate livremente e tenta nomear o conceito. PONTUAÇÃO POR VELOCIDADE: acertar em até 20s = 3 pts; 21-40s = 2 pts; 41-60s = 1 pt; não acertar = 0. Conceitos cobertos: Ecologia (cadeias alimentares, biomas, ciclos), Célula (mitose, meiose, organelas), Anatomia (sistemas corporais), Genética (hereditariedade, DNA), Evolução.\n\nFim e vitória: após igual número de rodadas por equipe, some os pontos. A equipe com mais pontos vence e é a melhor comunicadora visual de conceitos biológicos!"},
  {id:"990.214",nome:"Pics Financeiro",editora:"—",cat:"Comunicação",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas de imagens sobre educação financeira.",obs:"",regras:"Preparação: embaralhe as cartas com imagens relacionadas à educação financeira. Divida em 2 equipes. O comunicador da rodada pega uma carta-conceito financeiro secreta. As imagens da grade ficam visíveis para todos. Timer de 60 segundos.\n\nObjetivo: comunicar conceitos de educação financeira usando imagens sem palavras, desenvolvendo o vocabulário financeiro de forma visual e criativa.\n\nComo jogar: o comunicador vê o conceito-alvo (ex.: Poupança, Investimento, Juros Compostos, Orçamento Familiar, Consumo Consciente, Endividamento) e seleciona imagens da grade que, combinadas, representam aquele conceito sem falar. A equipe tenta nomear o conceito financeiro em 60 segundos. Pontuação por velocidade: menos de 20s = 3 pts; até 40s = 2 pts; até 60s = 1 pt. Conceitos abordados: Receita vs Despesa, Poupança, Investimento (renda fixa, variável), Juros simples e compostos, Orçamento, Endividamento, Consumo x Necessidade.\n\nFim e vitória: após igual número de rodadas, a equipe com mais pontos vence! Ferramenta poderosa para introdução à educação financeira de forma lúdica — conecta com matemática, cidadania e projetos interdisciplinares de Y4-Y5."},
  {id:"990.215",nome:"Pics Financeiro Go",editora:"—",cat:"Comunicação",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Versão compacta do Pics Financeiro.",obs:"",regras:"Preparação: versão compacta do Pics Financeiro com menos cartas — ideal para atividades rápidas de 10-15 minutos. Mesma dinâmica do original, apenas em formato reduzido. Divida em 2 equipes ou jogue individualmente como desafio de tempo.\n\nObjetivo: comunicar conceitos financeiros selecionando imagens da grade sem palavras, em versão de bolso para atividades rápidas e dinâmicas.\n\nComo jogar: mesmas regras do Pics Financeiro completo — comunicador seleciona imagens para representar um conceito financeiro (Poupança, Investimento, Orçamento, Dívida, etc.); equipe tenta identificar em 60 segundos; pontuação por velocidade. O formato compacto torna este jogo ideal para: abertura dinâmica de aula (10 min), break entre atividades, lição de casa gamificada, ou para levar em viagem de estudos.\n\nFim e vitória: após todas as cartas ou número definido de rodadas, some os pontos. A equipe com mais pontos vence o mini-torneio financeiro! O formato Go é perfeito para tornar a educação financeira um hábito frequente em vez de um evento esporádico."},
  {id:"990.216",nome:"Alphabet Flashcards",editora:"—",cat:"Palavras",idade:"5+",jog:"1+",anos:"Y1-Y3",comp:"26 cartas do alfabeto ingles com palavra e imagem ilustrativa para cada letra.",obs:"",regras:"Preparação: organize as 26 cartas (A-Z) — cada uma mostra a letra maiúscula e minúscula, uma palavra em inglês e uma ilustração colorida correspondente. Escolha um dos modos de uso conforme o objetivo da atividade.\n\nObjetivo: desenvolver o conhecimento do alfabeto em inglês, a associação letra-palavra e a pronúncia dos sons através de atividades variadas e interativas.\n\nComo jogar — MODO SEQUÊNCIA: embaralhe todas as cartas; o desafio é organizá-las em ordem A-Z no menor tempo possível. MODO MEMÓRIA: distribua as cartas viradas; encontre pares de cartas com a mesma letra (uma mostra só a letra, outra mostra a palavra+imagem). MODO PRONÚNCIA: o professor ou aluno mais avançado mostra cada carta e todos praticam a pronúncia da letra e da palavra em voz alta. MODO CORRIDA: divida o grupo em 2 equipes; o professor diz uma letra em inglês, primeiro time a pegar a carta correta ganha o ponto. MODO PRODUÇÃO ORAL: 'Tell me 3 words that start with B' — treinamento de vocabulário espontâneo.\n\nFim da atividade: as cartas servem como material de referência fixo na sala de aula ou como material individual para estudo em casa!"},
  {id:"990.217",nome:"Palavras Rápidas",editora:"—",cat:"Palavras",idade:"8+",jog:"2+",anos:"Todos",comp:"Cartas de criterios, ampulheta ou timer.",obs:"",regras:"Preparação: embaralhe as cartas de critérios em pilha no centro. Defina o tempo por rodada (ampulheta ou timer de 30-60 segundos). Todos os jogadores ficam atentos, prontos para competir.\n\nObjetivo: dizer o maior número de palavras válidas que se encaixem no critério da carta revelada para acumular pontos ao longo das rodadas.\n\nComo jogar: vire a carta do topo revelando um critério vocabular (ex.: palavras que terminam em -ão, nomes de países europeus, animais com mais de 4 pernas, coisas encontradas numa cozinha, profissões que começam com M). Assim que o critério for revelado, todos competem simultaneamente para gritar palavras válidas uma de cada vez — primeiro que disser uma palavra válida marca 1 ponto e a palavra é eliminada para aquela rodada. Palavras inválidas ou repetidas = 0 pt e pode ser contestada pelo grupo. Continua até o tempo acabar ou até ninguém mais conseguir. MODO TURNO: cada jogador tem 15 segundos para citar 1 palavra válida do critério; passa a vez se não conseguir.\n\nFim e vitória: após um número combinado de rodadas, some os pontos. Quem acumular mais pontos com vocabulário mais extenso e raciocínio mais rápido vence o torneio de Palavras Rápidas!"},
  {id:"990.218",nome:"Senha II",editora:"—",cat:"Estratégia",idade:"8+",jog:"2",anos:"Y4-Y5",comp:"Tabuleiro de mastermind, pinos coloridos, pinos de feedback.",obs:"",regras:"Mesmas regras do Senha I (990.143). 2a copia para jogar com mais turmas simultaneamente."},
  {id:"990.219",nome:"Senha III",editora:"—",cat:"Estratégia",idade:"8+",jog:"2",anos:"Y4-Y5",comp:"Tabuleiro de mastermind, pinos coloridos, pinos de feedback.",obs:"",regras:"Mesmas regras do Senha I (990.143). 3a copia disponivel."},
  {id:"990.220",nome:"Código Secreto",editora:"—",cat:"Comunicação",idade:"10+",jog:"4+",anos:"Y4-Y5",comp:"Cartas de palavras em grade 5x5, cartas-chave de agentes, instrucoes.",obs:"",regras:"Preparação: disponha 25 cartas de palavras em grade 5x5 no centro. Os 2 líderes (um por time) olham juntos a carta-chave secreta que mostra quais das 25 palavras pertencem a cada time (8-9 por time), quais são neutras e QUAL é o Assassino. Os agentes dos 2 times ficam do outro lado sem ver a carta-chave.\n\nObjetivo: ser o primeiro time a identificar corretamente todas as suas palavras-agente, sem tocar nas do adversário e NUNCA na palavra do Assassino.\n\nComo jogar: os líderes se alternam dando dicas: UMA ÚNICA PALAVRA + um NÚMERO (ex.: 'Oceano: 3' significa que 3 das palavras visíveis se conectam com o conceito de Oceano). O time debate livremente e toca nas palavras que acredita serem as suas — guiado pela dica do líder. Palavra do time: mantenha e continue (pode tentar até o número dado + 1). Palavra neutra: termine o turno sem perder. Palavra do time adversário: termine o turno e ainda ajudou o inimigo! Palavra do ASSASSINO: derrota imediata do time!\n\nFim e vitória: o primeiro time a identificar todas as suas palavras-agente vence o duelo de espionagem em português!"},
  {id:"990.221",nome:"War II",editora:"Grow",cat:"Estratégia",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Tabuleiro mapa-mundi, exercitos coloridos, dados, missoes secretas.",obs:"2ª cópia",regras:"Mesmas regras do War (990.126). 2a copia para grupos maiores ou quando o primeiro esta em uso."},
  {id:"990.222",nome:"Scotland Yard",editora:"Ravensburger",cat:"Estratégia",idade:"10+",jog:"3-6",anos:"Y4-Y5",comp:"Mapa de Londres com estacoes de transporte, fichas de transporte (taxi, onibus, metro), tokens de pistas, tabuleiro de registro, peons.",obs:"",regras:"Preparação: abra o mapa de Londres com suas centenas de estações numeradas conectadas por taxi (amarelo), ônibus (verde) e metrô (preto/vermelho). Um jogador escolhe ser Mr. X (posição inicial secreta) — recebe o bloco de registro secreto. Os outros (2-5 detetives) posicionam seus peões em estações iniciais indicadas. Distribua fichas de transporte para todos.\n\nObjetivo: Mr. X deve sobreviver 22 rodadas sem ser capturado pelos detetives; os detetives devem encurralar Mr. X parando exatamente na mesma estação que ele.\n\nComo jogar: TURNO DOS DETETIVES: todos se movem abertamente pelo mapa, anunciando para onde vão e usando fichas de transporte correspondentes. Coordenam verbalmente para cercar Mr. X. TURNO DE MR. X: move-se secretamente, anotando apenas no bloco e revelando apenas QUAL MEIO usou (taxi/ônibus/metrô) — mas NÃO para onde. Nas rodadas 3, 8, 13, 17 e 21: Mr. X DEVE revelar brevemente sua posição atual no mapa (todos veem), mas continua se movendo em segredo depois. Se Mr. X ficar sem fichas de transporte, não pode mais se mover.\n\nFim e vitória: detetives vencem se algum deles parar na mesma estação que Mr. X a qualquer momento. Mr. X vence se sobreviver toda a rodada 22 sem ser capturado — fuga bem-sucedida!"},
  {id:"990.223",nome:"Quebra-cabeça 350 Peças – Cachorros",editora:"—",cat:"Quebra-Cabeça",idade:"8+",jog:"1+",anos:"Todos",comp:"350 peças.",obs:"",regras:"Preparação: espalhe as 350 peças com as faces coloridas visíveis. Com 350 peças, esta é uma atividade de médio-longo prazo — planeje pelo menos 1-2 horas para completar individualmente ou 45 min em grupo de 3-4 pessoas.\n\nObjetivo: montar o quebra-cabeça revelando a ilustração com cachorros de diversas raças e usar a imagem para identificar e aprender sobre as diferentes raças.\n\nComo jogar: ESTRATÉGIA DE MONTAGEM: com 350 peças, a organização é essencial. Separe: bordas (lados retos), fundos de uma cor (ex.: fundo branco, gramado), e grupos de peças por raça de cachorro (pelagem, cor, formato). Trabalhe um cachorro de cada vez. Em grupo: divida as raças entre os participantes, cada um monta seu cachorro separadamente e encaixam na imagem final. APÓS A MONTAGEM: tente identificar as raças presentes (Golden Retriever, Pastor Alemão, Beagle, Dálmata, Husky, Bulldog, Poodle, etc.). DESAFIO: pesquise a origem e características de 3 raças que aparecem.\n\nFim da atividade: celebre a conclusão coletiva! Com 350 peças, cada quebra-cabeça montado é uma conquista que desenvolve paciência, concentração e trabalho em equipe."},
  {id:"990.224",nome:"Quebra-cabeça 350 Peças – Capivara",editora:"—",cat:"Quebra-Cabeça",idade:"8+",jog:"1+",anos:"Todos",comp:"350 peças.",obs:"",regras:"Preparação: espalhe as 350 peças coloridas e divertidas do quebra-cabeça da capivara. A cena em estilo cartoon ou fotográfica tende a ter regiões de cores específicas que facilitam a organização das peças.\n\nObjetivo: montar o quebra-cabeça de 350 peças da capivara em grupo ou individualmente, celebrando o animal mais zen do Brasil.\n\nComo jogar: MONTAGEM: comece pelas bordas, depois identifique os elementos principais — a capivara em destaque, o fundo aquático ou de gramado, outros elementos decorativos. Com 350 peças, é uma atividade de concentração média-alta que pode ser feita em 1 sessão ou dividida em etapas. COLABORAÇÃO: em grupo de 3-4 pessoas, divida as regiões da imagem — um faz as bordas, outro o corpo da capivara, outro o fundo. CURIOSIDADE CULTURAL: por que a capivara virou fenômeno de internet no Brasil? Discuta como este animal sossegado e sociável se tornou símbolo da positividade e do 'modo capivara de viver'.\n\nFim da atividade: monte, fotografe e comemore! Este quebra-cabeça é uma atividade de descompressão e alegria coletiva. A capivara agradece e fica relaxada do seu jeito clássico."},
  {id:"990.225",nome:"Tapple",editora:"USAopoly",cat:"Palavras",idade:"8+",jog:"2+",anos:"Todos",comp:"Roda giratoria de letras (Tapple), timer incorporado.",obs:"",regras:"Preparação: coloque a roda Tapple no centro da mesa ao alcance de todos os jogadores. A roda tem botões de letras ao redor e um timer central incorporado. Defina quantos pontos são necessários para vencer a partida (normalmente 3 categorias vencidas).\n\nObjetivo: ser o último jogador restante na rodada acumulando 3 vitórias de categoria para vencer o campeonato Tapple.\n\nComo jogar: o primeiro jogador pressiona o TIMER da roda que começa uma contagem regressiva de 10 segundos. Em seguida, gira ou vira a carta de CATEGORIA (ex.: 'Animais'). O mesmo jogador deve imediatamente pressionar qualquer botão de LETRA na roda (trava a letra) e dizer uma palavra válida da categoria começando com aquela letra. Passa rapidamente para o próximo! Cada jogador pressiona uma letra diferente (letras travadas não podem ser usadas novamente) e diz 1 palavra válida. Se o timer acabar antes de você responder: você é ELIMINADO daquela rodada. Última pessoa restante vence o ponto da categoria.\n\nFim e vitória: quando um jogador acumular o número definido de vitórias de categoria (geralmente 3), ele vence o torneio Tapple! Cada rodada é rápida e intensa — dura apenas alguns minutos."},
  {id:"990.226",nome:"Xalingo Torres",editora:"Xalingo Brinquedos",cat:"Habilidade Motora",idade:"5+",jog:"2+",anos:"Y1-Y3",comp:"Blocos coloridos de formas variadas para construcao de torres.",obs:"",regras:"Preparação: separe os blocos coloridos de formas variadas por tipo (cilíndros, cubos, retângulos, formas especiais). Embaralhe as cartas de desafio. Cada jogador recebe o mesmo conjunto de blocos para garantir igualdade.\n\nObjetivo: construir torres ou estruturas que atendam ao desafio da carta com a maior fidelidade possível — ou simplesmente a mais alta sem cair!\n\nComo jogar — MODO DESAFIO: vire uma carta de desafio que mostra uma estrutura específica a ser replicada (torre em espiral, estrutura em L, ponte entre dois pontos, torre mais alta possível com somente cubos). Todos têm 2 minutos para construir usando os blocos disponíveis. Ao final: compare com a ilustração da carta. Pontuação: 3 pts = replicou fielmente; 2 pts = muito parecido; 1 pt = tentou mas diferiu bastante. — MODO ALTURA: todos constroem a torre mais alta que conseguirem sem cair. Quem tiver a torre mais alta de pé ao final de 3 minutos vence. — MODO LIVRE: construção totalmente criativa sem regras — crie qualquer estrutura imaginária e apresente ao grupo.\n\nFim e vitória: some os pontos dos desafios completados. Quem teve a maior pontuação (ou a torre mais alta no modo altura) vence o campeonato de arquitetura Xalingo!"},
  {id:"990.227",nome:"Pics City",editora:"—",cat:"Comunicação",idade:"10+",jog:"2-6",anos:"Y4-Y5",comp:"Cartas com imagens urbanas e de cidades.",obs:"",regras:"Preparação: embaralhe as cartas com imagens urbanas. Divida em 2 equipes. O comunicador pega uma carta-conceito urbano secreta. A grade de imagens disponíveis fica visível para todos. Timer de 60 segundos pronto.\n\nObjetivo: comunicar conceitos de urbanismo e vida em cidade usando imagens sem palavras para a equipe identificar o conceito no menor tempo possível.\n\nComo jogar: o comunicador vê o conceito-alvo (ex.: Mobilidade Urbana, Especulação Imobiliária, Áreas Verdes, Desigualdade Social, Patrimônio Histórico, Sustentabilidade na Cidade) e seleciona imagens da grade que representem esse conceito visualmente — sem falar ou escrever. A equipe debate livremente e tenta nomear o conceito em 60 segundos. Pontuação por velocidade: menos de 20s = 3 pts; até 40s = 2 pts; até 60s = 1 pt.\n\nFim e vitória: após igual número de rodadas para cada equipe, some os pontos. A equipe com mais pontos vence! Excelente para projetos interdisciplinares de Geografia, Cidadania e Sustentabilidade — cada conceito identificado pode virar tema de debate mais aprofundado em sala."},
  {id:"990.228",nome:"Viagem no Tempo",editora:"—",cat:"Conhecimento",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Cartas com eventos históricos, linha do tempo, tokens.",obs:"",regras:"Preparação: espalhe a linha do tempo (trilha cronológica) no centro da mesa. Separe as cartas de eventos históricos em pilha embaralhada. Distribua tokens de apostas para cada jogador. Defina o número de rodadas (geralmente 10-15 eventos).\n\nObjetivo: construir coletivamente a linha do tempo da história posicionando eventos no lugar certo cronologicamente e apostando nas posições corretas para acumular pontos.\n\nComo jogar: a cada rodada, vire 1 carta de evento histórico — pode ser uma batalha, uma descoberta científica, um marco social ou uma catástrofe natural. Cada jogador secretamente aposta em qual posição da linha do tempo aquele evento se encaixa (antes ou depois de eventos já posicionados). Quando todos reverem as apostas simultaneamente, confira com a data impressa no verso da carta. Quem apostou corretamente ganha tokens. O evento é então posicionado permanentemente na linha do tempo. Eventos abrangem da Pré-História ao séc. XXI: Revolução Industrial, Descobrimento do Brasil, Primeira e Segunda Guerra, chegada à Lua, queda do Muro de Berlim e muito mais.\n\nFim e vitória: após todas as rodadas, some os tokens acumulados. Quem posicionou mais eventos corretamente vence a viagem no tempo!"},
  {id:"990.229",nome:"Trilhas Urbanas II",editora:"Pistache Editorial",cat:"Tabuleiro",idade:"8+",jog:"2-6",anos:"Todos",comp:"Mesmos componentes de Trilhas Urbanas com novos cenários.",obs:"2ª cópia / expansão",regras:"Mesmas regras do Trilhas Urbanas (990.098) com novos cenarios urbanos e desafios. 2a copia ou expansao para grupos maiores e novas jornadas de planejamento colaborativo pela cidade!"},
  {id:"990.230",nome:"Lig 4 II",editora:"Hasbro",cat:"Estratégia",idade:"6+",jog:"2",anos:"Todos",comp:"Grade vertical, fichas coloridas.",obs:"2ª cópia",regras:"Mesmas regras do Lig 4 (990.208). 2a copia para jogar em paralelo ou ter sobressalente."},
  {id:"990.231",nome:"Palavras Cruzadas II",editora:"Xalingo Brinquedos",cat:"Palavras",idade:"8+",jog:"2-4",anos:"Y4-Y5",comp:"Tabuleiro, pedras de letras, suportes.",obs:"2ª cópia",regras:"Mesmas regras do Palavras Cruzadas (990.008). 2a copia para atividades com turmas maiores."},
  {id:"990.232",nome:"Jenga II",editora:"Hasbro",cat:"Habilidade Motora",idade:"6+",jog:"1+",anos:"Todos",comp:"54 blocos de madeira.",obs:"2ª cópia",regras:"Mesmas regras do Jenga I (990.191). 2a copia disponivel."},
  {id:"990.233",nome:"Jogo da Memória: Turma da Mônica",editora:"MSP",cat:"Memória",idade:"4+",jog:"2-4",anos:"Y1-Y3",comp:"48 cartas (24 pares) com personagens da Turma da Mônica.",obs:"",regras:"Preparação: embaralhe as 48 cartas (24 pares com personagens da Turma da Mônica) e distribua viradas para baixo em grade 6x8 no centro. Todos devem conseguir alcançar as cartas. Defina a ordem de turnos — crianças mais novas podem começar.\n\nObjetivo: encontrar o maior número de pares de personagens idênticos usando memória de curto prazo para lembrar onde estão as cartas já reveladas.\n\nComo jogar: na sua vez, vire 2 cartas quaisquer da grade mostrando a face para todos. SE FOREM O MESMO PERSONAGEM (par!): guarde as 2 cartas como ponto e jogue NOVAMENTE — encadeie turnos enquanto acertar pares. SE FOREM PERSONAGENS DIFERENTES: vire ambas de volta exatamente nas mesmas posições e passe a vez. Personagens da Turma da Mônica: Mônica (muda de expressão?), Cebolinha (com ou sem a letra R?), Cascão (sujo ou limpo?), Magali (com melancia ou sem?), Chico Bento, Rosinha, Piteco e outros. Lembrar os detalhes de cada personagem ajuda a distinguir pares de perto.\n\nFim e vitória: quando todas as cartas forem emparelhadas, some os pares de cada jogador. Quem encontrou mais pares vence e é o maior fã da Turma da Mônica! Atividade ideal para Y1-Y2 como introdução ao jogo da memória."},
  {id:"990.234",nome:"Jogo do Mico: Turma da Mônica",editora:"MSP",cat:"Cartas",idade:"4+",jog:"2-6",anos:"Y1-Y3",comp:"101 cartas com personagens e o Cebolinha-Mico.",obs:"",regras:"Preparação: embaralhe as 101 cartas — há 50 pares de personagens da Turma da Mônica E 1 carta do Cebolinha-Mico (sem par). Distribua todas as cartas igualmente entre os jogadores (podem sobrar 1-2 para alguns; tudo bem). Cada jogador olha sua mão em segredo.\n\nObjetivo: se livrar de todas as cartas formando pares e passando o Cebolinha-Mico adiante — o jogador que ficar com o Mico no final perde!\n\nComo jogar: Primeiro, todos verificam suas cartas em segredo e descartam imediatamente todos os pares que já têm na mão (ex.: 2 cartas da Mônica = par descartado). Em seguida começa a rodada principal: o jogador à esquerda de quem distribui oferece sua mão virada para baixo ao vizinho direito. O vizinho retira 1 carta aleatória. Se completou um par: descarta imediatamente. Se não: mantém na mão. Assim o jogo circula continuamente — cada jogador oferece a mão ao vizinho, que retira 1 carta. Quando ficar sem cartas: você está salvo! Continue observando enquanto os outros jogam.\n\nFim e vitória: o jogo termina quando apenas 1 carta restar (o Cebolinha-Mico). O jogador que ficou com ela PERDEU a rodada! Na Turma da Mônica, é o Cebolinha segurando o R (em alusão ao seu jeito de falar) que representa o Mico."},
];

// ── Game Image Loader (Wikipedia API – CORS enabled) ──────
const imgCache = JSON.parse(localStorage.getItem('funix_imgs')||'{}');
// Clear cache when search strategy changes
if(localStorage.getItem('funix_imgs_v')<'8'){localStorage.removeItem('funix_imgs');Object.keys(imgCache).forEach(k=>delete imgCache[k]);localStorage.setItem('funix_imgs_v','8');}

const GAME_TERMS = /board[\s-]?game|card game|jogo de tabuleiro|jogo de cartas|jogo de dados|jogo de mesa|jogo tradicional|jogo recreativo|brinquedo|puzzle|dice game|party game|strategy game|abstract strategy|tabletop|tabuleiro|jogo clássico/i;

async function wikiSummary(lang, title, strict=false){
  try{
    const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
    if(!r.ok) return null;
    const d = await r.json();
    if(d.type==='disambiguation') return null;
    if(strict){
      const desc = (d.description||'').toLowerCase();
      const titleIsGame = /[_(](board.?game|card.?game|jogo|brinquedo)[_)]/i.test(title);
      if(!titleIsGame && !GAME_TERMS.test(desc)) return null;
    }
    return d.thumbnail?.source || d.originalimage?.source || null;
  }catch(e){return null;}
}

async function wikiSearch(lang, query, strict=true){
  try{
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=5`;
    const r = await fetch(url);
    const d = await r.json();
    const hits = d?.query?.search;
    if(!hits?.length) return null;
    const best = hits.find(h=>GAME_TERMS.test(h.title+' '+h.snippet));
    if(strict && !best) return null;
    return wikiSummary(lang, (best||hits[0]).title, strict);
  }catch(e){return null;}
}

// ── Request queue to avoid Wikipedia rate limiting ────────
const _fetchQueue = [];
let _queueRunning = false;
async function _runQueue(){
  if(_queueRunning) return;
  _queueRunning = true;
  while(_fetchQueue.length){
    const {name, resolve} = _fetchQueue.shift();
    resolve(await _doFetch(name));
    if(_fetchQueue.length) await new Promise(r=>setTimeout(r,400));
  }
  _queueRunning = false;
}
async function fetchImageFor(name){
  if(imgCache[name]!==undefined) return imgCache[name]||null;
  return new Promise(resolve=>{_fetchQueue.push({name,resolve});_runQueue();});
}
async function _doFetch(name){
  if(imgCache[name]!==undefined) return imgCache[name]||null;
  // Use local image if available — instant, no API needed
  if(LOCAL_IMGS[name]){
    imgCache[name]=LOCAL_IMGS[name];
    localStorage.setItem('funix_imgs',JSON.stringify(imgCache));
    return LOCAL_IMGS[name];
  }
  // No local image → show clock permanently, skip Wikipedia
  return null;
}

function setCardImg(el, url){
  if(!url) return;
  const img = document.createElement('img');
  img.src = url; img.alt = '';
  img.onerror = ()=>img.remove();
  el.appendChild(img);
}

function setHeroImg(url){
  const hero = document.getElementById('m-hero');
  if(hero) hero.innerHTML=`<img src="${url}" alt="" onerror="this.parentElement.innerHTML=this.parentElement.dataset.emoji">`;
}

const imgObserver = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(!e.isIntersecting) return;
    imgObserver.unobserve(e.target);
    const el = e.target, name = el.dataset.name;
    if(imgCache[name]) setCardImg(el, imgCache[name]);
    else if(imgCache[name]===undefined) fetchImageFor(name).then(url=>{if(url) setCardImg(el,url);});
  });
},{rootMargin:'100px'});

function loadCardImages(){
  document.querySelectorAll('.card-img[data-name]').forEach(el=>{
    const name = el.dataset.name;
    if(imgCache[name]) setCardImg(el, imgCache[name]);
    else imgObserver.observe(el);
  });
}

async function fetchHeroImage(name){
  const url = imgCache[name]!==undefined ? (imgCache[name]||null) : await fetchImageFor(name);
  if(url) setHeroImg(url);
}

// ── Filters ───────────────────────────────────────────────
const cats = ['Todos',...[...new Set(jogos.map(j=>j.cat))].sort()];

function buildFilters(){
  const cf = document.getElementById('cat-filters');
  cats.forEach(c=>{
    const b = document.createElement('button');
    b.className='chip'+(c==='Todos'?' on':'');
    b.textContent=c;
    b.onclick=()=>{activeCat=c;document.querySelectorAll('#cat-filters .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
    cf.appendChild(b);
  });
  const yf=document.getElementById('year-filters');
  ['Todos','Y1-Y3','Y4-Y5'].forEach(y=>{
    const b=document.createElement('button');
    b.className='chip'+(y==='Todos'?' on':'');
    b.textContent=y==='Todos'?'Todos':y;
    b.onclick=()=>{activeYear=y;document.querySelectorAll('#year-filters .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
    yf.appendChild(b);
  });
}

function toggleObs(){
  showObs=!showObs;
  document.getElementById('obs-btn').classList.toggle('on',showObs);
  render();
}

// ── Render ────────────────────────────────────────────────
function render(){
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = jogos.filter(j=>{
    if(activeCat!=='Todos' && j.cat!==activeCat) return false;
    if(activeYear!=='Todos' && j.anos!==activeYear) return false;
    if(showObs && !j.obs) return false;
    if(q && !`${j.nome} ${j.editora} ${j.cat} ${j.id}`.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('stats').textContent = filtered.length === jogos.length
    ? `${jogos.length} jogos`
    : `${filtered.length} de ${jogos.length} jogos`;
  const grid = document.getElementById('grid');
  if(!filtered.length){
    grid.innerHTML='<div class="empty"><h3>Nenhum jogo encontrado</h3><p>Tente outros termos ou limpe os filtros.</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(j=>`
    <div class="card" onclick="openModal('${j.id}')">
      <div class="card-img" data-name="${j.nome}" style="background:${catColor[j.cat]||'#f0f0f0'}">${LOCAL_IMGS[j.nome]?'':'⏰'}</div>
      <div class="card-body">
        <div class="card-id">${j.id}</div>
        <div class="card-name">${j.nome}</div>
        ${j.editora&&j.editora!=='—'?`<div class="card-pub">${j.editora}</div>`:''}
        <div class="card-tags">
          <span class="tag tc">${j.cat}</span>
          ${j.anos?`<span class="tag ${yearClass[j.anos]||'tyt'}">${j.anos==='Todos'?'Todos':j.anos}</span>`:''}
          ${j.jog?`<span class="tag tp">👥 ${j.jog}</span>`:''}
        </div>
      </div>
      ${j.obs?`<div class="obs-dot">⚠ Incompleto</div>`:''}
    </div>`).join('');
  loadCardImages();
}

// ── Modal ─────────────────────────────────────────────────
function openModal(id){
  const j = jogos.find(x=>x.id===id);
  if(!j) return;
  const ac = ageClass[j.idade]||'ta8';
  document.getElementById('mbody').innerHTML=`
    <div class="modal-hero" id="m-hero" data-emoji="⏰">${LOCAL_IMGS[j.nome]?'':'⏰'}</div>
    <div class="modal-body">
      <div class="mid">${j.id}</div>
      <div class="mname">${j.nome}</div>
      ${j.editora&&j.editora!=='—'?`<div class="mpub">${j.editora}</div>`:'<div class="mpub" style="color:#ddd">Editora não cadastrada</div>'}
      <div class="mtags">
        <span class="tag tc">${j.cat}</span>
        <span class="tag ${ac}">${j.idade}</span>
        ${j.anos?`<span class="tag ${yearClass[j.anos]||'tyt'}">${j.anos==='Todos'?'Todos os anos':j.anos}</span>`:''}
        ${j.jog?`<span class="tag tp">👥 ${j.jog} jogadores</span>`:''}
      </div>
      ${j.obs?`<div class="mobs"><strong>⚠ Atenção:</strong> ${j.obs}</div>`:''}
      <div class="msec">
        <h3>Componentes</h3>
        <p>${j.comp&&j.comp!=='—'?j.comp:'<span style="color:#bbb;font-style:italic">Componentes não cadastrados.</span>'}</p>
      </div>
      <div class="msec">
        <h3>Como Jogar</h3>
        <div class="mrules ${j.regras?'':'empty-rules'}">${j.regras||'Regras não cadastradas.'}</div>
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
  fetchHeroImage(j.nome);
}

function closeModal(e){
  if(e && e.target!==document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal({}); });

// ── Init ──────────────────────────────────────────────────
buildFilters();
render();
</script>
